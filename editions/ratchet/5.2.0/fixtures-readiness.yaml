# Acceptance fixtures for the readiness report (spec-readiness.md). One entry per fixture.
# Each fixture is self-contained: `profile` is the whole profile as the tool reads it (or `profile_text`, raw file
# content, when the file must fail to parse). `built_from` says how it differs from the base profile it was built from.
# `today` is the evaluation date for every fixture: 2027-01-15.
# Error and warning entries name `kind` and `code`, and `location` where it matters. Compare them as a multiset: the
# tool passes a fixture when it reports exactly these entries, in any order, and a named location matches exactly.
# The readiness report has no mode of its own: errors_to_fix_first comes from the profile checker in progressive mode.
# expect: exit, ready_for and next_phase (phase numbers or null), errors_to_fix_first (exact), and where given:
#   ask_next and open (the exact sections, in readiness order), answered_sections, total_sections, items (fields of
#   named open items: confirm, assumed_default, open_fields, and has_questions meaning questions is not null),
#   exceptions (code and declared, exact), and repeat_identical (two runs give byte-identical reports).
# A fixture with profile_text expects exit 2 only, with {"ok": false, "error": "<reason>"} on standard output.
