  profile: 
    type: object
    required: 
      - name
      - description
    properties: 
      name: 
        type: string
      description: 
        type: string
  existing_tools: 
    description: "Tool already in use at each seam (loop step STEP-1 to STEP-11), or null when the seam starts as a stand-in or is built."
    type: object
    required: 
      - STEP-1
      - STEP-2
      - STEP-3
      - STEP-4
      - STEP-5
      - STEP-6
      - STEP-7
      - STEP-8
      - STEP-9
      - STEP-10
      - STEP-11
    properties: 
      STEP-1: 
        type: string
        nullable: true
      STEP-2: 
        type: string
        nullable: true
      STEP-3: 
        type: string
        nullable: true
      STEP-4: 
        type: string
        nullable: true
      STEP-5: 
        type: string
        nullable: true
      STEP-6: 
        type: string
        nullable: true
      STEP-7: 
        type: string
        nullable: true
      STEP-8: 
        type: string
        nullable: true
      STEP-9: 
        type: string
        nullable: true
      STEP-10: 
        type: string
        nullable: true
      STEP-11: 
        type: string
        nullable: true
  jurisdictions: 
    description: Overlay only. The core model names no jurisdiction.
    type: array
    items: 
      type: object
      required: 
        - id
        - incident_clocks
      properties: 
        id: 
          type: string
        incident_clocks: 
          type: array
          items: 
            type: object
            required: 
              - event
              - hours
              - authority
            properties: 
              event: 
                type: string
              hours: 
                type: number
                minimum: 0
              authority: 
                type: string
  delivery: 
    type: object
    required: 
      - deploy_cadence
      - starting_cadence_rung
      - standard_change_preapproval
    properties: 
      security_test_time_target_minutes: 
        type: number
        minimum: 1
        description: "Security checks aim for test time strictly below this many minutes at every delivery stage. The shipped default is 10 minutes when this optional field is absent. The organization may set another target here. Measures report stage test time and the share of runs below the effective target. This objective does not change a gate's timeout or failure posture."
      metric_tolerance: 
        type: string
        nullable: true
        description: "The tolerance for the five delivery metrics of the services under test, set by each service owner before phase 2 begins, with who set it. Phase 2's exit test and the stop conditions read it."
      deploy_cadence: 
        type: string
        enum: 
          - continuous
          - daily
          - weekly
          - release-train
          - quarterly
      starting_cadence_rung: 
        type: string
        enum: 
          - periodic
          - scheduled
          - continuous
      standard_change_preapproval: 
        type: boolean
  ownership: 
    description: The three ownership choices worked as scenarios in the reference ownership scenarios.
    type: object
    required: 
      - q1_checking_team
      - q2_runtime_producer
      - q3_promotion_authority
    properties: 
      q1_checking_team: 
        type: string
        enum: 
          - one-team
          - sibling
          - second-line
          - split
        description: "Where the team that checks the agents' work sits. one-team: one platform team runs everything. sibling: a separate assurance team beside the platform team, under the same security leader. second-line: the assurance team reports to a risk function independent of the teams that build and run the system, the second line in the three-lines model. split: authorization sits with infrastructure or identity and access management, and evidence and evaluation with an assurance team."
      q2_runtime_producer: 
        type: string
        enum: 
          - platform
          - red-team
          - vendor
          - product
      q3_promotion_authority: 
        type: string
        enum: 
          - ai-governance
          - security-leadership
          - joint-board
          - evaluation-team
  separation: 
    description: Team names for the roles the four rules keep apart.
    type: object
    required: 
      - producer_team
      - approver_team
      - fixture_oracle_owner_team
      - verifier_team
      - fix_author_team
      - closure_acceptor_team
      - business_risk_owner_role
      - security_risk_owner_role
      - control_plane_operator_role
      - platform_operator_role
    properties: 
      producer_team: 
        type: string
      approver_team: 
        type: string
      fixture_oracle_owner_team: 
        type: string
      verifier_team: 
        type: string
      fix_author_team: 
        type: string
      closure_acceptor_team: 
        type: string
      evaluation_team: 
        type: string
        nullable: true
        description: "The team that runs evaluation: matched evaluations, tool yield, road metrics, catch-layer assignment and drift reports. Phase 3 is the first phase in which the verifier and the evaluator run as systems, so it cannot start until this team is named, and it must differ from the verifier team, the paved-road owner, the tool owner and the portfolio decision owner."
      purple_team: 
        type: string
        nullable: true
        description: "Optional: the purple team, which joins attack and defense. Its AI turns validated findings into proposed detections and kept regression tests, runs the scheduled re-proof of kept tests and supplies seed material for the approval and review gates. It may be the team that runs the agents. It must differ from the verifier team, the team that owns proof conditions, the security risk owner and, when named, the detection owner team, so it never accepts the kept tests, re-proof results, retirements or detections its own AI proposes."
      detection_owner_team: 
        type: string
        nullable: true
        description: "Optional: the defensive team that reviews, accepts, owns and deploys the detections the purple team's AI proposes. When named, it must differ from the purple team."
      team_definition: 
        type: string
        nullable: true
        description: "Organization choice, no core default: what counts as one team when the separation rules compare team names, for example a reporting line up to a named management level, a cost center, or a delivery pod. Name it so two entries count as the same team exactly when they share the incentives, manager pressure, access and blind spots the separation is meant to split. Recorded, not enforced; the checker compares the names the profile gives."
      internal_audit_role: 
        type: string
        enum: 
          - verifier
          - closure-acceptor
          - observer
          - not-involved
        nullable: true
        description: "Organization choice, no core default: where internal audit sits. verifier or closure-acceptor gives it an operating role in the loop; observer means it reads the record and relies on it for its own assurance without taking part; not-involved leaves it out. An operating role draws a warning that asks the profile to record how audit keeps its independence."
      program_decision_owner_role: 
        type: string
        nullable: true
        description: "The executive who approves phases 1 and 2 and names the phase 1 roles. Accepts a phase_1_only exception before the risk owners are named, sets the default fix cap, and may not confirm escapes; while it is unanswered the checks that compare against it stay silent. Must not be the producer team or the verifier team."
      business_risk_owner_role: 
        type: string
        description: "The business owner accountable for the unit's financial results, who accepts residual business risk and ship-through decisions. Must not be the producer (discoverer and proposer) or verifier."
      security_risk_owner_role: 
        type: string
        description: The security function or a risk function independent of the teams that build and run the system (the second line in the three-lines model) that sets posture thresholds and concurs on ship-through. Must not be the producer (proposer).
      control_plane_operator_role: 
        type: string
        description: "Role in the assurance unit that operates and administers the control plane: authorization service, policy engine, grant store, leases, model-boundary gates, audit, evidence stores and keys, only through the privileged access broker under dual control. Must not be the platform operator, the producer or the verifier."
      team_ids: 
        type: object
        nullable: true
        description: "Optional: a stable id for each team, keyed by the team name as the role fields write it. An id never changes: a renamed team keeps its id under its new name, so a separation and a patch that cite the id stay valid, and a rename is never a reason to accept a patch again. A merger or a split is a change of fact and gets new ids. Two names may not share an id."
      platform_operator_role: 
        type: string
        description: "Role that operates the shared orchestration services (run record, workflow, dispatch, model gateway routing and serving) and the execution cells. Must not be the control-plane operator."
  ledger_write_path: 
    type: string
    enum: 
      - intake-only
      - direct
  road: 
    description: "The paved road the organization already has, as the existing-tool rung for the road plane (null means the asset starts as a stand-in or is built), and the roles around it."
    type: object
    required: 
      - owner_team
      - metrics_owner_team
      - assets
      - conformance_basis
      - conformance_granularity
      - vet_each_version
      - covered_sample_share
      - escape_hatch_reinstates_regressions
      - authorship_labeling
      - enforced_preferred
      - opt_in_coverage_requires_call_site_check
    properties: 
      owner_team: 
        type: string
        description: Shared platform or developer-experience team that owns the catalog. Must not be the verifier of retirement claims.
      metrics_owner_team: 
        type: string
        description: "Team that computes road metrics. Must not be the road owner, so the road team never grades its own road."
      assets: 
        type: object
        required: 
          - developer_portal
          - base_images
          - container_platform_policy
          - api_auth_libraries
          - gateway
          - secure_defaults_linters
        properties: 
          developer_portal: 
            type: string
            nullable: true
          base_images: 
            type: string
            nullable: true
          container_platform_policy: 
            type: string
            nullable: true
          api_auth_libraries: 
            type: string
            nullable: true
          gateway: 
            type: string
            nullable: true
          secure_defaults_linters: 
            type: string
            nullable: true
      conformance_basis: 
        type: string
        enum: 
          - deployed-state
          - declared
        description: deployed-state is required by the rules; declared is accepted by the schema only so the checker can name the error (F30).
      conformance_granularity: 
        type: string
        enum: 
          - call-site
          - service
        description: "call-site is required by the rules: a service is on-road only at the call sites a deterministic static or build-time check proves use a vetted entry. service is accepted by the schema only so the checker can name the error (F36)."
      vet_each_version: 
        type: boolean
        description: "Must be true: only entry versions with a current road assurance record confer covered-by-road status (F37)."
      covered_sample_share: 
        type: number
        minimum: 0
        description: "Share (0 to 1) of covered-by-road call sites sampled and tested anyway each cycle, so analysis tailoring is never blind. 0 is accepted by the schema only so the checker can name the error (F36)."
      escape_hatch_reinstates_regressions: 
        type: boolean
      authorship_labeling: 
        type: string
        enum: 
          - labeled
          - unlabeled
        description: "Whether changes can be labeled human-written or agent-generated, for the on-road versus off-road split."
      enforced_preferred: 
        type: boolean
        description: "Prefer enforced road entries (compile-time check, framework default, platform policy) over opt-in libraries when choosing what goes on the road. false is accepted with a warning."
      opt_in_coverage_requires_call_site_check: 
        type: boolean
        description: "Must be true: an opt-in entry confers covered-by-road status only at call sites the deterministic conformance check proves. false is accepted by the schema only so the checker can name the error."
  tools: 
