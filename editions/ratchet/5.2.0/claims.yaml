  - id: CL-49
    statement: "Security debt is the security share of quality debt, which every quality draws from one engineering pool, so findings validated beyond an owning team's fix capacity add interest, in team time lost, without reducing risk."
    type: organizational
    premise_group: Capacity
    verdict: honest bet
    strength: weak
    strength_reason: "Technical debt is shown to cost a large share of developer time (23% measured longitudinally, 36% self-estimated), and security risk can be managed as technical debt in concept; no study measures security debt's share of that time, and a 2025 interview study finds limited empirical evidence on security debt practice."
    untested: true
    load: The fix cap and its saturation signal read as debt service; security paying for the fix path; the owning-team time lost to security debt measured beside the counts.
    falsifier: "Owning teams' reported time lost to security debt does not rise while validated findings arrive above their fix cap, or findings above the cap close as fast as those below it without taking time from other quality work."
    if_it_flips: "Fix capacity is read as a security queue of its own, the fix cap governs on queue age alone, and the time lost to security debt stays a descriptive measure beside the counts."
    extrapolation: "From technical debt in general, measured mostly through developers' reports in a few companies, to security findings in this loop; and from a conceptual framing of security as technical debt to the claim that both draw on one engineering pool, so that findings beyond fix capacity add interest without reducing risk."
    measured_by: 
