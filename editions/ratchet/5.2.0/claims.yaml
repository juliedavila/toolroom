  - id: CL-50
    statement: "An auditor or assurance reviewer relies on a record Ratchet generates, such as a closure record, a freshness report or figures computed from the finding ledger, when its accuracy and completeness can be tested, usually through the controls over the system that produces it."
    type: organizational
    premise_group: People and organization
    verdict: holds
    strength: strong
    strength_reason: "The audit standards explicitly allow reliance on information produced by the entity when its reliability, accuracy and completeness are tested. The staff observations reinforce that condition in practice. Research literature on security assurance is thin and treats such records as corroborating. Applying the standards to this program still requires the reviewer to test the producing system and the records for the purpose at hand."
    untested: false
    load: "The three relief marks for manual evidence gathering for audits: the closure record, the kept-test freshness report and the remediation measures."
    falsifier: "An assurance reviewer refuses a generated record even after its accuracy, completeness, precision and detail have been tested for the review purpose, or still requires the same record to be gathered by hand."
    if_it_flips: "The three relief marks fall to none in that organization's reading and the manual work stays; the organization's own patches keep the evidence gathering as a manual duty, and the program still produces the records."
    extrapolation: From the standards for audit evidence to the generated records this program offers an assurance reviewer. The organization must establish the applicable review purpose and test the records and their producing controls.
    measured_by: 
      []
    evidence: 
      - source: literature synthesis (2026)
        published: false
