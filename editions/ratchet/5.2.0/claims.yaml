  - id: CL-18
    statement: "Remediation throughput is the binding constraint, ahead of validation capability, so validation must be gated on fix capacity."
    type: organizational
    premise_group: People and organization
    verdict: honest bet
    strength: moderate
    strength_reason: "Two large vendor datasets show remediation running behind discovery in organizations of every size: about one in ten open vulnerabilities closed a month across nearly 300 organizations, and flaws left open past a year in 71% of organizations. Neither is peer reviewed, neither measures this loop, and the same remediation study finds that keeping up with the exploited subset is possible when an organization knows which to fix first, though most barely keep up and about a third gain ground, so the grade stays moderate."
    untested: false
    load: "Capacity-gated dispatch, WIP caps, the diagnosis reviewer 4 on the adversarial review panel says is missing; if true and ignored, the program adds findings without reducing risk."
    falsifier: The phase 1 and phase 2 flow ledgers show fix queue time is a small share of loop time.
    if_it_flips: "Fix queue time turns out to be a small share of loop time, so the opening leads with trust or with how sweeps decay in place of capacity, and dispatch stops waiting on fix capacity. The saturation setting in the profile stays unused."
    extrapolation: "From scanner-reported vulnerabilities across whole estates (data from 2019) and application flaws in one vendor's scans to validated findings with a demonstrated path in this loop. Both show remediation lagging discovery; neither shows that it binds ahead of validation capability, which is the part only the flow ledger can settle."
    measured_by: 
      - U-18
      - U-21
      - U-63
      - U-64
    evidence: 
      - source: structured adversarial review of the design (2026)
        published: false
      - source: "Cyentia Institute, 2019, Prioritization to Prediction Vol. 3"
