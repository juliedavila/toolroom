# Ratchet edition 5.2.0. Generated; do not edit.
version: 1
scenarios: 
  - id: F01
    title: Policy decision point unreachable
    elements: 
      - s3.policy-decision-point
      - s3.action-control-service
    trigger: PDP pods down or network partition between broker and PDP.
    required_behavior: Every pending ActionSpec is denied with reason policy-unavailable; no grant issued; workflows wait.
    invariant: I1
    detection: Denial-rate alert by reason; PDP health probe.
    runbook: RB-F01
    test: 
      kind: pipeline
      steps: Stop the PDP in the integration environment; submit an approved ActionSpec; assert denial with reason and zero target-side effects.
  - id: F02
    title: Audit sink unavailable
    elements: 
      - s3.protected-audit
      - s3.bounded-runner
    trigger: Audit log write fails or times out.
    required_behavior: High-risk execution does not start; in-flight actions finish their current step and stop; receipts marked audit-gap.
    invariant: I6
    detection: Audit write failure alert; runner refusals by reason.
    runbook: RB-F02
    test: 
      kind: pipeline
      steps: Disable the audit sink; request a granted action; assert the runner aborts before the action.
  - id: F03
    title: Worker crashes after an action was sent
    elements: 
      - s2.workflow-worker-app
      - s2.workflow-engine
      - s3.observation-receipt
    trigger: Worker process killed between dispatch and receipt.
    required_behavior: "On restart the attempt is effect-uncertain, not succeeded or failed; reconciliation reads target and audit before any retry; retry needs a new grant."
    invariant: I6
    detection: Attempts in effect-uncertain older than the reconciliation window.
    runbook: RB-F03
    test: 
      kind: pipeline
      steps: Kill the worker after send; restart; assert state effect-uncertain and that no automatic re-execution happened.
  - id: F04
    title: Broker delivers a dispatch twice
    elements: 
      - s2.dispatch-queue
      - s2.producer-adapters
      - s3.grant-approval-store
    trigger: Consumer rebalance or redelivery after timeout.
    required_behavior: One effect; two attempt-log entries; the second consume of the grant is denied.
    invariant: I6
    detection: Duplicate idempotency key counter.
    runbook: RB-F04
    test: 
      kind: pipeline
      steps: Inject duplicate delivery of one dispatch; assert one effect in target logs and one denied grant consume.
  - id: F05
    title: Broker partition splits producers from the outbox
    elements: 
      - s2.dispatch-queue
      - s2.workflow-state-store
    trigger: Network partition isolating a broker node.
    required_behavior: Outbox holds undelivered dispatches; no dispatch is marked sent without broker acknowledgment; ordering per workflow preserved on heal.
    invariant: I6
    detection: Outbox lag alert.
    runbook: RB-F05
    test: 
      kind: game-day
      steps: Partition one broker node for 30 minutes under load; assert zero lost and zero duplicated effects after heal.
  - id: F06
    title: Clock skew around grant expiry
    elements: 
      - s3.grant-approval-store
      - s3.local-enforcement-point
    trigger: Runner clock ahead or behind the grant store by more than the skew margin.
    required_behavior: "Expiry evaluated against the grant store's trusted time with a skew margin; an expired grant is denied even if the runner's clock says otherwise."
    invariant: I1
    detection: Clock drift monitoring on runners; denials with reason expired.
    runbook: RB-F06
    test: 
      kind: pipeline
      steps: Skew the runner clock by 10 minutes; use a grant 1 minute past expiry; assert denial.
