    detection: Stage outcome posture-applied; override records.
    runbook: RB-F14
    test: 
      kind: game-day
      steps: "Block platform access from a pipeline whose regression protects a crown-jewel path and one protecting a critical path; deploy a change touching each regression's dependencies; assert both held; record a ship-through without security concurrence and assert it is refused; record one with both signers; assert expiry and a replay scheduled on recovery."
  - id: F15
