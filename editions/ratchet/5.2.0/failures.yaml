      - people.risk-acceptance-owner
      - people.security-risk-owner
    trigger: "Regression stage cannot reach the platform while a service deploys a change that touches the regression's declared dependencies."
    required_behavior: "Stage applies its signed posture, fail-closed (core default for crown-jewel and critical); deploy held; ship-through is a short-lived, attributed acceptance by the business risk owner with security risk owner concurrence (signers per profile); any ship-through owes a replay on recovery."
