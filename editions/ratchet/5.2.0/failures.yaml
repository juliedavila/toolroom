      - s6.enterprise-adapters
    trigger: "Posture past expiry, signed with a revoked key, or never distributed."
    required_behavior: "The stage applies the tier default it holds offline from the profile (crown-jewel and critical fail closed; standard fails open with a record and owes a replay), never fail-closed for a standard path, so the blast radius does not grow with outage length; a missing posture with no tier default applies the profile's unattested_default; an alert fires as any posture nears expiry and the program owes a refreshed posture within its SLO."
    invariant: I4
    detection: Postures within 25% of expiry; expired-posture and tier-default applications by service and tier.
    runbook: RB-F16
    test: 
      kind: pipeline
      steps: "Ship one standard-tier and one critical-tier stage with expired postures; simulate a platform outage; assert the standard stage lets a dependency-touching deploy through with a record and an owed replay, the critical stage holds it, and the near-expiry alert fired before expiry."
