    level: actor
    kind: person
    responsibility: "Joins attack and defense around validated findings. Its AI turns each validated finding into a proposed detection for the defensive side and a proposed kept regression test, runs the scheduled re-proof of kept tests against their fixes reverted, and supplies known-bad proposals and changes for the seed sets at the approval and review gates. Everything it produces is a proposal: a kept test enters the catalog only after independent retest and verifier acceptance, a re-proof result of \"no longer fails\" moves a test only after the verifier confirms it, a detection only after the defensive side's own review, and a seed only as the sampling service draws and places it. It may be the team that runs the agents. Never the verifier team, the team that owns proof conditions, the security risk owner or the defensive team that accepts detections, so it never accepts the kept tests, re-proof results, retirements or detections its own AI proposes."
    role_class: human
    trust_zone: null
    owner: null
  - id: s6.fix-cap-gate
    name: Fix-cap gate
    aliases: 
      - Fix cap check
    system: S6
    level: component
    parent: s6.hardening-service
    kind: service
    responsibility: "Applies each owning team's fix cap: the number of open validated findings the team accepts at once, set by the team with the security role that agreed it, or the program's default cap when the team set none. It is the team WIP cap the saturation signal and the dispatcher read. The gate checks the cap when a finding is validated, before the security side prepares its fix path, so no fix path is prepared for a finding the cap would refuse, and checks it again when the complete fix path arrives, at queue entry. A validated finding whose demonstrated path reaches an asset at or above the organization's consequence line passes the cap: it enters the queue and is recorded in the fix-cap refusal log as over the cap. So does a finding that a sourced exploitation signal matches by rule (a known exploited catalog listing or observed exploitation, on its vulnerability identifier or on the component and version its weakness sits in), which also starts the organization's exploited window, from the later of validation and the signal's date; so does a finding with an external disclosure deadline; and so does a refused finding the security risk owner sends after two consecutive held reviews. Any other finding that would take the team above its cap is refused into the log with its reason and the cap in force; it stays accepted in the finding ledger and counts in every measure. While the organization has set no consequence line, no finding passes the cap on consequence; while neither the public known exploited catalog nor an observed exploitation source is wired, none passes on exploitation; and while the organization sets no exploited window, an exploited finding passes with no window and the gap is reported. Inside a consequence tier, findings waiting for room under a cap enter in order: exploited first, then by the entry point's exposure (reachable from the internet first), then automatable first, then by age. An exploitation signal, exposure and automatability never lower a posture, move a finding to a lower tier or count as evidence. Only the gate writes refusals and over-cap records; the security side's producers and the owning team cannot write, change or remove one. It decides by rule, with no model call. While the gate is unavailable, a validated finding whose disposition records a pass ground (an asset at or above the consequence line, an exploitation match or an external deadline) goes to its owning team without the gate, and every other validated finding waits with the security side with its wait measured; none is dropped. When the gate returns, it writes an over-cap record for each finding that entered while it was down, with the pass ground it entered on, after checking that ground again against its own inputs; a finding whose ground does not hold on that check goes to the security risk owner, and the records join the next refusal review."
    role_class: control
    trust_zone: control
    decision: deterministic
    owner: AppSec program (rules); each owning team with the security role that agreed its cap (cap values)
  - id: s6.fix-cap-refusal-log
    name: Fix-cap refusal log
    aliases: 
      - Refused findings log
    system: S6
    level: store
    kind: store
    responsibility: "One record for each validated finding the fix-cap gate refused entry to an owning team's queue because the team's open validated findings were already at its fix cap, and one for each finding that entered over the cap (its path reaches an asset at or above the consequence line, a sourced exploitation signal matched it, it carries an external disclosure deadline, entered while the gate was down on one of those grounds, or the security risk owner sent it): team, finding id and path key, reason, date, the cap in force with the security role that agreed it (or the program's default cap and the role that set it), the team's open validated findings at the time, and the reviews of a refusal: when, who reviewed it, and the outcome (queued once the team is below its cap, held to the next review, cap revised by the team with security, or the weakness class sent to the paved road). Only the gate writes refusals and over-cap records. The owning team reviews its refusals with the security role that agreed its cap at the profile's interval, monthly unless the organization sets another; the review may run asynchronously in the tracker, and each review record is co-signed by that security role, without which it does not count. A refused finding held at two consecutive reviews goes to the security risk owner, who sends it into the queue over the cap or records a risk acceptance with an expiry; when the acceptance expires, the finding returns to the next review. A refusal past the interval without a review is reported to the program decision owner, who holds both sides to agreed caps. A refused finding stays accepted in the finding ledger and counts in every measure; a refusal never dismisses or drops it. Append-only."
    role_class: evidence
    trust_zone: control
    owner: AppSec program (records); each owning team with the security role that agreed its cap (reviews)
    unpartitioned: Refusal records that refer to findings by id; their evidence stays in the partitioned ledger.
  - id: s5.fix-brief-builder
    name: Fix brief builder
    aliases: 
      - Fix brief
      - Weakness description for a fixing agent
    system: S5
    level: component
    parent: s5.proof-evidence-service
    kind: service
    responsibility: "Writes the description of a weakness that a fixing agent or a fix drafter receives. A brief is either written by a person, and recorded with its author and time, or derived by rule, with no model call, only from the weakness a signed proof condition names (its class, its location and the boundary that failed), a reference to the model-free reproduction's stored receipt, and the receipt fields the independent verifier constrains (step template ids, request and response status classes, assertion results, hashes). Before it issues a derived brief, it checks by rule that the brief's outsider label set covers the labels on its inputs; a derived brief carries none, so a weakness whose description needs free-text steps, the target's output or any other labeled field goes to a person, who writes the brief. It never carries outsider text, the output of a model that read outsider text, the proof condition's expected outcomes or what would show the weakness is not real, or the kept regression. Each brief records how it was made: the author, or the builder's version and the ids of the proof condition and reproduction it came from, and when. A brief the builder cannot derive waits for a person to write it. The share of briefs a person wrote, and the derivations sent to a person because a labeled field was needed, are reported each quarter."
    role_class: evidence
    trust_zone: control
    decision: deterministic
    owner: Evidence/findings product (builder); the independent security staff (person-written briefs)
  - id: s5.learning-store
    name: Learning store
    aliases: 
      - What the loop learns
      - Earned-autonomy learning store
    system: S5
    level: store
    kind: store
    responsibility: "Holds what the loop learns from its own validations and retrieves into producer context through the context compiler: worked reproductions, verdicts, and the hypotheses that held or failed, per judgment type. Only disposition review writes it; no producer or model has a write path. Partitioned by jurisdiction and business unit like the evidence it comes from, each partition under its own key, and a retrieval returns only items from the partition of the snapshot that asks; a read across partitions goes only through the review console. Each item carries its provenance: who confirmed it (a person, or the earned-autonomy grant it was validated under, labeled self-validated), the inputs it came from, and every outsider label on those inputs with its clearing record (the person, or the model-free check and its version, the time, and the fields cleared), and disposition review signs it. Provenance and signature are checked again at retrieval, by rule and with no model call. The store recomputes each item's outsider label set from its input ids when the item is written and again at retrieval, and compares it with the set the item records. An item with no provenance, an item whose outsider label was never cleared, an item whose recorded labels do not cover its inputs' labels, an item validated under a grant that has lapsed, and an item whose grant status the store cannot read are withheld from producer context and logged as flagged retrievals. Flagged retrievals are reported each week. The share that trace to untagged stored items is reported each quarter as the trend and should fall, and the label mismatches found at write and at retrieval are reported each quarter; a rising share or any mismatch means items are entering without their full provenance. Append-only."
    role_class: evidence
    trust_zone: control
    learning_store: true
    owner: Evidence/findings product + security/risk owners
    partitioned_by: 
      - jurisdiction
      - line_of_business
  - id: s5.exposed-secret-intake
    name: Exposed-secret intake
    aliases: 
      - Secret intake
    system: S5
    level: component
    parent: s5.proof-evidence-service
    kind: service
    responsibility: "Receives every exposed-credential hit: a secret scanner's export, or a credential a person found and entered at its own form, so exposed secrets need no tool-portfolio module. Before anything stores the hit it replaces the value with a fingerprint and keeps the issuer, the identifier, where it was exposed, and the scan rule and rule version; no lead, record, model request or other part ever receives the value from it. It looks up the credential type's verification recipe in the regression catalog, and only when that recipe needs a status probe does it seal the value under the owning team's key in key management, to be released to the credential lease broker for that probe series and destroyed after it. Deterministic, no model. A hit it cannot parse is held with its value sealed and alerts the evidence owner; it is never forwarded with the value."
    role_class: evidence
    trust_zone: control
    owner: Evidence/findings product + security/risk owners
  - id: ext.known-exploited-catalog
    name: Public known-exploited vulnerability catalog
    aliases: 
      - Known exploited vulnerabilities list
    system: shared:EXT
    level: external
    kind: external-system
    responsibility: "A public catalog of vulnerabilities with evidence of exploitation in the wild, published as structured data any organization can fetch: per entry, the vulnerability identifier, the vendor or project, the product, the vulnerability's name and the date added. It states no affected versions. Read by the fix-cap gate as structured fields only and matched to findings by rule; it never creates a finding, never lowers a posture and never counts as evidence. Part of the core, so the exploitation pass works without the consequence-gates module."
    role_class: existing
    trust_zone: shared:existing
    owner: ""
  - id: people.held-out-assessors
    name: Held-out assessors
    aliases: 
      - Outside red team for Ratchet
    system: shared:PEOPLE
    level: actor
    kind: person
    responsibility: "A team outside the program, internal or external, that reports to neither the assurance unit nor the team that runs the agents. Runs a recurring exercise against Ratchet's own control and evidence planes (the authorization service, grant store, credential leases, model-boundary gates, release pipeline, key management, evidence stores and the privileged access broker), under scope and rules the security risk owner approves, at least once a year and after any change that widens what the control plane allows. Its findings enter the record like any other finding: intake, independent reproduction and disposition, with the team that owns the part fixing it. Never a producer team, the verifier team or the control-plane operators."
    role_class: human
    trust_zone: null
    owner: null
  - id: s6.team-regression-suite
    name: Team regression suite
    system: S6
    level: external
    kind: external-system
    responsibility: "The existing team repository and CI suite own and run each component-local instance regression contributed in the co-created correction pull request. Its test source and local outcomes are visible to coding agents. Only the owning team changes or retires it through normal review. The automatic inventory publishes repository revision, test version, declared dependencies, configuration and actual CI run observations through a read-only source interface. It never receives proof conditions, chained-path validations or protected RegressionSpec content."
    role_class: existing
    trust_zone: shared:existing
    owner: Owning engineering team
    agent_reachable: true
  - id: s6.kept-test-mirror
    name: Kept-test mirror
    system: S6
    level: store
    kind: registry
    responsibility: "Security automatically inventories every kept test, both the team-owned instance tests and metadata for the independent aggregate and class-level checks. Source credentials can only read repositories and CI history. The mirror can append observations and submit drift findings but cannot write a team repository, pull request, suite, test status or policy. Enrollment is append-only, so a removed test remains in the expected inventory. Each observation binds the test id and version, finding and class, team and suite, repository revision, dependency scope, configuration, run and result, observed time, source and collection outcome. Removed, skipped and failing tests each submit a distinct drift finding to the normal loop, deduplicated by test version and drift episode. Unreachable sources, missing runs, stale observations and missing dependencies read unknown. A retired test retains its history and the authorized lifecycle decision. Near-JIT risk review reads current protection only when a passing enabled test was actually run at the revision, configuration and dependency scope being assessed within the review's stated freshness window. Passing instance evidence never substitutes for independent aggregate validation or grants authority. The mirror emits metadata and source references only, never protected test content. It reports contributed-test survival and promotion to class-level guardrails with observation coverage and cohort denominators."
    role_class: evidence
    trust_zone: control
    owner: Independent security verification owner
    partitioned_by: 
      - jurisdiction
      - line_of_business
  - id: jig:secure-creation
    name: "Jig (secure creation at the developer's edit)"
    aliases: 
      - Secure-creation loop
      - Secure-creation companion
    system: shared:EXT
    level: container
    kind: external-system
    responsibility: "The organization's secure-creation loop, where developers and coding agents write code, drawn as its planes: the context plane that steers what the agent copies, the inner loop of the agent's turn, the commit and push boundary, the pull-request plane and the measurement plane. Ratchet is its learning plane. A sibling design that runs alone or beside this loop. Coding agents run inside it, so it is agent-reachable: it receives proven failure classes, road entries with a current assurance record, derived checks that report pass or fail and fix briefs, and never a kept regression, a proof condition, an expected-outcome hash or text an outsider wrote. Its controlled-environment premise is declared as assumptions, each with the parts that rely on it and a fallback that does not."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    owner: null
    module: secure-creation
    assumptions: 
      - id: managed-endpoints
        statement: "Developer endpoints are managed: device management, endpoint detection, data-loss prevention and governance of agents and editor extensions."
        relied_on_by: 
          - jig:harness-full-parity
          - jig:harness-no-pinning
          - jig:harness-no-stop-gate
          - jig:edit-checks
          - jig:stop-gate
          - jig:precommit-gate
        fallback: "Rule 2 falls back to the server-side required checks: a local check that was skipped or reconfigured is caught at the protected branch, where rule 1 also holds."
        fallback_by: 
          - jig:protected-branch
      - id: mirrored-dependencies
        statement: "Developers and their build jobs install dependencies only through the organization's mirrors."
        relied_on_by: 
          - jig:p55-r8
          - jig:stop-gate
        fallback: "The dependency policy runs again in the server-side required checks against the mirror's admission record, so a dependency from outside the mirror fails before merge."
        fallback_by: 
          - jig:protected-branch
      - id: code-from-engineers
        statement: "Code in the organization's repositories arrives only from its own engineers, through the protected branch."
        relied_on_by: 
          - jig:p55-r8
        fallback: "Text from an outside contributor is outsider text: it reaches the coding agent only through the quarantined reader, and the change still merges only through the protected branch with an independent reviewer."
        fallback_by: 
          - jig:quarantined-reader
          - jig:reader-schema-gate
          - jig:protected-branch
      - id: locked-policy
        statement: Policy files and hook configuration are delivered and locked centrally on every endpoint.
        relied_on_by: 
          - jig:harness-full-parity
          - jig:harness-no-pinning
          - jig:harness-no-stop-gate
          - jig:edit-checks
          - jig:stop-gate
          - jig:precommit-gate
        fallback: The same suite at the same versions runs as server-side required checks that the agent cannot skip or reconfigure.
        fallback_by: 
          - jig:protected-branch
          - jig:check-suite
  - id: jig:context-plane
    name: "Context plane: paved-road guidance and skills"
    aliases: 
      - Jig context plane
    system: shared:EXT
    level: component
    parent: jig:secure-creation
    kind: registry
    responsibility: "What the coding agent copies from: paved-road references in the codebase, a skill per paved road, short instruction files under code ownership, the security constraints written into the task's spec for high-risk work, and the diff-size budget per task. Steers toward proven classes and toward road entries whose assurance record is current. Holds proven classes until the policy-owning team turns each into a rule. Guidance only: instruction files are hygiene and enforce nothing. It keeps only the current version of each proven class, replacing any earlier spans and consequence tier when a class gains an open member. It exposes road assurance per entry version only as current or not current, with no class outcomes or failure or withdrawal reasons. The model provider is a reader through the coding agent's model route, and guidance sent on that route obeys the same projection limits."
