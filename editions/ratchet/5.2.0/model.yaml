    responsibility: "Confirm/reject/unresolved with explicit scope. A negative or dismissive producer or model output is recorded but never counts as coverage evidence; only a passing deterministic regression or a human-accepted negative test does. Independent institutional staff accept material assurance or exceptions. When an accepted finding's weakness reached production where an attacker can reach it through the running system, writes its escape record: detection source and role, the role and method that attributed it to a deployment from the machine deployment record, or no attributable deployment when none shipped it, and whether it fell within the organization's detection window, the confirming role (never a detecting role, the producer team or the program decision owner), and its cost from the assets the path reached, the closure record and the verified fix. A reproduction that failed with no observed stop is recorded unresolved, reason reproduction failed, and never rejected. Records a finding held only from an independent reproduction whose receipt shows a control refusing the path short of the proof condition, under a finding kind that declares held, and only with the id of its held-dependency test in the regression catalog; it refuses a held disposition without one, and a control nobody observed in a reproduction holds nothing. It reads each held-dependency test's status from the catalog: while the test is missing, has no owner or interval, or is past its interval, the finding reads unresolved; when the test's run meets the proof condition, it records the finding confirmed with the reach that run demonstrated and the tier recorded at hold, with no new triage and no model, and sends it on like any accepted finding."
