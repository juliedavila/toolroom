      - s3.policy-release-pipeline
      - s5.learning-store
      - s4.qualification-route-registry
  - name: ReplayRequest
    description: "Stage run id, service, deployed candidate digest, regression test ids, declared dependency references touched by the deploy, window bundle id used. Recorded for accounting and replay-owed tracking; the window bundle already authorizes the replay."
    produced_by: 
      - s6.enterprise-adapters
      - s3.gate-failure-policy
    consumed_by: 
      - s6.retest-regression-planner
  - name: ReplayWindowBundle
    description: "Bundle id, service, deploy window start and end, pre-authorized replay class and policy version, one single-use grant and scoped lease per declared regression test (ActionSpec hash bound), each test's registered expected-outcome hash, destination allowlist, signature and key reference. Verified offline by the local enforcement point; expires at window end."
    produced_by: 
      - s3.credential-lease-broker
    consumed_by: 
      - s6.enterprise-adapters
      - s3.local-enforcement-point
  - name: ReplayVerdict
    description: "Stage run id, test id, grant id, verdict (pass | fail | unknown) with reason, observed-outcome hash over the test's observation projection, expected-outcome hash, receipt reference, cleanup status. Computed mechanically; never a model judgment."
    produced_by: 
      - s3.replay-verdict
    consumed_by: 
      - s6.enterprise-adapters
      - s5.evidence-intake-validator
      - s6.regression-catalog
  - name: AuditRecord
    description: "Record id, previous-record hash, grant or session id, action, target, time, outcome, cleanup status. Release admission and rollback records also carry cell_id, highest_verified_sequence, previous_running_sequence, admitted_sequence, release_digest and rollback_number, so each accepted older start can be matched to exactly one protected pipeline rollback event. Written before the effect; append-only. A weights release the route registry refuses is written as a record too, with the release as its target, the check that failed as its outcome and no grant."
    produced_by: 
      - s3.bounded-runner
      - s3.local-audit-buffer
      - s3.local-enforcement-point
      - s4.qualification-route-registry
    consumed_by: 
      - s3.local-audit-buffer
      - s3.protected-audit
  - name: PolicyBundle
    description: "Bundle id and version, target (policy engine, model-boundary gate, enforcement point, route table, store schema), change as code, policy unit test results, deny-diff (what newly allows and what newly denies), widening flag and security risk owner approval when widening, rollout stage, rollback reference, signature and key reference."
    produced_by: 
      - s3.policy-release-pipeline
    consumed_by: 
      - s3.policy-decision-point
      - s4.request-data-gate
      - s3.local-enforcement-point
      - s3.protected-audit
      - s3.policy-release-pipeline
  - name: ServiceIndicator
    description: "Indicator id (approval latency, grant success, intake-to-verified, evidence durability, posture freshness, canary freshness, draw and drill freshness), source part, window, good and total events or freshness age, observed-at. Missing data reads as unknown. Also carries postmortem trigger events as they happen: an effect outside an approved scope or with no approval, a closure contradicted by a later confirmed escape on its path key, and a seeded proposal or change that reached execution or merged, each with references to its records."
    produced_by: 
      - s3.policy-decision-point
      - s5.evidence-intake-validator
      - s3.gate-failure-policy
      - s7.sampling-service
      - s7.failover-drill
      - s7.evaluation-operations
      - s3.protected-audit
      - s5.finding-ledger
    consumed_by: 
      - s7.reliability-monitor
  - name: ErrorBudgetStatus
    description: "Objective id, budget remaining over the rolling window, burn rate, freeze flag, exception id when the security risk owner allowed a release during a freeze, paging target role."
    produced_by: 
      - s7.reliability-monitor
    consumed_by: 
      - s3.policy-release-pipeline
      - people.control-plane-operator
    measures: Error budget remaining and burn rate for each service level objective over its rolling window
  - name: ModelResponse
    description: "Raw model output for one attempt: attempt id, route, model version, content (untrusted), usage. Never authority; it reaches producers only after the response-proposal gate validates it against the proposal schema. Carries the outsider label set of the request it answers, which the request-data gate records under the attempt id."
    produced_by: 
      - s4.inference-endpoints
      - ext.hosted-frontier-endpoint
    consumed_by: 
      - s4.response-proposal-gate
  - name: FeedbackProposal
    description: "Proposed change to context facts or rules from evaluation: target, proposed value, evidence references, author, expiry. Applies only after the context owner reviews it."
    produced_by: 
      - s7.evaluation-operations
    consumed_by: 
      - s1.context-service
  - name: PromotionDecision
    description: "Route or producer configuration id and version, decision (promote, narrow, demote, requalify), evidence references, deciding authority (never evaluation engineering), decided-at."
    produced_by: 
      - s7.promotion-review
    consumed_by: 
      - s4.qualification-route-registry
      - s2.approved-producers
  - name: GateOutcome
    description: "Per gate and path: outage holds, deploys let through with a record, ship-throughs with acceptance ids, post-recovery replay results, deploys held without a regression failure, posture and window-bundle expiries. Feeds the posture review."
    produced_by: 
      - s6.enterprise-adapters
    consumed_by: 
      - s3.gate-failure-policy
  - name: RouteQualification
    description: "Route id, rung (frontier, self-hosted, no-agent, manual), qualification status, last passed drill date, stale flag, and for a self-hosted route the digest of the weights it is pinned to. Structured fields only."
    produced_by: 
      - s4.qualification-route-registry
    consumed_by: 
      - s7.failover-drill
      - s4.request-data-gate
      - s4.model-data-gateway
  - name: TypedDecision
    description: "One model judgment of a declared decision type: decision_type (lead-triage | queue-confidence | scenario-order | tier-draft | gate-health | output-flag), subject reference, choice from the type's fixed answer set, stated probability, route id and version, the qualification record it ran under, and fallback_used. Advisory by construction: it may rank, route or flag, never authorize, count as coverage, set a verdict, close a finding or attest a tier. Inputs that carry attacker-written text keep their untrusted marking; the choice itself is structured."
    produced_by: 
      - s2.typed-decision-worker
    consumed_by: 
      - s1.tool-lead-store
      - s6.developer-queue-filter
      - s2.workflow-worker-app
      - s2.operator-interface
      - s7.reliability-monitor
      - s7.matched-evaluation-executor
      - s7.sampling-service
  - name: SourceRecord
    description: "One normalized record from a source system: source system and record id, record kind (change, build, deploy, identity, component inventory, threat signal), observed or declared, observed-at, the query window and cursor it came from, returned and total-or-unknown, truncation, and a reference to the raw record. Untrusted text in a source record keeps its untrusted marking. The form in which the source adapters hand facts to the rest of the context plane."
    produced_by: 
      - s1.source-adapters
      - s1.source-facts
    consumed_by: 
      - s1.identity-validity-resolver
      - s1.source-facts
      - s5.path-impact-graph
      - s5.failure-class-registry
      - s1.consequence-register
  - name: RouteUsage
    description: "Attempt id and run id, route id and version, model version, input and output size, cost, and the gate's result (passed | rejected, with the schema rule that rejected it). Carries no response content. The record that shows which route served each attempt, for cost and for data residency."
    produced_by: 
      - s4.response-proposal-gate
    consumed_by: 
      - s4.route-usage-receipts
  - name: CredentialLease
    description: "Lease id, the exact grant id it serves, test identity, scope (the target and actions the grant names, nothing more), not-before and expiry, signature and key reference, revocation status. Short-lived and single-purpose; a long-lived secret never crosses into a cell. A restore credential is a lease of this shape issued with an injection grant: its scope is the restore alone, it is sealed to the cell that holds the restore grant, it travels inside that grant, and it is valid until the grant's expiry plus the cell's clock-skew margin."
    produced_by: 
      - s3.credential-lease-broker
    consumed_by: 
      - s3.bounded-runner
      - s3.action-control-service
      - s3.local-enforcement-point
  - name: DefensiveObservation
    description: "Observation id, detection source, observed-at, target and identity seen, the execution receipt it matches or none (unexplained activity), detection and determination times, and the incident reference when one opened. Recorded by the defensive side under its own control, so a test's effect can be reconciled with what defenders saw."
    produced_by: 
      - ext.soc-incident-response
    consumed_by: 
      - s5.evidence-intake-validator
  - name: ReviewClaim
    description: "Claim id, origin (threat model | security review), service and component, the stated intent or invariant, author role, date, status (unverified | contradicted | demonstrated) and the evidence references that contradict or demonstrate it. A claim is what a review says should hold; it is never a fact or coverage. Free text in a claim keeps its untrusted marking."
    produced_by: 
      - ext.security-review-practice
      - s1.normative-store
    consumed_by: 
      - s1.normative-store
      - s7.tool-yield-evaluator
  - name: GatedResponse
    description: "Attempt id, route and model version, the declared output schema and version, the schema-valid output, and the validation result. The response-proposal gate's output when the result is a classification, a typed answer or a draft instead of a finding, action or patch. Output that came from untrusted input keeps its untrusted marking; passing the schema makes it well formed, never trusted."
    produced_by: 
      - s4.response-proposal-gate
    consumed_by: 
      - s2.quarantined-lead-reader
      - s2.typed-decision-worker
      - s2.proof-condition-drafter
  - name: ApprovalOutcome
    description: "ActionSpec hash, or for a clearing of outsider-labeled text the labeled record's id and the fields asked to clear; approver identity, decision (approved | edited | rejected; for a clearing, cleared | kept labeled), the edit when edited, and the time from queue entry to decision. Says nothing about whether the proposal or clearing request was seeded; the sampling service joins the outcome to its own frame."
    produced_by: 
      - s3.approval-service
      - s5.review-console
    consumed_by: 
      - s7.sampling-service
  - name: AutonomyGrant
    description: "Grant id, the one judgment type it covers, scope, granted_by (the business risk owner) and concurrence (the security risk owner), granted_on, expires_on, the honesty record (what the system reported matches what the control plane recorded) and the correctness record (its verdicts hold on samples it cannot predict, checked by a different means), each with its latest sample result, and status (active | lapsed | revoked). Lapses the moment either record slips. Grants the right to learn from the system's own validations for that judgment type only; never authority to act, and the part that proposes a test never judges it. Never wider than the design limit for its judgment type: promotion review refuses a grant that reaches past the limit, and lapses an outstanding grant at once when a new limit version leaves it wider."
    produced_by: 
      - s7.promotion-review
    consumed_by: 
      - s5.evidence-intake-validator
      - s7.evaluation-operations
      - s5.learning-store
      - s7.promotion-review
  - name: KeptTestStatus
    description: "Test id and version, weakness class, declared dependencies, purpose (regression of a fixed weakness | held dependency, naming the held finding and the control the test exercises), owner (the team that answers for the test; for a held-dependency test, the team that owns the control), re-test interval (for a held-dependency test, the longest time allowed between its runs; its time-based runs keep that interval in either lane), lane for its time-based runs (blocking | scheduled; a run on a change that touches its declared dependencies blocks in either lane), status (active | quarantined | retired | set aside pending repair), last failure, last run, last re-proof (when, against which reverted fix, who ran it, result fail as required | passed and so no longer failing | not re-provable (the revert conflicts, or the copy no longer builds or starts) with the fix's age, and for a passed result the verifier's independent confirmation or refutation), and the record of the latest change of lane or status: reason (quiet period passed, false failures, re-proof passed and confirmed, covered by a cheaper check), who decided, and for a quarantine its exception record (accepted by, concurrence, expires) or for a retirement the covering road entry version or derived check id, that check's own kept status and last result, that check's result against this test's reverted-fix copy (it must fail), and the security risk owner's acceptance. A held-dependency test passes while the control stops the path and fails when its run meets the weakness's proof condition, which converts its held finding; its re-proof runs against an isolated copy with the control switched off, where it must meet the proof condition, and it is never retired behind a covering check while its finding is held. A retired test keeps its record and its code; nothing is deleted."
    produced_by: 
      - s6.retest-regression-planner
      - s6.regression-catalog
      - people.security-risk-owner
      - s5.independent-verifier
    consumed_by: 
      - s6.regression-catalog
      - s7.flow-cost-telemetry
      - s5.disposition-review
      - s3.gate-failure-policy
      - s7.value-ledger
      - s6.kept-test-mirror
  - name: DetectionProposal
    description: "Proposal id, the validated finding and weakness class it comes from, the observable behavior of the demonstrated path (what a defender would see, never the proof condition or an expected-outcome hash), the proposed detection logic in the defensive side's own format, a reference to the execution receipts that show the behavior, and proposed by. A proposal only: the defensive side reviews, tunes, owns and deploys each detection, and reports its outcome back as a defensive observation."
    produced_by: 
      - s6.hardening-service
    consumed_by: 
      - ext.soc-incident-response
  - name: EscapeRecord
    description: "Escape id; the accepted finding it belongs to, with its path key and weakness class. Detection: the source (incident response, bug bounty, external report, production testing, monitoring, the discovery practice or another the organization declares), the detecting role, and detected-at. Attribution: the role that attributed it and the method it used (for example the artifact digest the running system reported, matched to the machine deployment record, or the change history of the affected code or configuration), the deployment that shipped the weakness, and whether detection fell within the organization's detection window after that deployment; a later detection is a late escape, recorded and reported apart from the escape rate. An escape that no deployment shipped, such as configuration drift, a newly disclosed weakness in a dependency that did not change, or a change made outside the pipeline, is recorded with no attributable deployment and reported in a bucket of its own, apart from both escape rates. Confirmation: the confirming role, which differs from every detecting role, from the producer team and from the program decision owner, confirmed-at, and the reproduction showing the weakness reachable through the running system; until it is confirmed the record is unconfirmed and counts in no measure, and once it is older than the organization's alert age for unconfirmed escapes (the detection window when none is set) it alerts the security risk owner. Cost: blast radius as the consequence tier of each asset the demonstrated path reached (as the consequence register held it at detection) and the services affected; time to recover, from detected-at to the fix verified in the running system, open and reported as running until then; and fix scope, class removed when the closure is constraint enforced or one instance when it is path broken, with the closure record it comes from. For an escape whose finding is an exposed secret, time to recover is reported as time to revoke: from detected-at to the revocation check recording the old credential refused."
    produced_by: 
      - s5.disposition-review
    consumed_by: 
      - s5.finding-ledger
      - s7.flow-cost-telemetry
      - s7.evaluation-operations
      - people.security-risk-owner
  - name: DesignLimit
    description: "Limit id; what it covers (one producer route, or one judgment type for earned autonomy); the highest consequence tier it may touch on a grant alone (standard, critical or crown-jewel); the environments; the action classes (read-only, reversible, state-changing); set by (role, always the security risk owner), set on, the evidence for the last change, signature and version; and the organization's current consequence line as the business risk owner set it, at or above which a person approves every action whatever the limit says. Held in the dial register in the control zone, so no producer can write it. Every standing permission, batch approval, earned-autonomy grant and dial that lets an agent act, or a judgment stand, without a person approving each instance sits inside it, and records the limit version it was checked against. The record never widens a limit: widening one is a recorded turn by the role that owns it. A limit that narrows, a consequence line that drops, or a rise in the tier of an asset a grant reaches makes a new version; every outstanding grant is checked again against it and lapses at once if it is wider, and no part honors a grant checked only against an older version, with one stated exception: a grant inside a replay window bundle already minted, which is verified offline, is honored until the bundle expires, so a bundle's life is its revocation lag, capped by the organization's longest bundle life or by the posture expiry. Versions only increase, and each signed version carries a lease no longer than the dial register's recovery time objective. Readers keep the newest version they hold and never accept a lower one; the register pushes a narrowing to every reader at once and renews leases on a schedule. A reader whose lease lapses unrenewed, because the register or the path to it is down, sends every action that would run on a grant alone to a person, the narrowest behavior, until a current version arrives (F104)."
    produced_by: 
      - s7.dial-register
      - people.security-risk-owner
    consumed_by: 
      - s3.policy-decision-point
      - s3.approval-service
      - s7.promotion-review
      - s5.evidence-intake-validator
      - s7.dial-register
      - s6.fix-cap-gate
      - s5.disposition-review
  - name: ConsequenceLine
    description: "The lowest consequence tier (standard, critical or crown-jewel) at which a person approves every agent action and every judgment, whatever any design limit says; set by (role, always the business risk owner), set on, the reason for the last change, signature and version. Held in the dial register beside the design limits and published with each of them. Lowering the line makes a new limit version; raising it is a recorded change by the business risk owner, never a result of the record alone."
    produced_by: 
      - people.risk-acceptance-owner
    consumed_by: 
      - s7.dial-register
  - name: AgentActionRecord
    description: "Action id; the producer route or judgment type; the design limit and version it ran under; its authority (approved by a person, or grant-only under a named standing permission, batch approval or earned-autonomy grant). Two predictors, written before the action runs: the route's trailing accuracy over the accuracy window the organization records with its design limits (a count of the route's most recent actions, or a number of days, as the organization chooses), with the window it was read over, and the tier its limit allows with the action's class. What it touched (consequence tier of the assets its effects reached, environment, action class). Its accuracy (correct, wrong or unresolved): for an action a person approved, from the independent check; for an action that ran on a grant alone, from the sampled check, so an unsampled grant-only action is unresolved. For a wrong action its cost, measured apart from both predictors: time to recover, and the severity of any incident it caused as the defensive side rates it. One record per agent action, so phase 2 can test which predictor better forecasts what the agent's errors cost."
    produced_by: 
      - s3.protected-audit
      - s5.independent-verifier
      - ext.soc-incident-response
    consumed_by: 
      - s7.flow-cost-telemetry
  - name: FixPath
    description: "What security and the owning engineer co-create with an agent before a validated finding enters an owning team's queue. Finding id and path key, owning team, date validated, prepared by (security and the owning engineer, with the agent route and the shared pull request reference), the security side's hours to prepare it, the reproducing test (a test drawn from the replay of the demonstrated path that fails on the current build, or, where no build-level test can reproduce the weakness, a reproduction through the running system in a test environment; with its run reference), the drafted fix (a candidate change or policy change as a reviewed proposal, never merged by its author, or \"no draft possible\" with the reason recorded), the owning team's decision on the drafted fix (taken, edited, or declined with a reason; a declined draft leaves the team free to write its own fix), and the owned gate (the regression test, or the repeated reproduction through the running system, that the fix must pass, its named owner and the pipeline stage or scheduled check it runs in). Complete when the reproducing test and the owned gate are present and the drafted fix is present or recorded as not possible with its reason. A path completed with no draft possible goes to the owning team's lead and the security risk owner. The owned instance regression is component-local, visible to coding agents and owned by the owning team in its suite. Its version and team suite reference are recorded as InstanceRegression. The protected RegressionSpec is independent aggregate validation and never enters that pull request. A variant opens a separate finding, never an unannounced edit to the pull request."
    produced_by: 
      - s6.owner-change-connector
      - s6.hardening-service
    consumed_by: 
      - s6.fix-cap-gate
      - people.engineering-owners
      - people.security-risk-owner
      - s7.flow-cost-telemetry
  - name: FixCapRefusal
    description: "Team, finding id and path key, reason, date, kind (refused, or entered over the cap, with the ground: at or above the consequence line, matched by a sourced exploitation signal with the signal's reference and the exploited window it started, an external disclosure deadline with its date, entered while the gate was down with the pass ground recorded at disposition and the result of the gate's check of it on recovery, or sent by the security risk owner), the cap in force (a team cap with the security role that agreed it, or the default cap with the role that set it), the team's open validated findings at the time, and the reviews of a refusal: each review's date, the owning team's reviewer, the co-signature of the security role that agreed the cap, and the outcome (queued, held to the next review, cap revised, or class sent to the paved road); after two consecutive held outcomes, the security risk owner's decision: sent over the cap, or a risk acceptance with its expiry."
    produced_by: 
      - s6.fix-cap-gate
      - people.engineering-owners
      - people.security-risk-owner
    consumed_by: 
      - s6.fix-cap-refusal-log
      - s6.fix-cap-gate
      - people.security-risk-owner
      - s7.flow-cost-telemetry
  - name: InjectionRecord
    description: "Experiment id; the weakness class and the verified fix it reintroduces; the detection layer expected to catch the class (workstation, pull request, pipeline, deployed test environment or production) and the check or watch at that layer; the environment, and for the deployed test environment and production layers the notice mode in force (announced, trusted agent or unannounced) with the trusted agent's role; the service owner's cost estimate and time limit, recorded before the start; the injection grant, the restore approved inside it and its expiry (the time limit, and for production no later than the exposure window the profile sets); the restore grant and the cell that held it; for a pull request, the draft or isolated branch and the status check that blocks its merge; at the workstation layer, the harness that stamped the start and finish; injected-at. Outcome: whether the expected layer caught it, which layer and source caught it when another one did, or that nothing did within the time limit; detected-at and the time to detection; past deployment, the time to recovery, from detection to the fix restored and verified again in the running environment, and before deployment the time to recovery recorded as not applicable, because nothing was merged or deployed; any refused merge attempt; whether the exercise was stopped, by whom, why and by which path (the action control service or the service owner's rollback), and the time from the stop to the environment restored against the organization's ceiling; whether the grant expired and the restore ran at expiry; what ran the restore (the cell's timer, a stop through the action control service, or the service owner's rollback) and whether the control plane was reachable then; the environment restored; and the actual cost beside the estimate. A miss at the expected layer is recorded as a detection gap for that weakness class and layer."
    produced_by: 
      - s6.retest-regression-planner
      - ext.soc-incident-response
      - s3.action-control-service
      - s3.local-enforcement-point
    consumed_by: 
      - s6.retest-regression-planner
      - s3.action-control-service
      - s7.flow-cost-telemetry
      - s7.evaluation-operations
      - s3.local-enforcement-point
  - name: SecretRevocation
    description: "For a finding of kind exposed secret. Finding id; the credential's issuer, type and identifier and a fingerprint of its value taken at intake by the exposed-secret intake, never the value itself; where it was exposed (code, history, logs, tickets or another store) with the scan rule and rule version that found it there and the earliest exposure found (first commit, log line or ticket); detected-at; the owning team that holds the credential. Its fix path: the scan rule's hit where the secret was exposed is the reproducing test, the drafted fix is a request to revoke and rotate the credential naming the services that use it, and the owned gate is the scan rule that blocks the secret's return, matching its fingerprint, with its owner and the stages where it runs, kept in the regression catalog. The fix, done by the owning team in its own systems and recorded through its fix path: revoked-at, rotated-at, the services moved to the new credential, and each derived session or token the type's recipe names with how it was ended (revoked, or expired at a stated time); no agent revokes, rotates or holds the credential. Removing the secret from code, history, logs or tickets is recorded beside the fix and never counts as the fix while the old credential still authenticates. The revocation check follows the type's verification recipe (CredentialRecipe), planned by the retest planner as an ActionSpec under the normal authorization envelope, run by the bounded runner and judged by the replay verdict check with no model: first the issuer's status by identifier, where the issuer offers it; otherwise the status probe, announced to the detection side before it runs and repeated over the issuer's propagation time from a fixed egress, with refused counting only for the codes the recipe maps to revoked or invalid. Each attempt's receipt and result (revoked, refused, accepted or unknown), signed by the replay verdict check. A credential the issuer cannot revoke before expiry is recorded as such, and its expiry is the time it fails. A type with no recipe closes on the owning team's attestation of revocation, labeled attested in every record and measure and never read as check-confirmed. Credential failed at: the issuer's revoked status, the first attempt of a series refused on every attempt, the recorded expiry, or the attestation. The exposure-use review, by the detection side: the window from the earliest exposure to credential failed at, the issuer logs read with the stretch each one covers, and the result for each stretch (no use, use attributable to the owner, unexplained use, or not verifiable, for a stretch no issuer log covers, recorded with its start and end dates); unexplained use opens an incident and blocks closure. A finding with a not-verifiable stretch closes only when the security risk owner accepts the residual risk of that stretch, recorded with the owner's name, the date and the stretches accepted; the acceptance never stands in for the revocation check, which still proves the credential failed. Time to revoke: from detected-at to credential failed at, open and reported as running until then."
    produced_by: 
      - s5.exposed-secret-intake
      - s3.replay-verdict
      - s6.owner-change-connector
      - s5.evidence-intake-validator
      - s6.change-closure-records
      - ext.soc-incident-response
      - people.security-risk-owner
    consumed_by: 
      - s5.evidence-intake-validator
      - s6.change-closure-records
      - s6.retest-regression-planner
      - ext.soc-incident-response
      - s7.flow-cost-telemetry
  - name: LearnedItem
    description: "Item id and version, judgment type, the evidence partition (jurisdiction and business unit) of the findings it came from, what was learned (a worked reproduction, a verdict, a hypothesis that held or failed) with the finding ids it came from, and its provenance: confirmed by a person (who and when) or self-validated under an earned-autonomy grant (grant id and version), the ids of its inputs, and its outsider label set (OutsiderLabelSet): each outsider label on its inputs with its clearing record (cleared by a person, or by a model-free check with its version; when; the fields cleared). Signed by disposition review when it is stored, under the partition's key. The store recomputes the set from the input ids when the item is written and at each retrieval. At retrieval: released or withheld, the reason when withheld (no provenance, outsider label not cleared, recorded labels do not cover the inputs' labels, grant lapsed, grant status unreadable), and whether a withheld item traced to an untagged stored item. An item with no clearing record keeps the label."
    produced_by: 
      - s5.disposition-review
      - s5.learning-store
    consumed_by: 
      - s5.learning-store
      - s1.context-compiler
      - s7.flow-cost-telemetry
  - name: OutsiderLabelSet
    description: "The outsider labels on one record, field by field. For each labeled field: its path in the record, the outsider sources that reached it (a lead, a bug bounty report, a target's response recorded in a receipt, or an earlier labeled record, each by id), and its clearing record when it has one (the person, or the model-free check and its version, and the time). A part outside the producer computes it, and a producer never declares it: the context compiler for each context item from its source records, the request-data gate for each model request as the union over everything the run was given and has received, and evidence intake (or the independent verifier, for an artifact taken from the artifact exchange) for what a run produced, from the gate's records for that run. Evidence relationships carry it field by field: a part clears only the fields it constrains to a closed set or resolves against a store, and every other field keeps its labels. A field whose labels cannot be computed counts as labeled. Carried by context items (ContextSnapshot), ModelRequest, ModelResponse, CandidateFinding, ValidationArtifact, PatchCandidate, ExecutionReceipt, FindingDisposition, FixBrief and LearnedItem."
    produced_by: 
      - s1.context-compiler
      - s4.request-data-gate
      - s5.evidence-intake-validator
      - s5.independent-verifier
      - s5.review-console
    consumed_by: 
      - s5.evidence-intake-validator
      - s5.independent-verifier
      - s5.disposition-review
      - s5.fix-brief-builder
      - s5.learning-store
      - s7.flow-cost-telemetry
  - name: CredentialRecipe
    description: "A verification recipe for one credential type, kept in the regression catalog with its owner. The issuer and how to reach it; the status query by identifier when the issuer offers one (it needs neither the value nor its use); otherwise the status probe: the endpoint, the issuer's response codes that mean revoked or invalid, those that mean valid but forbidden, the issuer's stated propagation time, how many attempts over that time, and the fixed egress the probe runs from. The derived sessions and tokens the type can mint (temporary credentials, tokens from a refresh token or signing key) and how each is ended. Whether the type can be revoked before it expires. A credential type with no recipe closes on the owning team's attestation, labeled attested."
    produced_by: 
      - s6.regression-catalog
    consumed_by: 
      - s5.exposed-secret-intake
      - s6.retest-regression-planner
  - name: SealedCredential
    description: "An exposed credential's value sealed under the owning team's key in key management, created only when its type's recipe needs a status probe. The finding id, the fingerprint it must match, sealed-at, the probe series it may be released for, released-at, and destroyed-at, which follows the series' last attempt. No record, lead or model request holds it, and it is released only to the credential lease broker."
    produced_by: 
      - s5.exposed-secret-intake
      - s3.key-management
    consumed_by: 
      - s3.key-management
      - s3.credential-lease-broker
  - name: ConformanceRead
    description: "For a finding of kind infrastructure misconfiguration. Finding id; the resources and the environment; the declared intent they must match (the policy or configuration rule, its owner and version); the live configuration state read through the estate's own interfaces with no model, read-at, and the result (match, mismatch or unknown). The kept gate: a policy check on the infrastructure code that blocks the change returning, or drift detection on the live state, kept in the regression catalog with its owner. Detected-at and conformed-at (the first read that matched), from which time to conform is computed, running until a read matches."
    produced_by: 
      - s6.release-state-correlator
    consumed_by: 
      - s6.change-closure-records
      - s7.flow-cost-telemetry
  - name: RestoreGrant
    description: "Restore grant id; the injection grant and experiment it belongs to; the restore it authorizes (the exact undo of the injected change, bound by hash to the ActionSpec that carried both), the environment and target; the expiry, equal to the injection grant's; the cell that holds it; the restore credential, a credential lease the lease broker issued with the injection grant, scoped to the restore's target and effect, sealed to that cell, valid until the expiry plus the cell's clock-skew margin and consumed with the grant; signature and key reference. Issued with the injection grant and delivered to the local enforcement point of the cell that applies the injection before the injection starts; verified there offline against cached key references and consumed once, by the cell's dead-man timer at expiry or early on a stop. The runner runs the restore under the restore credential it holds, with no lease request. Nothing can extend it: a longer injection needs a new grant."
    produced_by: 
      - s3.action-control-service
    consumed_by: 
      - s3.local-enforcement-point
      - s3.bounded-runner
  - name: ExploitationSignal
    description: "A sourced attacker-side fact that a weakness is being exploited: the source (a known exploited vulnerability catalog, or observed exploitation reported by the defensive side or a threat intelligence provider), the catalog entry or report reference, the vulnerability identifier, the component as the source names it (vendor or project, and product), the affected versions as a version range with the scheme it is written in (empty when no source states them), the record the range was read from, and the date listed or observed. The public catalog states no versions, so a catalog listing carries a range only when a vulnerability database record for the same identifier supplies one. Structured fields only; free threat text stays with the source adapters as untrusted text and never crosses. The fix-cap gate matches a signal to a finding by rule: on the vulnerability identifier, or on the component when the version the finding's weakness sits in falls inside the signal's range. A signal with an empty range matches on its identifier alone, never on the component. A signal never creates a finding, never lowers a posture and never counts as evidence."
    produced_by: 
      - ext.known-exploited-catalog
      - ext.threat-intelligence
    consumed_by: 
      - s6.fix-cap-gate
      - s5.disposition-review
  - name: PriorityInputs
    description: "Recorded at disposition for each accepted finding, as ordering inputs inside a consequence tier: finding id and path key; exposure of the demonstrated path's entry point (reachable from the internet, internal, or unknown), read from the scope and the source facts with no model; and automatable (yes or no), set by the independent reviewer from the reproduction: yes when every step of the reproduction ran with no person's input. Each value records who or which check set it and when. An unknown or unrecorded value orders as if it were the more urgent one, so a missing answer never moves a finding later. Neither input lowers a posture, moves a finding to a lower tier or counts as evidence. Pass grounds: disposition review also records, by rule and with no model, which of the fix cap's pass conditions hold for the finding (a reached asset at or above the consequence line, a match in the known exploited catalog copy or a sourced observed exploitation signal on its vulnerability identifier or its component and version, or an external disclosure deadline), each with the input it was read from, and records them again whenever a new catalog entry, signal, deadline or line change touches an open finding. The fix-cap gate does not depend on them while it is up; while it is down, they are the only grounds on which a finding enters an owning team's queue."
    produced_by: 
      - s5.disposition-review
    consumed_by: 
      - s6.fix-cap-gate
      - s7.flow-cost-telemetry
      - s6.owner-change-connector
  - name: MitigationRecord
    description: "An interim mitigation on a validated finding, recorded by the security risk owner while the permanent fix is assembled: finding id and path key; what holds the path (for example a scoped firewall rule, a disabled feature or a revoked permission); who applied it and when; its expiry; and a replay of the demonstrated path with the mitigation in place, planned by the retest planner under the normal authorization envelope and judged by the replay verdict check with no model (path broken, open or unknown), with its receipt. The mitigation counts as holding only while its last replay says path broken and it has not expired. It never closes the finding: the finding stays open in the ledger, keeps its place in the fix path and the queue, and its time to remediate keeps running. A replay that finds the path open, an expiry, or a removal ends the mitigation and alerts the security risk owner."
    produced_by: 
      - people.security-risk-owner
      - s3.replay-verdict
      - s5.evidence-intake-validator
    consumed_by: 
      - s6.change-closure-records
      - s7.flow-cost-telemetry
      - people.security-risk-owner
      - s5.evidence-intake-validator
  - name: DisclosureRecord
    description: "Disclosure in either direction for one finding. Inbound: a weakness reported from outside the organization, with the reporter's reference and the external deadline the reporter or the coordination policy sets for a fix or publication. Outbound: a weakness in a third-party component reported to its maintainers by the role that owns outbound reports, under the coordination policy the profile names, with the date reported, the external deadline agreed, and the outcome with its date (acknowledged, fixed upstream, published, or declined with a reason). A finding with an external deadline passes the fix cap, and the security risk owner is alerted ahead of the deadline by the profile's lead time, and when it is recorded where no lead time is set. A disclosure record never closes a finding and never counts as evidence of a fix."
    produced_by: 
      - people.security-risk-owner
    consumed_by: 
      - s6.fix-cap-gate
      - s5.disposition-review
      - s6.change-closure-records
      - s7.flow-cost-telemetry
      - people.security-risk-owner
  - name: ReleaseAttestation
    description: "One release of Ratchet's own software, a runner or cell image, or a self-hosted model weights file: artifact kind, name and version, artifact digest; build provenance at SLSA Build Level 3 (the hosted, isolated build platform's identity, the source repository and revision, the build definition and its parameters, the dependencies resolved with their digests), generated and signed by the build platform and never by the build steps; a software bill of materials; the release signature with its key reference; the security risk owner's approval when the release widens what can run; and rollout stage and rollback reference. Ratchet's built parts follow the organization's own secure development requirements; the attestation records the requirement set each build was checked against. An artifact with no attestation, a signature that does not verify against a current key reference whose purpose is release, provenance below Build Level 3, or a digest that differs from the attested one is never started or served. The local enforcement point checks this before anything starts in a cell, and the route registry before it pins a weights digest; the model gateway then serves only weights whose loaded digest matches that pin. Each release attestation carries a monotonically increasing release sequence number covered by the release signature. Release signatures and rollback authorizations verify only against a current key reference whose purpose is release. For release admission a cell is a stable logical execution destination, independent of its disposable image or enforcement process. The local enforcement point keeps that cell's highest verified release sequence, last consumed rollback number and sticky refusal ranges in durable storage outside the disposable cell; all survive restart, rebuild and restore. A new or rebuilt cell takes its first mark and rollback state from the release pipeline through authenticated provisioning, never from the first arriving release or an empty local store; unavailable or stale initialization refuses all starts. A rollback authorization is part of the release attestation and is signed by key management for the pipeline with purpose release; it names the cell, its highest verified sequence, the running sequence being rolled away from, the older target sequence and digest, a per-cell rollback number and the highest release sequence issued before this rollback. The enforcement point requires the target to be older than the running release and the rollback number to exceed the last consumed number, and atomically persists its consumption and the new refusal range before starting the target. A rollback never lowers the high-water mark and permanently refuses every previously issued release from its rolled-away-from sequence through its signed issued-through sequence, even with another rollback authorization. These refusal ranges accumulate; reusing that code at or above a rolled-away-from sequence requires the pipeline to issue a fresh release with a new sequence beyond the applicable refusal ranges and the high-water mark. Outside these ranges an older release still requires a matching unused rollback authorization; a missing, invalid, reused or non-increasing authorization is refused before any start."
    produced_by: 
      - s3.policy-release-pipeline
    consumed_by: 
      - s3.local-enforcement-point
      - s4.qualification-route-registry
      - s3.protected-audit
  - name: PostmortemRecord
    description: "Postmortem id, the trigger that opened it (an effect outside an approved scope or with no approval; a closure contradicted by a later confirmed escape on its path key; evidence lost or unreadable; one incident using more than the share of an objective's error budget that Ratchet's operating policy sets; the loop canary's dead-man alarm; a seeded proposal or seeded change that reached execution or merged; or a request from any role), references to the records the trigger came from, owner (the on-call role of the first failing part), timeline, contributing causes stated as conditions of the system and never as a person, action items each recorded as a design change, a profile change or a work unit with its owner, the security risk owner's signed reading, and status (open, reviewed, closed when every action item has landed or been declined with a reason)."
    produced_by: 
      - s7.reliability-monitor
    consumed_by: 
      - people.security-risk-owner
      - people.control-plane-operator
  - name: GateCatchRate
    measures: "Seeded catch rate at one human gate: seeded known-bad items the person caught over seeded items the person received, with its interval and sample size over the window"
    description: "Gate (approval, clearing of outsider text, proof condition, or decision on a finding or closure), the person it is for, window, seeded items received, seeded items caught (rejected or edited at the approval gate, kept labeled at the clearing gate, refused at the proof-condition and decider gates), the catch rate with its interval and sample size, the gate's floor, and whether a breach is open. Computed by rule from the recorded outcomes. Never names which items were seeds. Restricted to its listed consumers: each person receives only their own rate, and the seeding owner, the role that runs the sampling and seeding service outside the gate's reporting line, reads every person's rate where the service computes it. Sponsors and managers see pooled rates."
    produced_by: 
      - s7.sampling-service
    consumed_by: 
      - people.accountable-authorities
      - people.scenario-owner
      - people.independent-security-staff
    audience: restricted
  - name: OutcomeFeedback
    measures: "The outcome measure a role's decisions are graded on, named per decision type: a rate, count or duration with its interval or sample size over the window"
    description: "Receiving role, decision type (refusals over a fix cap, ship-through acceptances and earned-autonomy grants, design limits and floors, kept tests and detections proposed), measure name and definition, window, value with its interval or sample size, and references to the records it is computed from (escape records, agent action records, kept-test status, fix paths). Computed by rule from recorded outcomes; carries no free text from a finding. A measure with too few outcomes in the window reads too few to call, never zero."
    produced_by: 
      - s7.flow-cost-telemetry
      - s6.regression-catalog
    consumed_by: 
      - people.engineering-owners
      - people.risk-acceptance-owner
      - people.security-risk-owner
      - people.purple-team
  - name: VerifiedObservation
    evidence_content: true
    description: "What the independent verifier observed when it reproduced a result, or what the evidence intake validator observed when it validated an intake: the run or intake id, the proof condition's id and version, the verdict and assertion results or the validation outcome, the tests, telemetry and execution receipts it rests on as references and hashes, the verifier's or validator's version, and the time. Evidence content: dispositions, closures and audits read it back, so it lands in a store partitioned by the profile's partition keys. Carries the outsider label set of its inputs field by field, less the fields the verifier or validator constrains (the verdict, status classes, assertion results, references and hashes)."
    produced_by: 
      - s5.independent-verifier
      - s5.evidence-intake-validator
    consumed_by: 
      - s5.protected-evidence-store
  - name: ClassTestResult
    module: secure-creation
    description: "The full result of one class test: a rule at one version run against each reproduced member of its proven class at the member's revision before the fix, with each member's finding id and revision, whether the rule caught it, missed it or could not run against it, where the rule fired and what it reported. Kept in the regression catalog beside the kept regressions, appended to the rule version it tested and never overwritten. It never reaches a part where coding agents run: member locations and the rule's output on them would show an agent where reproduced weaknesses sit and how a rule sees them. Only pass or fail per rule version reaches agent-reachable parts; a separate per-class totals projection reaches the policy-owning team: people, never an agent directly."
    produced_by: 
      - s6.regression-catalog
      - s6.retest-regression-planner
    consumed_by: 
      - s6.regression-catalog
    fields: 
      - name: rule_id
        type: id
        required: true
      - name: rule_version
        type: string
        required: true
      - name: proven_class_id
        type: id
        required: true
      - name: proven_class_version
        type: integer
        required: true
      - name: tested_on
        type: date
        required: true
      - name: members
        type: list
        of: object
        required: true
        description: One per reproduced member of the class
        fields: 
          - name: finding_id
            type: id
            required: true
          - name: revision
            type: string
            required: true
            description: "The member's revision before the fix"
          - name: outcome
            type: enum
            values: 
              - caught
              - missed
              - not-run
            required: true
          - name: location
            type: string
            required: false
            description: Where the rule fired on the member
          - name: rule_output
            type: text
            required: false
            description: What the rule reported on the member
      - name: members_tested
        type: integer
        required: true
      - name: members_caught
        type: integer
        required: true
      - name: members_not_run
        type: integer
        required: true
  - name: RegressionHashes
    description: "For each regression test declared for the next replay window, the test id and version and its registered expected-outcome hash, as the regression catalog sends them to the credential lease broker for the window bundle. Never carries the expected boundary behavior, the observation projection or any other part of the test."
    produced_by: 
      - s6.regression-catalog
    consumed_by: 
      - s3.credential-lease-broker
  - name: WeaknessStatement
    description: "The weakness a signed proof condition names, as the fixture and oracle registry sends it to the fix brief builder: the proof condition's id and version, the weakness class, its location, the boundary that failed, and the signature reference. Never carries the expected effect, the hidden expected value or assertion, negative controls, legitimate behavior checks, or anything that would show the weakness is not real."
    produced_by: 
      - s5.fixture-oracle-registry
    consumed_by: 
      - s5.fix-brief-builder
  - name: DiscoveryLeadSubmission
    description: "A finding entered through operator intake from the organization's discovery practice, with the originating source, tool and rule versions when available, target, location, raw description and source references. Its text stays untrusted. Tool signal intake normalizes it into ToolLead before storing it. It carries no exposed credential value, which goes only to exposed-secret intake."
    produced_by: 
      - s2.operator-interface
    consumed_by: 
      - s1.tool-signal-intake
  - name: AutonomyGrantRequest
    description: "The business risk owner requests earned autonomy for one judgment type: scope, decision, author, time and expiry, with references to the honesty and correctness records. Promotion review checks the current design limit before registering an AutonomyGrant."
    produced_by: 
      - people.risk-acceptance-owner
    consumed_by: 
      - s7.promotion-review
  - name: AutonomyGrantConcurrence
    description: "The security risk owner concurs on a requested earned-autonomy grant: request reference, scope, concurrence, author and time. Promotion review checks the current design limit and records this concurrence in the issued AutonomyGrant."
    produced_by: 
      - people.security-risk-owner
    consumed_by: 
      - s7.promotion-review
  - name: AdminSessionRequest
    description: "A request for an administrative session: requester identity, target part, permitted operations, requested duration and break-glass reason. The broker issues the session only after the required approvals. Before acting on this input, the broker durably appends its request reference, authenticated sender identity, received time, target and scope, payload hash and acceptance or refusal with its reason to protected audit under custody neither the requester nor the approver can alter. A refusal is recorded even when no session is issued. If the append fails, the broker refuses the input and opens no session. Retries retain the original request reference and append an attempt, never overwrite a decision."
    produced_by: 
      - people.control-plane-operator
    consumed_by: 
      - s3.privileged-access-broker
      - s3.protected-audit
  - name: AdminSessionApproval
    description: "Security risk owner approval of a break-glass session request: request reference, approver identity, decision, scope and time. It is an input to the broker, which records and issues the administrative session. Before acting on this input, the broker durably appends its request reference, authenticated sender identity, received time, target and scope, payload hash and acceptance or refusal with its reason to protected audit under custody neither the requester nor the approver can alter. A refusal is recorded even when no session is issued. If the append fails, the broker refuses the input and opens no session. Retries retain the original request reference and append an attempt, never overwrite a decision."
    produced_by: 
      - people.security-risk-owner
    consumed_by: 
      - s3.privileged-access-broker
      - s3.protected-audit
  - name: PolicyChangeProposal
    description: "A proposed policy, allowlist, route-table or schema change as code: target, base version, proposed diff, author and reason. The release pipeline tests and signs the resulting policy bundle."
    produced_by: 
      - people.control-plane-operator
    consumed_by: 
      - s3.policy-release-pipeline
  - name: PolicyChangeApproval
    description: "Approval of a policy change whose deny-diff widens what may run: proposed change reference, deny-diff reference, approver identity, decision and time. The release pipeline includes this approval in the signed bundle."
    produced_by: 
      - people.security-risk-owner
    consumed_by: 
      - s3.policy-release-pipeline
  - name: PersonWrittenBrief
    description: "A person-written weakness description submitted to the fix brief builder with the finding reference, author and time. It carries no outsider text, model output, proof condition, expected outcome or kept regression. The builder validates the submission and signs the resulting FixBrief for its author before sending it to a fixing agent."
    produced_by: 
      - people.independent-security-staff
    consumed_by: 
      - s5.fix-brief-builder
  - name: InstanceRegression
    description: "A component-local regression co-created by security, the owning engineer and an agent in one correction pull request. Test id and version, finding and weakness class, owning team, repository and suite, test source revision, declared dependencies, local input and assertions, failing-before and passing-after run references, and the reviewed pull request reference. The test is visible to coding agents and owned by the team. It contains no aggregate proof condition, chained-path validation, protected fixture or aggregate expected outcome. A later variant enters as a new finding. Only normal owning-team review changes this test."
    produced_by: 
      - s6.owner-change-connector
    consumed_by: 
      - s6.team-regression-suite
      - s6.kept-test-mirror
  - name: InstanceTestObservation
    description: "An automatically collected read-only observation from the team repository and CI interface. Test id and version, suite and owning team, repository revision, dependency scope and configuration, run id, observed-at and source reference, enabled or skipped state, result passing, failing or unknown, collection success or unavailable, and any reviewed retirement reference. A complete expected inventory is reconciled against the observed manifest so a removed test is detectable. No source credential can write the repository or CI. An absent run or collection failure never counts as a pass."
    produced_by: 
      - s6.team-regression-suite
    consumed_by: 
      - s6.kept-test-mirror
  - name: KeptTestMirrorStatus
    description: "Security's read-only inventory evidence, keyed by test id and version, finding, weakness class, owning team, suite, source revision, dependency scope, configuration, observation time and run reference. Records expected enrollment and each observation, removed, skipped or failing drift with its normal-loop finding reference, unknown or stale collection, and any authorized retirement. Near-JIT risk review states its assessment revision, configuration, scope, as-of time and freshness window. Protection is current only with an enabled passing observation matching all of them. Instance, aggregate and class evidence stay distinct. This is evidence for a person's risk assessment, never an authorization or a closure verdict. Carries metadata only, no protected test input, proof condition, expected outcome or chained-path details."
    produced_by: 
      - s6.kept-test-mirror
    consumed_by: 
      - people.security-risk-owner
      - s7.flow-cost-telemetry
      - s6.retest-regression-planner
  - name: jig:HunkRouteAdvice
    description: "A model's advice to put hunks on the human route. It can only add: it names hunks and a reason, and carries no way to lower a route."
    fields: 
      - name: change_id
        type: id
        required: true
      - name: hunk_ids
        type: list
        of: id
        required: true
        description: Hunks to add to the human route
      - name: reason
        type: enum
        values: 
          - authorization
          - cryptography
          - data-access
          - money
          - other
        required: true
      - name: advisor_version
        type: string
        required: true
    produced_by: 
      - jig:hunk-risk-advisor
    consumed_by: 
      - jig:hunk-router
    module: secure-creation
  - name: jig:CreationOutcome
    measures: "Per author (the agent with the person whose session produced the change): escaped defects per merged change on the reproduced tier, with the check-confirmed tier beside it, and the share of the agent's own fixes that held, each with interval and sample size, on cohorts whose reproduction window has closed"
    description: "What a developer's sessions produced, as it turned out. Shown only to that developer; managers see pooled rates. A window with too few merged changes reads too few to call."
    produced_by: 
      - jig:measurement-plane
    consumed_by: 
      - jig:people.creation-developer
    module: secure-creation
  - name: jig:ReviewerDrift
    measures: "Per reviewer of agent-written changes: approval rate and comment rate over the window against that reviewer's own baseline, and seeded known-bad changes caught over those received where seeds run, each with interval and sample size"
    description: "How a reviewer's decisions on agent-written changes are drifting. Reported by a team other than the reviewers' own; which changes were seeds is never shown to a reviewer. Only the measurement plane writes it; the seeded catches in it come from Ratchet's evaluation as a record of their own."
    produced_by: 
      - jig:measurement-plane
    consumed_by: 
      - jig:people.change-reviewer
      - jig:people.high-risk-reviewer
    module: secure-creation
  - name: jig:LayerCatchRate
    measures: "Per layer and per rule: defects caught over defects assigned to that layer and effective false-positive rate per surface, with interval and sample size on closed cohorts; class-test member counts are excluded"
    description: How well each layer and each rule catches what it is meant to catch. The layer that should have caught each defect is assigned outside the loop. Class tests travel separately as pass or fail per rule version; per-class totals never enter this plane.
    produced_by: 
      - jig:measurement-plane
    consumed_by: 
      - jig:people.creation-policy-owner
    module: secure-creation
