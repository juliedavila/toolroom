    parent: jig:secure-creation
    kind: service
    responsibility: "Deep checks on each proposed change and focused human attention: diff-scoped analysis, model triage, review by a second model family, routing of hunks by risk, and autofix that shows only validated patches."
    role_class: existing
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: jig:pr-analysis
    name: Diff-scoped deep analysis
    system: shared:EXT
    level: component
    parent: jig:pr-plane
    kind: service
    responsibility: "Runs deep data-flow analysis scoped to the diff of each proposed change, with no model call. Its findings are leads, held to an effective false-positive rate under the bar the organization sets."
    role_class: existing
    trust_zone: shared:existing
    decision: deterministic
    owner: Policy-owning team
    module: secure-creation
  - id: jig:pr-triage
    name: Model triage of pull-request findings
    system: shared:EXT
    level: component
    parent: jig:pr-plane
    kind: service
    responsibility: "Labels each analysis finding for the reviewer's view. A label orders what the reviewer reads first; it never removes a finding from a hunk routed to a person, and it travels to Ratchet as a label on the lead."
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: jig:ai-reviewer
    name: AI reviewer from a second model family
    system: shared:EXT
    level: component
    parent: jig:pr-plane
    kind: service
    responsibility: "Reviews each diff with a model family other than the author's. Its comments are leads and never the independent review."
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: jig:hunk-router
    name: Hunk router
    system: shared:EXT
    level: component
    parent: jig:pr-plane
    kind: service
    responsibility: "Routes each hunk by rule, with no model call: a hunk whose paths, owners or rule matches touch authorization, cryptography, data access or money goes to a qualified person with the spec and findings attached, and every other hunk goes to the lighter pass. The hunk-risk advisor may add hunks to the human route; nothing it sends can move a hunk off it."
    role_class: existing
    trust_zone: shared:existing
    decision: deterministic
    routes_by_rule: true
    owner: Policy-owning team
    module: secure-creation
  - id: jig:hunk-risk-advisor
    name: Hunk-risk advisor
    system: shared:EXT
    level: component
    parent: jig:pr-plane
    kind: service
    responsibility: "A model that reads the hunks the rules left on the lighter pass and names any it judges high-risk, with its reason. Its output can only add a hunk to the human route."
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: jig:autofix
    name: Autofix
    system: shared:EXT
    level: component
    parent: jig:pr-plane
    kind: service
    responsibility: Proposes patches for analysis findings and abstains when unsure. Shows a patch only when the suite passes on the patched diff; the reviewer decides whether to apply it.
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: jig:measurement-plane
    name: Measurement plane and layer log
    system: shared:EXT
    level: component
    parent: jig:secure-creation
    kind: service
    responsibility: "Logs where each layer caught what, sends findings to Ratchet as leads before triage with the dropped-check log, and reports outcomes to the people who decide: escaped defects per change by origin on the reproduced tier, reviewer approval drift, catch rate per layer and per rule, each on cohorts whose reproduction window has closed. The layer that should have caught each defect comes from Ratchet's evaluation group, never from this plane. It shows the policy-owning team each derived check's misses against its floor as Ratchet counted them, beside its own log of checks dropped or disabled; it never receives which changes missed or what a replay found. For class tests it receives and reports only rule id, rule version and pass or fail, never per-class counts; those go from the regression catalog directly to the policy-owning team: people, never an agent."
    role_class: existing
    trust_zone: shared:existing
    decision: deterministic
    owner: Secure-creation measurement owner (outside the reviewer teams)
    module: secure-creation
  - id: jig:outside-text
    name: Text from outside the organization
    system: shared:EXT
    level: external
    kind: external-system
    responsibility: "Web pages, public issue threads and dependency documentation that a coding session needs to consult. Anyone may have written it."
    role_class: existing
    trust_zone: shared:third-party
    owner: null
    module: secure-creation
  - id: jig:people.creation-developer
    name: Developer whose session runs the coding agent
    system: shared:PEOPLE
    level: actor
    kind: person
    responsibility: "Gives the coding agent its task and, for high-risk work, writes or signs the spec its acceptance tests derive from. Co-author of every change the session produces, so never the person who merges it."
    role_class: human
    trust_zone: null
    owner: null
    module: secure-creation
  - id: jig:people.change-reviewer
    name: Reviewer who merges agent-written changes
    system: shared:PEOPLE
    level: actor
    kind: person
    responsibility: "Reviews and merges a change written by an agent and a developer, being neither. Reads the triage-labeled findings, the AI reviewer's comments and the lighter-pass hunks."
    role_class: human
    trust_zone: null
    owner: null
    module: secure-creation
  - id: jig:people.high-risk-reviewer
    name: Qualified reviewer of high-risk hunks
    system: shared:PEOPLE
    level: actor
    kind: person
    responsibility: "A person outside the authoring team, qualified for the area, who signs off each hunk routed to a person, with the spec and findings attached."
    role_class: human
    trust_zone: null
    owner: null
    module: secure-creation
  - id: jig:people.creation-policy-owner
    name: Policy-owning team
    system: shared:PEOPLE
    level: actor
    kind: person
    responsibility: "Owns the one policy source and the locked configuration it compiles into every harness. Turns each proven class into a rule, or records why it cannot yet, and has each rule tested against the class's reproduced members. Publishes the skills and instruction files for each paved road. Receives per-class test totals directly from the regression catalog for the policy-owning team: people, never an agent. Keeps those counts out of every agent-reachable part, published rule, guidance, report and model route."
    role_class: human
    trust_zone: null
    owner: null
    module: secure-creation
  - id: shared:ext.engineering-workflows
    name: Existing engineering workflows
    aliases: 
      - Existing enterprise operations
    system: shared:EXT
    level: external
    kind: external-system
    responsibility: PR / CI / ticket / release / rollback. These remain the change and deployment path.
    role_class: existing
    trust_zone: shared:existing
    owner: Engineering system owner
    assumptions: 
      - id: regression-stage-unread
        owners: 
          - side: shared:ext.engineering-workflows
            role: Engineering system owner
            identity: null
          - side: ratchet:s6.enterprise-adapters
            role: Platform integration owner
            identity: null
          - side: shared:p14-r12
            role: Platform integration owner
            identity: null
          - side: shared:p14-r12
            role: Engineering system owner
            identity: null
          - side: ratchet:p24-r2
            role: Policy/IAM + execution-cell/SRE team
            identity: null
          - side: ratchet:p24-r2
            role: Platform integration owner
            identity: null
          - side: ratchet:s6.regression-catalog
            role: Domain test team + CI/context owners
            identity: null
          - side: ratchet:s6.retest-regression-planner
            role: Domain test team + CI/context owners
            identity: null
        statement: "Coding agents cannot read the regression stage's tests, expected outcomes, window bundle or logs, or any result beyond pass or fail: in the pipeline that runs a kept regression, an agent's session, and any job an agent can start or change, is refused when it reads any of them."
        relied_on_by: 
          - s6.enterprise-adapters
          - shared:p14-r12
          - p24-r2
        fallback: "Kept regressions leave the owning pipeline and run only in Ratchet's own replay: the regression catalog takes every kept test out of the pipeline's stage, and the retest planner runs each one in Ratchet's execution cells under the normal authorization envelope on every change that touches its declared dependencies. No test, expected outcome or log then sits where an agent can read it. Until the premise holds again, the pipeline no longer holds a deploy on a kept test, so a reintroduction is found after the deploy."
        fallback_by: 
          - s6.regression-catalog
          - s6.retest-regression-planner
        failure_scenarios: 
          - id: shared:F132-premise
            title: A coding agent can read the regression stage in the engineering system
            elements: 
              - shared:ext.engineering-workflows
            trigger: "A permission change, a new pipeline runner, or a job an agent can start or change gives an agent's session read access to the regression stage's test definitions, its window bundle, its results beyond pass or fail, or its logs."
            required_behavior: "The engineering system owner's test of the premise fails and the premise is recorded as not holding."
            invariant: I2
            detection: "The engineering system owner's test of the premise, run whenever the pipeline's permissions change and on a schedule: a planted agent session tries to read a canary kept test's definition, its window bundle, its result and its log, and every read but the stage's pass or fail must be refused."
            runbook: shared:RB-F132
            test: 
              kind: game-day
              steps: "In a test pipeline, grant a test agent session read access to the regression stage's logs; assert the premise test fails and the premise is recorded as not holding."
        claim: shared:SH-2
      - id: branch-settings-hold
        owners: 
          - side: shared:ext.engineering-workflows
            role: Engineering system owner
            identity: null
          - side: jig:protected-branch
            role: Policy-owning team
            identity: null
          - side: jig:people.change-reviewer
            role: Reviewer who merges agent-written changes
            identity: null
        statement: "The protected branch's settings hold against the agent's own credentials: every required check is tied to the app that reports it, the rule is enforced for repository administrators, and no agent identity holds administrator rights or any way to set a check's status. Some platforms let anyone with write access set a check's status, and let administrators skip required checks, unless these settings are switched on."
        relied_on_by: 
          - jig:protected-branch
        fallback: "Merging moves to a path the agent's credentials cannot reach: a merge service the engineering system owner runs under an identity no agent holds, which merges only after the checks pass server-side and a person who is neither the agent nor its session's developer approves. Until the premise holds again, no change merges from a path an agent credential can reach."
        fallback_by: 
          - shared:ext.engineering-workflows
          - jig:people.change-reviewer
        failure_scenarios: 
          - id: shared:F133-premise
            title: "An agent's credentials can skip a required check or set its status on the protected branch"
            elements: 
              - shared:ext.engineering-workflows
            trigger: "A branch rule is changed so required checks no longer bind administrators, a check stops being tied to the app that reports it, or an agent identity gains administrator rights or write access that lets it post a check's status."
            required_behavior: "The engineering system owner's test of the premise fails and the premise is recorded as not holding."
            invariant: I1
            detection: "The engineering system owner's test of the premise, run whenever the branch settings change and on a schedule: with an agent's credentials, push a planted change that skips the local hook and sets its required check's status; the change must still fail to merge, and any merge is a failed test."
            runbook: shared:RB-F133
            test: 
              kind: game-day
              steps: "With the agent's own credentials, try to bypass the hook and post passing required-check statuses; assert the protected branch refuses the merge, then switch one setting off and assert the premise test fails and the premise is recorded as not holding."
        claim: jig:JC-27
