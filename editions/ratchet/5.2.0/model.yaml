  - id: s7.flow-cost-telemetry
    name: Flow/cost/operational telemetry
    aliases: 
      []
    system: S7
    level: store
    kind: store
    responsibility: "Queues, WIP, age, cycle time and unsuccessful work; provider/serving, fixture, context and remediation costs. Headline flow metric: handoffs per closed loop and queue time per handoff, against the profile's ceiling per claim. Attestation load as owner minutes and testing-team drafting hours per attestation. Delivery guardrail for each service under test uses DORA's current five metrics: change lead time, deployment frequency, failed deployment recovery time, change fail rate and deployment rework rate. Fix-capacity saturation signal: per owning team, accepted findings still open past the profile's remediation window, the trend of median accepted-finding age, and open accepted findings against the team's WIP cap; the signal is on when the age trend rises for the profile's window while open findings sit at the cap. Verification hours: intake, reproduction, disposition review and retest hours per accepted closure and per rejected candidate, counted for every arm. Remediation measures beside DORA's five: escape rate (security weaknesses reaching production per deployment, by weakness class, from the finding ledger and deploy records), time to remediate (reproduced finding to fix verified in the running system, from the finding ledger, the tracker and deploy records), remediation change fail rate (deployments of security fixes that cause a failure), cost per validated novel finding, validated findings arriving against verified fixes per weakness class, queue age of validated findings, the share of validated findings that are novel against recurring (matched on the finding ledger's path key), and weakness classes retired. Kept-test suite health: tests per lane and status, quarantine count and age against the organization's caps, re-proof results, and retirements by covering check. The escape rate counts only confirmed escape records detected within the organization's detection window, and is shown a second time with late escapes included. Escapes with no attributable deployment are counted in a bucket of their own, apart from both rates. Unconfirmed escapes are listed apart with their age, and each one older than the profile's alert age (the detection window when none is set) alerts the security risk owner. Beside each count of escapes sit their consequences: the consequence tiers of the assets reached and the services affected, time to recover for each, and how many fixes removed the weakness class against one instance. Agent actions against their limits: for every agent action, the two predictors written before it ran (its route's trailing accuracy over the organization's window, and the tier its limit allows with the action's class), its authority, what it touched, and its accuracy (from the independent check, or from the sampled check for an action that ran on a grant alone), and for each wrong action its cost measured apart from both predictors (time to recover and the incident severity the defensive side sets); the phase 2 report states which predictor better forecasts that cost, or that the sample is too small to decide. Fix-path cost: per owning team, the wait age of each validated finding still waiting with the security side for a complete fix path, and the security side's hours to prepare each fix path. Held dependencies: per control, the held findings it holds, their tests' last runs against their intervals, and the share of held-dependency tests whose run converted their finding, which measures how often a credited control fails. In-tier wait: per consequence tier, the time from a lead or scenario entering the tier's queue to its test starting, per path key, with the path keys a typed decision ordered last in consecutive windows listed beside it; each lead or scenario past the dial register's in-tier wait limit goes to the sampling service to be drawn. These are measures and signals only; the organization sets every threshold, and no measure widens a design limit. From the kept-test mirror, report contributed-test survival and promotion from instance to class with numerator, denominator, cohort, window and observation coverage. Missing observations read unknown and never imply zero drift or current protection."
