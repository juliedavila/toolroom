  - id: s5.finding-ledger
    name: Root-cause and finding ledger
    aliases: 
      - Canonical claim / finding ledger
      - Unresolved / rejected
      - Durable workflow + ledger
    system: S5
    level: store
    kind: store
    responsibility: "Record of decided dispositions: dedup lineage; accepted/rejected/unresolved/held records; attribution, expiry and invalidation for dismissals and risk acceptance. A held record keeps the weakness, the control the reproduction observed, the path and the id of its held-dependency test, and the conversion when one happens; an unresolved record keeps its reason. Written only by S5 disposition; no S2 or S3 write path. Partitioned by jurisdiction and business unit from the profile. Each accepted finding carries a canonical path key: its weakness class plus a defined path, made of the service and entry point the demonstrated path starts from, the identity or role it acts as, and the asset or action it reaches, each normalized to the names the scope and the consequence register use. A finding is novel when no earlier record has the same path key, and recurring when one does or when a road entry claims to retire its class; dedup lineage and the remediation measures match on this key. An accepted finding whose weakness reached production also carries its escape record: who detected it and through which source, the deployment it is attributed to (or none attributable) with the role and method that attributed it, and whether it was detected within the organization's detection window, who confirmed it (a role apart from every detecting role, the producer team and the program decision owner), and its cost: the consequence tiers of the assets reached and the services affected, time to recover, and whether the fix removed the weakness class or one instance."
