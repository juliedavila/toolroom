  - id: s3.gate-failure-policy
    name: Gate failure policy
    aliases: 
      - Pre-decided failure posture
      - Fail-open or fail-closed policy
    system: S3
    level: store
    kind: registry
    responsibility: "For each rejecting gate (regression stage, replay class), the failure posture to apply when the validation platform cannot answer: fail-closed, fail-open-with-record, or fail-open-under-expiring-acceptance. Computed when the finding is accepted, from the consequence tier of the assets its demonstrated path reaches (recorded at disposition; composed by the path-impact graph module where enabled), the blocking cost of the protected service, and threat signals. Keys on tier today. Core defaults: fail-closed when the path reaches a crown-jewel or critical asset, fail-open-with-record for standard; profiles may override with attribution. Unattested assets take the profile's required unattested_default. The schema accepts an impact_score key once a profile supplies scores. The posture applies only to deploys that touch the regression's declared dependencies (artifact, policy, identity), reusing the dependency-scoped invalidation rule; while the gate is unavailable every other deploy proceeds and is recorded. Thresholds are set by the security risk owner through the dial register. Ship-through on a critical or crown-jewel path is an attributed, short-lived acceptance by the business risk owner with security risk owner concurrence (signers changeable by profile). The posture is signed by key management with an expiry from the posture_expiry_hours dial (default above the worst credible recovery time, including region loss) and shipped with the pipeline stage, together with the tier defaults from the profile, so it applies when the control plane is down. An expired or untrusted posture falls back to its tier default (crown-jewel and critical fail closed; standard fails open with a record), never to fail-closed for a standard path, so an outage's blast radius does not grow with its length; an alert fires when any posture nears expiry. Every fail-open event owes an automatic replay once the platform recovers. Ship-through is reported as a rate per path, team and tier beside the deploy-gate SLO, and a path reaching the renewal cap (default 2 consecutive acceptances) refuses another until its posture is reviewed. Each path's posture review reads gate outcomes (outage holds, ship-throughs, post-recovery replay results, deploys held without a regression failure) and is triggered by the renewal cap, a failed post-recovery replay or the profile's interval."
    role_class: control
    trust_zone: control
    owner: Policy/IAM team operates; thresholds set by the security risk owner
    unpartitioned: Signed postures per gate; it holds no evidence.
