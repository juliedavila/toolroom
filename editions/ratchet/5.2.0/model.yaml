  - id: s6.developer-queue-filter
    name: Developer-queue filter
    aliases: 
      - Lead routing policy
      - Developer queue policy
    system: S6
    level: component
    parent: s6.hardening-service
    kind: service
    responsibility: "Decides which items reach a service team's work queue: every demonstrated finding (through the owner change connector as before), plus leads whose tool and rule clear the profile's confidence bar for that tool class (set from measured yield once it exists, from the profile default before). Leads below the bar stay visible to security and remain in the sampling frame. Leads at call sites the road conformance check marks covered-by-road for the lead's class (a vetted road entry version) are downgraded or held, at call-site granularity only: a lead at an unclassified or off-road call site in the same service routes normally. Holding a lead back is recorded as held, never as dismissed, and an obligation-mandated tool's leads follow the obligation's routing. When the filter is unavailable, no lead reaches developer queues; demonstrated findings still flow."
    role_class: control
    trust_zone: control
    owner: AppSec program + service owners (policy); evaluation (bar evidence)
    module: tool-portfolio
  - id: s7.tool-yield-evaluator
    name: Tool yield and miss-rate evaluator
    aliases: 
      - Lead sampling
      - Tool yield
    system: S7
    level: component
    parent: s7.evaluation-operations
    kind: service
    responsibility: "Measures what each tool, rule family and review practice is worth. Yield is judged per rule or vulnerability class on the organization's own code; a tool-level figure is only an aggregate of those. Yield: among a sample of leads drawn by the sampling service from a pre-registered random frame per tool class and rule family (frozen before results exist), the share the loop demonstrates when tested regardless of whether an agent chose them; untested leads are never counted as false. Miss rate: demonstrated paths in the tool's scope that no lead from the tool pointed at. Review claims: threat-model and review invariants contradicted by a demonstrated path. Reports intervals and sample sizes, keeps unresolved cases in the denominator, and draws no conclusion below the pre-registered minimum. Owned by evaluation, so no tool team grades its own tool."
    role_class: evaluation
    trust_zone: evaluation
    owner: Evaluation engineering + independent security owners
    module: tool-portfolio
  - id: s7.tool-delivery-impact
    name: Tool delivery-impact evaluator
    aliases: 
      - Tool DORA impact
      - Tool flow cost
    system: S7
    level: component
    parent: s7.evaluation-operations
    kind: service
    responsibility: "Measures what each tool costs the delivery system, as a side-quest metric beside yield. Direct measures from pipeline timings and tracker data: stage time and queue time attributable to each tool's gate, deploys blocked or delayed by the tool, and developer triage time per lead. Associations with DORA's five metrics (change lead time, deployment frequency, failed deployment recovery time, change fail rate, deployment rework rate) for services by tool configuration, reported as correlational only, never causal, with the comparison set and confounders named. Uses only the delivery metrics the profile says the organization already collects; a missing metric is reported as not measured, never estimated. Evidence for portfolio decisions, never a decision. Owned by evaluation, so no tool team grades its own tool."
    role_class: evaluation
    trust_zone: evaluation
    owner: Evaluation engineering + delivery-flow owner
    module: tool-portfolio
  - id: s7.tool-portfolio-decisions
    name: Tool portfolio decision record
    aliases: 
      - Integrate
      - migrate or deprecate decisions
    system: S7
    level: store
    kind: registry
    responsibility: "One record per tool (and per rule family where useful): integrate as a signal source, migrate the function into the loop or onto the paved road, or deprecate. Each decision cites the yield and miss-rate report, the developer toil (queue items and triage hours), the delivery-impact report (gate time, blocked deploys, labeled correlations with DORA's five metrics: change lead time, deployment frequency, failed deployment recovery time, change fail rate, deployment rework rate) and the cost, names the accountable decider (security risk owner by default, profile may change) and has a review date. Tools the profile flags as obligation-mandated cannot be deprecated outright: their deprecation means keep running for the obligation and remove from developer queues. Evaluation supplies evidence; it never decides."
    role_class: evaluation
    trust_zone: control
    owner: Security risk owner (decides) + evaluation engineering (evidence)
    module: tool-portfolio
    unpartitioned: "Decisions about the organization's tools; it holds no evidence."
  - id: s2.quarantined-lead-reader
    name: Quarantined lead reader
    aliases: 
      - Quarantined model
      - Dual-LLM reader
    system: S2
    level: component
    parent: s2.workflow-worker-app
    kind: service
    responsibility: "The only place submitter- or tool-written lead text (bug bounty and pentest prose, scanner messages, quoted repository strings) is read by a model. Runs with no tools, no artifact write path and no producer context: it sees one lead's free text and returns a schema-bound classification (failure class from an enumeration, location reference, rule reference, confidence band, bounded-length summary flagged untrusted). Its output is validated against that schema before it is stored beside the lead; it never reaches a producer as free text and never sets a lead's status. Its model requests pass the request-data gate like any other."
    role_class: producer
    trust_zone: reasoning
    owner: Validation workflow/producer platform team
    holds_nonpublic: true
    module: tool-portfolio
  - id: s7.dial-register
    name: Dial register
    aliases: 
      - Dials
      - Control settings register
    system: S7
    level: store
    kind: store
    responsibility: "One versioned register of every dial the program can turn: cadence step per regression, tier posture thresholds, ship-through renewal cap and posture review interval, developer-queue confidence bar, sample rates per frame, seeded-proposal rate, approver and verifier WIP and queue-age limits, handoff ceiling per claim, regression time budget per service, and the misses floor of each derived check, which the security risk owner sets. Each dial carries its floor or ceiling, current setting, safe direction, who may turn it and the evidence for the last turn; every turn appends with actor and evidence. A turn past a floor is refused unless it links a risk acceptance by the security risk owner, and the evaluation report shows each dial's history. Consumers read signed settings; while the register is unavailable no dial can be turned and consumers keep the last signed setting. Design limits and the consequence line are the exception: each version is signed with an increasing number and a lease, a narrowing is pushed to every reader at once, and a reader whose lease lapses sends grant-only actions to a person (F104). In S7 beside promotion and qualification records, in the control zone so no producer can write it."
    role_class: control
    trust_zone: control
    owner: Security risk owner (floors and below-floor acceptances); evaluation engineering operates
    unpartitioned: "Dials, design limits and the consequence line; it holds no evidence."
  - id: s7.sampling-service
    name: Sampling and seeding service
    aliases: 
      - Sampler
      - Frames and seeds
    system: S7
    level: component
    parent: s7.evaluation-operations
    kind: process
    responsibility: "The one place the program samples and seeds. Registers a frame, freezes it in the snapshot and cohort manager before results exist, draws reproducibly from a recorded seed, dispatches each draw as a validation request through the normal S3 envelope, and reports with intervals and sample sizes. Frames: model-made rejections, dedup merges and not-applicable calls, covered-by-road call sites, lead yield and held leads. Seed sets: planted known-true findings, received as fixture references and hashes only (assertions stay in S5; the independent verifier compares), each planted behind outsider text in a held-out fixture, so that a crafted report, tool lead, ticket or code comment sits in the path model triage reads, as it would for a real lead; seeded known-bad proposals sent to the action broker at the dial register's rate, indistinguishable from real proposals at the approval console; and seeded clearing requests carrying a planted instruction, sent at the same rate to the people who clear outsider text and indistinguishable from real ones at the review console. The suppression rate is the share of planted known-true findings that model triage rejected, merged as a duplicate, held below the bar or called not applicable, reported with its interval and sample size to the independent security staff; a planted finding with no outsider text in its path is not counted in it. Seeded proposals measure gate health; detecting what nobody flagged stays with the sampling frames and held-out exercises, never with approvers. Every human gate the four rules name is seeded: beside the approver's seeded proposals, the proof-condition holder receives seeded results that do not meet their proof condition, and the decider receives seeded findings and closures that should not be accepted, each indistinguishable from real ones and sent at the rate the organization's profile sets for that gate. Seeds are drawn from the stated categories of the organization's threat model for its own oversight and refreshed by the date the profile records, so people at a gate cannot learn to spot a fixed set. Outcomes come back from the approval service, the review console and the finding ledger. Per-person catch rates go to the seeding owner, who sits outside the gate's reporting line, and to each person for their own rate, never to a manager or a performance review; sponsors and managers see pooled rates. The service computes each breach of a gate's catch-rate floor from the recorded outcomes and opens the breach action the profile names; no person decides whether a breach happened. Rates come from the dial register and the profile and never fall below their floors without a recorded acceptance. The negative-challenge frame is drawn by consequence tier and by age, so a lead a model buried still reaches a person or a deterministic re-check: every tier draws at least the negative-challenge share, each tier at or above the consequence line at least the re-check floor the dial register sets, and every lead a model marked duplicate, low or not applicable, and every scenario a typed decision ordered last, that has waited in its tier past the register's in-tier wait limit is drawn whatever the sample. Flip-style seeds test the typed decision routes the way seeded proposals test approvers: pairs of planted leads, known-true and known-false, identical but for added text chosen to move a classifier's verdict (short appended token sequences, padding), placed like the planted findings and sent into each typed decision route at the seeded-proposal rate. A route's flip rate is the share of its pairs whose two typed decisions differ, reported per route with its interval and sample size as gate health to the independent security staff and the reliability monitor; a known-true lead that a route marked duplicate, low or not applicable counts in the suppression rate too. Owned by evaluation, so no frame's subject grades itself."
    role_class: evaluation
    trust_zone: evaluation
    owner: Evaluation engineering + independent security owners
  - id: s7.value-ledger
    name: Business-unit value ledger
    aliases: 
      - Value ledger
      - Payer view
    system: S7
    level: store
    kind: store
    responsibility: "For each business unit: cost paid (attestation minutes and drafting hours, regression stage time in its pipelines, triage, verification hours per accepted closure and per rejected candidate, closure acceptances, product-side hours per accepted finding), risk reduced on its assets (demonstrated paths to its crown-jewel and critical assets broken or constraint-enforced, regressions current, closures labeled by environment), friction removed (scanner findings and triage removed by the road and the developer-queue filter, analyst review time saved, test load avoided), and things that went right (first-run regression pass share, legitimate-function check pass share, false-failure rate, time to adapt a regression after a legitimate change). Sampled escapes are subtracted from every friction and risk figure. The quarterly status report reads from it, and the business risk owner sees it for their business unit."
    role_class: evaluation
    trust_zone: evaluation
    owner: Program/product + delivery-flow/finance owners
    unpartitioned: Aggregates per business unit; it holds no evidence content.
  - id: s7.failover-drill
    name: Failover drill
    aliases: 
      - Fallback requalification drill
      - Route drill
    system: S7
    level: component
    parent: s7.evaluation-operations
    kind: process
    responsibility: "Keeps every fallback route qualified before it is needed. On the dial-register interval (default 30 days) and after any change to a fallback route's model, serving stack or data, dispatches the pre-registered seeded cases as ordinary validation requests pinned to the self-hosted route (through the normal S3 envelope and the request-data gate), compares outcomes, cost and verification hours with the primary route's last qualified run, and sends the comparison to promotion review, which requalifies, narrows or demotes the fallback. A fallback whose last drill is older than the interval is marked stale in the route registry, and the route broker treats a stale fallback as unavailable, so a run pauses or drops to the next rung instead of using it. Owned by evaluation, so the serving team never grades its own route."
    role_class: evaluation
    trust_zone: evaluation
    owner: Evaluation engineering + independent security owners
  - id: people.control-plane-operator
    name: Control-plane operator
    aliases: 
      - Assurance-unit operator
      - Control-plane on-call
    system: shared:PEOPLE
    level: actor
    kind: person
    responsibility: "Role in the assurance unit that operates the control plane: authorization service, policy engine, grant store, credential leases, model-boundary gates, protected audit, evidence stores and signing keys. Administrative access only through the privileged access broker under dual control; never holds the producer, platform-operator or verifier role. Usually part of an existing platform security or SRE job; dedicating people is the organization's choice."
    role_class: human
    trust_zone: null
    owner: null
  - id: s3.privileged-access-broker
    name: Privileged access broker
    aliases: 
      - Just-in-time admin access
      - Break-glass broker
    system: S3
    level: container
    kind: service
    responsibility: "The only path to administer any part in the control zone. Just-in-time, time-bound sessions under dual control: the requester plus a second approver who is not the requester; break-glass additionally needs the security risk owner. Standing administrative credentials do not exist. Every session and command is recorded to protected audit before it runs, under custody the operator cannot alter. Direct database, console or key access to any control-zone part outside this broker is denied by network policy and alerts (F55). A session never edits evidence, grants, learned items, design limits or the consequence line: those change only through the part that owns them, signed. The broker itself is administered only through break-glass. Every AdminSessionRequest and AdminSessionApproval, including refused inputs that issue no session, is durably appended to protected audit before the broker acts. The record binds the authenticated sender, request reference, payload hash, scope, time, decision and refusal reason. Requester and approver cannot alter the record. An audit failure refuses the input and opens no session. Retries append attempts without overwriting earlier decisions."
    role_class: control
    trust_zone: control
    owner: Control-plane operator (assurance unit); security risk owner approves break-glass
    decision: deterministic
  - id: s3.key-management
    name: Key management
    aliases: 
      - Signing service
      - KMS
      - HSM-backed keys
    system: S3
    level: container
    kind: service
    responsibility: "HSM- or KMS-backed signing for every offline guarantee: gate failure postures, replay window bundles, injection restore grants, credential leases, execution receipts, dial settings and design limit versions, sample frames, context snapshots, evidence partitions, policy bundles, Ratchet's own software, image and weights releases, per-cell rollback authorizations and release-state provisioning with purpose release, learned items, fix briefs and secret revocation records. Private keys never leave it; consumers verify with versioned key references. Keys rotate on a schedule with overlapping validity windows: the new key signs while the old key still verifies until everything it signed has expired or been re-signed (F58). A compromised key is revoked, everything it signed is re-signed or marked untrusted, and consumers treat an untrusted posture as expired (F59). A restore grant the cell verified and took in before its key was revoked still runs at expiry, because undoing the injection is the safe direction; one that arrives after the revocation is refused. Keys are separate per evidence partition."
    role_class: control
    trust_zone: control
    owner: Control-plane operator (assurance unit)
    decision: deterministic
  - id: s3.local-audit-buffer
    name: Local audit buffer
    aliases: 
      - Cell audit buffer
    system: S3
    parent: s3.bounded-runner
    level: component
    kind: store
    responsibility: "Append-only, hash-chained audit buffer inside the execution cell. The runner writes the audit record here before each effect; the buffer drains to protected audit asynchronously. A buffer that cannot write, or that is full, stops execution (fail closed), so protected audit leaves the deploy-time path without weakening fail-closed audit."
    role_class: evidence
    trust_zone: execution
    owner: Platform operator (execution cells); custody of drained records with the independent assurance owner
    unpartitioned: "Holds one cell's records only until protected audit, which is partitioned, acknowledges them."
  - id: s3.replay-verdict
    name: Replay verdict check
    aliases: 
      - Mechanical replay verdict
    system: S3
    parent: s3.bounded-runner
    level: component
    kind: process
    responsibility: "For a pre-authorized regression replay, compares the observed outcome with the reviewed test's registered expected-outcome hash carried in the window bundle and returns pass, fail or unknown to the pipeline stage. Deterministic, no model. Unknown (target unavailable, cleanup unverified, hash mismatch on the bundle) applies the stage's posture. The receipt still goes to S5 intake, which can overturn a verdict on reproduction. For a finding of kind exposed secret it also judges the revocation check by the credential type's verification recipe: the issuer's status by identifier, which needs no value, where the issuer offers it; otherwise the status probe, an authentication attempt with the old credential, which counts as refused only on the codes the recipe maps to revoked or invalid and only when every attempt of the series, spread over the issuer's propagation time, is refused. It returns revoked, refused, accepted or unknown to S5 intake with each receipt, with no model; accepted or unknown leaves the finding open. The status probe is a reviewed primitive that may run from phase 2 without the production-effects module, from a fixed egress, only after the detection side has the announcement. The old credential reaches the cell only from the credential lease broker for that probe series, sealed under the owning team's key, and no model, lead or record ever holds its value."
    role_class: evidence
    trust_zone: execution
    owner: Platform operator (execution cells); tests and expected-outcome hashes owned by the regression catalog owner
    decision: deterministic
    decides: verdict
  - id: s3.policy-release-pipeline
    name: Policy release pipeline
    aliases: 
      - Policy as code
      - Control-plane release path
    system: S3
    level: container
    kind: pipeline
    responsibility: "The only path by which policy, egress allowlists, route tables, gate configuration and store schemas change, and the only path by which Ratchet's own software, runner and cell images and self-hosted model weights reach any part. Changes are code: the existing negative tests run as policy unit tests, a deny-diff report shows what a change would newly allow, and any widening needs the security risk owner's approval; rollout is staged (canary cell, then teams) with automatic rollback on a failing check or error-budget burn; schema changes to append-only stores use expand-and-contract migrations so a rollback never strands data (F56, F57). Software and images are built on a hosted, isolated build platform that generates and signs SLSA Build Level 3 provenance, follow the organization's secure development requirements, and are released with a signature from key management. Self-hosted weights are ingested on the same platform, whose provenance records the file's upstream source and digest (it attests the ingest, never how the model was trained), and are released by digest with a signature from key management; the route registry pins the digest as a new, unqualified route version once the attestation verifies (F102, F103, F131). While Ratchet's own error budget is burned, two kinds of change still release: a change whose deny-diff newly allows nothing (a narrowed limit, a revoked policy, a removed allowlist entry), and a security fix to Ratchet's own parts. Each is recorded with its direction and still passes the deny-diff, the policy unit tests and the staged rollout, and a security fix whose deny-diff widens anything still needs the security risk owner's approval. Every other change waits for the budget to recover or for an exception the security risk owner records. Withdrawal is per cell in this edition: a rolled-away release is refused on the stable logical cell that rolled back; another cell can still admit it. Fleet withdrawal needs a separate protocol in the next minor edition. It durably assigns every release a new increasing sequence and every cell rollback a new increasing rollback number, including automatic rollbacks. Key management signs releases, rollback authorizations and provisioning state with purpose release. The rollback authorization travels in the release attestation and binds the cell, expected highest verified sequence, running sequence being left, older target sequence and digest, rollback number and issued-through release sequence. It records every issued release and rollback in protected audit, reconciles each accepted older start with exactly one issued rollback number, and never reissues a rolled-away release sequence. To return to code at or above a rolled-away-from sequence it builds a fresh release with a new sequence above the cell's high-water mark and refusal ranges. It maintains the durable per-cell provisioning record outside disposable cells, including the mark, consumed rollback number and accumulated refusal ranges; authenticated provisioning supplies a new or rebuilt cell's first state from that record and refuses a stale or unavailable record, including after a storage restore."
    role_class: control
    trust_zone: control
    owner: Control-plane operator (assurance unit); security risk owner approves widening changes
    decision: deterministic
  - id: s7.reliability-monitor
    name: Reliability monitor
    aliases: 
      - Ratchet SLO monitor
      - Error budget monitor
    system: S7
    parent: s7.evaluation-operations
    level: component
    kind: service
    responsibility: "Ratchet's own service-level objectives and error budgets (the design model ratchet_slos): approval latency, grant success, intake-to-verified time, evidence durability, posture freshness and canary freshness. Pages the on-call operator roles; a silent loop canary trips an external dead-man alarm (F65); a floor-bearing sampling draw or failover drill that misses by a day alerts and the gap counts against its floor (F67). When a budget burns it freezes Ratchet's own releases through the policy release pipeline; it never blocks a product deploy. Missing indicators read as unknown and page, never as healthy. Opens a postmortem record whenever a named trigger fires (the postmortem triggers in Ratchet's operating policy), owned by the on-call role of the first failing part. The review is blameless: it states contributing causes as conditions of the system, never as a person, and turns each action item into a design change, a profile change or a work unit with an owner. The security risk owner reads and signs each one, and an open postmortem stays on the status report until it closes."
    role_class: evaluation
    trust_zone: evaluation
    owner: Evaluation engineering + control-plane operator (on-call)
  - id: s2.typed-decision-worker
    name: Typed decision worker
    aliases: 
      - System One worker
      - Decision model worker
    system: S2
    level: component
    parent: s2.workflow-worker-app
    kind: service
    responsibility: "Answers declared decision types with a typed model route: lead triage and deduplication, the probability behind the developer-queue confidence bar, scenario ordering inside a consequence tier, consequence-tier drafts for the testing team, gate-health anomaly scores, and output flags that send an agent result to human review. Calls models only through the request-data gate, only on routes the registry marks qualified for that decision type, and with structured inputs (no secrets, no proof conditions). Each decision type declares a fallback (frontier text route or a rule) used when the typed route is down, stale or narrowed. Emits TypedDecision records, which are advisory: they never authorize, never count as coverage, never set a verdict, never close a finding and never attest a tier (lint rule model-advisory). Exploitability is never a decision type."
    role_class: producer
    trust_zone: reasoning
    owner: Producer and adapter engineering
  - id: s2.proof-condition-drafter
    name: Proof-condition drafter
    aliases: 
      - Proof-condition drafting model
    system: S2
    level: component
    parent: s2.workflow-worker-app
    kind: service
    responsibility: "Drafts a scenario's proof condition for its owner: what the running system must show for the weakness to count as real, what would show it is not, and what must still work for legitimate users. Reads the finding or lead and the scenario's scope, which may carry outsider-written text, so it runs like the quarantined lead reader: no tools, no artifact write path, no context store shared with test-drafting agents, and its model requests pass the request-data gate. Its draft goes only to the scenario owner, who corrects it and signs it into the fixture and oracle registry; an unsigned draft is never a proof condition and never reaches a test-drafting agent."
    role_class: producer
    trust_zone: reasoning
    isolated_draft: true
    owner: Validation workflow/producer platform team
  - id: people.scenario-owner
    name: Scenario owner
    aliases: 
      - Proof-condition owner
    system: shared:PEOPLE
    level: actor
    kind: person
    responsibility: "Owns one scenario: chooses it (by hand, from a lead, or from the existing discovery practice), names who owns its scope, fix and acceptance, and writes and signs its proof condition, often correcting a draft from the proof-condition drafter. Sometimes in security, sometimes the service or business owner. Never the team that drafts the scenario's tests."
    role_class: human
