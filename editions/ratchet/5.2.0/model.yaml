      - Golden paths
      - Guardrails and secure defaults
    system: S6
    level: store
    kind: registry
    responsibility: "The shared platform's catalog of abstractions engineers build on: developer-portal software templates and scorecards, base images and container platform policies, API and authentication libraries, gateway policies, secure defaults and linters. Each entry is versioned and declares the failure classes it claims to retire, its enforcement kind (enforced: compile-time check, framework default or platform policy that applies without the engineer choosing it; opt-in: a library or template the engineer must choose to use), how a service proves it uses the entry, and its escape hatches. Enforced entries are preferred when choosing what to put on the road. An opt-in entry confers covered-by-road status only at call sites the deterministic per-call-site conformance check proves. Every escape-hatch use records a reason, and the reasons feed the road owner's backlog as product demand. Entries change only through the platform's normal review and release path; a candidate road change from a producer is a proposal, never a merge. A retirement claim counts only after the independent verifier confirms it with varied-path fixtures."
    role_class: existing
    trust_zone: shared:existing
    owner: Shared platform / developer-experience team
