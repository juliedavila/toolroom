    module: secure-creation
    measures: "Per derived check: its kept test's replay failures on changes deployed since the check's version was issued, over the window, against the floor set for the check"
    description: "How often changes get past one derived check while its weakness stays: the replay failures of the check's kept test on changes deployed since the check's version was issued, over a window, against the floor set for the check. Counted by the regression catalog from the replay verdicts it receives, and this count is all of them that reaches the loop: no change id, no replay result and no test content. The pipeline stage still shows a deploy's pass or fail, as it does without the loop. The loop shows the count beside its own log of checks dropped or disabled, and a check over its floor goes to the policy-owning team, who can retire it from the check suite. The security risk owner sets each check's floor in the dial register. A request back to Ratchet to rework a check is not drawn in this edition; retiring is the owner's way out."
    produced_by: 
      - s6.regression-catalog
    consumed_by: 
