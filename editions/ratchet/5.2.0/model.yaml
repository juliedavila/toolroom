contracts: 
  - name: ContextQuery
    description: Scope-bound context request accepted by S1.
    produced_by: 
      - s2.workflow-worker-app
    consumed_by: 
      - s1.context-service
  - name: ContextSnapshot
    description: "Scope, data classification, fact sources and versions, validity, observed/declared/inferred, lineage joins, invariant versions, unresolved or conflicting facts, query scope and time window, cursor, returned/total-or-unknown, truncation and completion, access policy. Each item carries its outsider label set (OutsiderLabelSet), computed by the context compiler from the item's source records; a cleared field carries its clearing record."
    produced_by: 
      - s1.context-compiler
      - s1.context-service
    consumed_by: 
      - s2.workflow-worker-app
      - s1.snapshot-index
      - s1.live-precondition-resolver
  - name: ValidationRequest
    description: "Objective, entity scope, targets, environment, permitted action class, approved producers, time and cost limits, owner, acceptance rule."
    produced_by: 
      - s2.operator-interface
      - s2.request-dispatcher
      - s7.assurance-incident-integration
      - s7.sampling-service
      - s7.failover-drill
      - s6.kept-test-mirror
    consumed_by: 
      - s2.workflow-engine
      - s2.workflow-worker-app
      - s2.request-dispatcher
  - name: CandidateFinding
    description: "Attacker start, required capability, claimed boundary failure, ordered transitions, source revision, evidence type and references, supplied or omitted steps, unresolved fact, producer mode. Lead refs: ids of tool leads that pointed at the hypothesis, provenance only. Carries its outsider label set (OutsiderLabelSet), which evidence intake attaches from the request-data gate's records for the run that produced it and never takes from the producer's own fields: a field the response-proposal gate constrained to a closed set or resolved against a store is recorded as cleared by that gate, and every other field carries the run's labels."
    produced_by: 
      - s2.producer-adapters
      - s4.response-proposal-gate
      - people.held-out-assessors
    consumed_by: 
      - s5.evidence-intake-validator
      - s5.finding-ledger
      - s5.proof-evidence-service
      - s2.artifact-exchange
      - s5.independent-verifier
      - s2.workflow-worker-app
      - s2.producer-adapters
  - name: ValidationArtifact
    description: "Integrity digest, target/fixture/data scope, source and disposition, original and patched test receipts; artifact type, origin, reproduced variants. Carries its outsider label set (OutsiderLabelSet), attached when it enters evidence from the request-data gate's records for the run that produced it: payloads, steps and seeds a producer wrote carry the run's labels."
    produced_by: 
      - s2.producer-adapters
      - s2.hybrid-source-producer
      - s2.runtime-assessment-producer
      - s2.workflow-worker-app
    consumed_by: 
      - s2.artifact-exchange
      - s5.independent-verifier
      - s7.matched-evaluation-executor
      - s5.proof-evidence-service
      - s7.snapshot-cohort-manager
  - name: PatchCandidate
    description: "Proposed diff with target and fixture binding, original and patched outcomes, unresolved or failed tests; emitted as a reviewed proposal into existing engineering workflows, never self-merged. A seeded known-bad change for a reviewer-drift baseline does not travel as a PatchCandidate: its fixture binding and expected outcomes stay in the sampling service's frame, and only the change itself, as a SeededChange, goes to the engineering system and the reviewers. Carries its outsider label set (OutsiderLabelSet): a candidate a producer's model drafted carries its run's labels from the request-data gate's records, and a candidate the fix drafter writes from a fix brief carries the brief's labels, which a derived brief never has. For a co-created security correction, the one pull request includes the component-local instance regression and records security and owning-engineer participation. That visible test carries no proof condition, chained-path validation, protected fixture or aggregate expected outcome. A variant is a new finding through the normal loop and never silently expands this proposal."
    produced_by: 
      - s2.hybrid-source-producer
      - s4.response-proposal-gate
      - s6.owner-change-connector
      - s7.sampling-service
      - people.purple-team
    consumed_by: 
      - s5.repair-checks
      - s6.enterprise-adapters
      - shared:ext.engineering-workflows
      - s7.sampling-service
      - s2.workflow-worker-app
      - s2.producer-adapters
      - s2.artifact-exchange
      - s6.paved-road-catalog
  - name: ActionSpec
    description: "Authenticated actor, reviewed primitive, bound target, normalized parameters with the version of the primitive's normalizer (the runner parses what it executes with the same version), the target's resolved address as checked at execution, prerequisite evidence, effect limits, approval binding, expiry, replay or idempotency control, policy version. A proposal confers no authority; the approval binding is set by the approval side, never by the proposer."
    produced_by: 
      - s2.producer-adapters
      - s2.workflow-worker-app
      - s4.response-proposal-gate
      - s6.retest-regression-planner
      - s7.sampling-service
      - s2.hybrid-source-producer
      - s2.runtime-assessment-producer
    consumed_by: 
      - s3.action-broker
      - s3.action-control-service
      - s3.policy-decision-point
      - s3.approval-console
      - s2.workflow-worker-app
      - s2.producer-adapters
  - name: ExecutionGrant
    description: Denial or short-lived exact grant bound to the ActionSpec fields; consumed atomically by the local enforcement point.
    produced_by: 
      - s3.policy-decision-point
      - s3.action-control-service
    consumed_by: 
      - s3.local-enforcement-point
      - s3.grant-approval-store
      - s3.bounded-runner
      - s3.source-build-cell
      - s3.staging-cell
      - s3.production-cell
    security: 
      raised: 
        by: Ratchet design owner
        why: "The grant authorizes every action Ratchet takes, and no model check reads its fields, so a crossing that carries it must be declared on its seam like a control."
  - name: ExecutionReceipt
    description: "Effective target and identity, tested state, outcomes and telemetry, execution and policy versions, cleanup status, proof scope. Carries its outsider label set (OutsiderLabelSet) field by field: steps and payloads replayed from a producer's artifact keep that artifact's labels, and the target's responses are labeled as outsider text. On the way into evidence the independent verifier clears only the fields it constrains (the verdict, status classes, assertion results, references and hashes); every other field keeps its labels."
    produced_by: 
      - s3.bounded-runner
      - s3.observation-receipt
      - s3.staging-cell
      - s3.production-cell
      - s3.action-control-service
    consumed_by: 
      - s5.evidence-intake-validator
      - s5.independent-verifier
      - s5.finding-ledger
      - s3.protected-audit
      - ext.soc-incident-response
      - s5.proof-evidence-service
      - s3.observation-receipt
      - s3.replay-verdict
      - s5.fix-brief-builder
  - name: FindingDisposition
    description: "Versioned disposition with proof mode, environment, assumptions, reviewer and risk acceptance if any. State: confirmed, rejected, unresolved or held. An unresolved disposition carries its reason. A reproduction that fails with no control observed stopping it is unresolved with reason reproduction failed, and is never rejected, because a reproduction can fail on a condition the report left out. Held: the independent reproduction ran in the deployed system and stopped short of the proof condition at a control its receipt observed refusing the step. The held record names the weakness, that control (the part, rule or setting and its version, as the receipt shows it) and the path up to it; the assets the proof condition names, with the consequence tier the business owner confirmed for them; and the id of its held-dependency test, the kept test that runs the path against that control and meets the proof condition only once the control stops holding. A held finding is neither exploitable nor closed: it is tracked as a resilience concern and never queued as exploitable, and the weakness still closes only through its kind's closure. Only a kind that declares held in the finding-kind registry admits a held disposition, and disposition review refuses one under another kind or with no held-dependency test. A held finding reads unresolved in every record and measure while its test is missing, has no owner or re-test interval, or has not run within that interval. When the test's run meets the proof condition, the finding becomes confirmed with the reach that run demonstrated, the tier recorded at hold and urgency read from the attacker-side signals, with no new triage. A control credited from a ticket, a diagram, a model's reasoning or a person's word, and never observed in a reproduction, holds nothing: the finding stays confirmed or unresolved as its reproduction showed. validation_basis: independent-reproduction, or self-validated with the AutonomyGrant id it ran under. A self-validated finding keeps that label in every record and measure, so each measure can be read with and without it. finding_kind, optional: the id of a kind in the model's finding-kind registry, absent meaning path. The shipped kinds are path (a weakness demonstrated through the running system), exposed-secret (a live credential found in code, history, logs, tickets or another store) and infra-misconfiguration (live infrastructure configuration that does not match its declared intent); an organization adds kinds by patch to the registry. A disposition naming an unregistered kind is refused at intake. The kind decides how the finding closes: its closure check, kept gate, recovery measure, and what never closes it. An exposed-secret finding is confirmed from the scan rule's hit and the credential's issuer and identifier, carries a fingerprint of the value and never the value, and is fixed by revoking and rotating the credential, which the owning team does through its fix path; its SecretRevocation record holds the fix and the check that closes it. Carries the outsider label set (OutsiderLabelSet) of its inputs field by field, less the fields the independent verifier or a person at the review console cleared, each with its clearing record."
    produced_by: 
      - s5.disposition-review
      - s5.proof-evidence-service
      - s5.protected-evidence-store
      - s5.path-impact-graph
    consumed_by: 
      - s5.finding-ledger
      - s6.owner-change-connector
      - s6.hardening-service
      - people.engineering-owners
      - people.independent-security-staff
      - people.risk-acceptance-owner
      - s1.context-compiler
      - s3.gate-failure-policy
      - s7.tool-yield-evaluator
      - s6.retest-regression-planner
      - s7.sampling-service
      - s5.path-impact-graph
      - s5.failure-class-registry
      - s3.approval-console
      - people.accountable-authorities
      - s1.tool-lead-store
  - name: RegressionSpec
    description: "Test id and version, invariant and context dependencies, declared dependencies at a fixed grain (the artifact digests it exercises, each library at its resolved version, each configuration key it reads, each policy id and identity), expected boundary behavior, observation projection (the fields of an observed outcome its verdict hashes, such as refused or allowed, status class and assertion results, and the fields it excludes, such as timestamps, session ids and ordering), authorized replay triggers, execution_class (static | in-process | runtime-replay) and expected_runtime. A kept regression with a static or in-process execution class may yield a DerivedCheck; the regression itself never leaves the loop. This protected record specifies security-owned aggregate validation, including proof conditions and chained paths. It is separate from the visible component-local InstanceRegression kept in the owning team's suite. Passing that local test cannot satisfy this record or replace independent verification. No separate variant probe set is maintained."
    produced_by: 
      - s6.retest-regression-planner
      - s6.hardening-service
    consumed_by: 
      - s6.regression-catalog
  - name: ModelRequest
    description: "Proposed model request bound to task/data/tool/context/fixture eligibility. Carries its outsider label set (OutsiderLabelSet), which the request-data gate computes as the union of the labels on the context items the run was given and on everything the run has received since: earlier responses, and the observations its receipts record, where a target's response counts as outsider text. A label set the producer supplies is ignored and logged."
    produced_by: 
      - s2.producer-adapters
      - s2.workflow-worker-app
      - s4.request-data-gate
      - s2.quarantined-lead-reader
      - s2.typed-decision-worker
      - s2.proof-condition-drafter
    consumed_by: 
      - s4.request-data-gate
      - s4.model-data-gateway
      - s4.route-budget-broker
      - s4.inference-endpoints
      - ext.hosted-frontier-endpoint
  - name: TestFixture
    description: "Target revision, build and toolchain, harness and instrumentation, protected original, environment differences, preparation validation."
    produced_by: 
      - s5.fixture-oracle-registry
    consumed_by: 
      - s5.independent-verifier
      - s3.action-control-service
      - s7.sampling-service
      - s6.retest-regression-planner
  - name: OracleSpec
    description: "Owned invariant, expected effect, permissible evidence, hidden expected value or assertion, negative controls, valid prerequisites, legitimate behavior checks, cleanup obligations."
    produced_by: 
      - s5.fixture-oracle-registry
      - people.scenario-owner
    consumed_by: 
      - s5.independent-verifier
      - s5.fixture-oracle-registry
  - name: EvaluationSnapshot
    description: "Stage boundary, immutable inputs, context and policy versions, qualified model/tool configuration, environment state, budget, disposition lineage, held-out or training partition."
    produced_by: 
      - s7.snapshot-cohort-manager
      - s2.workflow-worker-app
      - s7.matched-evaluation-executor
      - s7.failover-drill
    consumed_by: 
      - s7.matched-evaluation-executor
      - s7.evaluation-artifacts
      - s7.evaluation-operations
      - s2.hybrid-source-producer
      - s7.snapshot-cohort-manager
      - s7.value-ledger
      - s7.promotion-review
  - name: ConsequenceFact
    description: "Asset or service id, business unit, tier (crown-jewel | critical | standard, required), impact_score (number or null), blocking-cost tier for services, attestation_state (confirmed | drafted-unconfirmed | unattested), drafted_by (testing team identity), drafted_from (source references: BIA, continuity tier, data classification, service catalog), confirmed_by (business owner) or null, confirmed_at, owner_minutes, re-attestation trigger (material-change reference) or calendar maximum, version, supersedes."
    produced_by: 
      - s1.consequence-register
      - s5.path-impact-graph
      - people.line-of-business-owner
    consumed_by: 
      - s1.context-compiler
      - s5.path-impact-graph
      - s3.gate-failure-policy
      - s7.flow-cost-telemetry
      - s7.value-ledger
      - s1.consequence-register
      - s7.dial-register
      - s3.policy-decision-point
      - s6.fix-cap-gate
  - name: RunRecord
    description: "Run id, ValidationRequest ref, bundle versions (context snapshot, model route, producer, fixture), ordered attempts each with state (proposed | authorized | dispatched | effect-uncertain | succeeded | failed | cancelled), grant ref, receipt ref, idempotency key, timestamps; producer mode; terminal status. Delivery acknowledgment never sets succeeded."
    produced_by: 
      - s2.workflow-engine
      - s2.workflow-worker-app
      - s3.action-control-service
    consumed_by: 
      - s2.workflow-state-store
      - s5.evidence-intake-validator
      - s7.evaluation-artifacts
      - s7.flow-cost-telemetry
      - s7.evaluation-operations
  - name: CostHandoffEntry
    description: "Run or case id, activity (the loop step, STEP-1 to STEP-11), role, actor identity, hours, model and compute cost, handoff from role to role, enqueued-at, started-at, completed-at (queue time derived), outcome; includes failed, rejected and disputed attempts. Product-side hours and attestation load are first-class rows."
    produced_by: 
      - s2.workflow-engine
      - s6.owner-change-connector
      - s4.route-usage-receipts
    consumed_by: 
      - s7.flow-cost-telemetry
      - s7.matched-evaluation-executor
      - s7.evaluation-operations
      - s2.request-dispatcher
      - s7.value-ledger
  - name: FailureClass
    description: "Class id, version, kind (first-party pattern | third-party component), definition (the invariant the members violate), member finding ids (each independently reproduced), services and components spanned, max consequence tier reached (from the path-impact graph), road entries claiming to retire it with each claim's closure state (path-broken | constraint-enforced) and verdict reference, accepted_by (disposition reviewer), supersedes, optionally regression_ids (the kept regressions and derived checks that hold the class), and optionally cwe_ids (CWE weakness ids, set or changed only by the disposition reviewer, so retired classes can be compared across teams and with published data). Never created or merged by a model judgment, and a CWE id is never set by a model or a producer identity."
    produced_by: 
      - s5.failure-class-registry
    consumed_by: 
      - s6.owner-change-connector
      - s7.road-adoption-telemetry
  - name: RoadAdoption
    description: "Service id, call site or code path id (the unit of conformance; never the whole service), road entry id and version, assurance record reference (must be current), classes covered at that call site, conformance verdict (on-road | off-road | escape-hatch | unclassified, where unclassified counts as off-road), check id and rule version (static or build-time), deployed-state evidence reference, escape hatch used and its expiry, regressions inherited and regressions reinstated, observed-at."
    produced_by: 
      - s6.road-conformance-check
    consumed_by: 
      - s6.retest-regression-planner
      - s7.road-adoption-telemetry
      - s1.context-compiler
      - s6.developer-queue-filter
  - name: RoadAssurance
    description: "Road entry id and version, classes claimed, per-class verdict (constraint-enforced | path-broken | failed) with fixture set and verdict references, road-level regression results, vetted scope (APIs, configurations, call patterns) and known limits, vetted_by (independent verifier), vetted_on, status (current | superseded-by-version | withdrawn-after-leak)."
    produced_by: 
      - s5.road-assurance-record
      - s5.independent-verifier
    consumed_by: 
      - s6.road-conformance-check
      - s7.road-adoption-telemetry
      - s5.road-assurance-record
  - name: PortfolioDecision
    description: "Tool id (and rule family), decision (integrate | migrate-to-loop | migrate-to-road | deprecate | keep-for-obligation), scope (whole tool, or rule family scoped off call sites covered by a named vetted road entry), evidence report reference (yield and miss rate with intervals and sample sizes, toil, cost), delivery-impact report reference (gate stage and queue time, blocked or delayed deploys, triage time; associations with DORA's five metrics labeled correlational), obligation_mandated flag, decided_by (security risk owner by default), decided_on, review date, and for a migration the target road entry or loop seam."
    produced_by: 
      - s7.tool-portfolio-decisions
    consumed_by: 
      - s6.owner-change-connector
      - s6.developer-queue-filter
  - name: DialSetting
    description: "Dial id, name, unit, safe direction (up or down), floor or ceiling (core default and profile value), current setting, scope (program, claim, service, path or tool class), who may turn it, last turned by and at, evidence for the last turn, linked risk acceptance id when the setting is past its floor, signature and expiry."
    produced_by: 
      - s7.dial-register
      - s7.tool-yield-evaluator
      - people.security-risk-owner
    consumed_by: 
      - s6.retest-regression-planner
      - s3.gate-failure-policy
      - s6.developer-queue-filter
      - s7.sampling-service
      - s2.request-dispatcher
      - s7.evaluation-operations
      - s7.dial-register
  - name: SampleFrame
    description: "Frame id, frame kind (negative-challenge, covered-call-site, lead-yield, held-lead, planted-finding seed set, seeded-proposal seed set, seeded-change seed set, flip-seed set, self-validation check), population definition, strata (for the negative-challenge frame: consequence tier and age, each with its floor), rate from the dial register, random seed, frozen-at (before any result), drawn item ids, dispatched request ids, outcomes, interval and sample size. Planted findings appear as fixture references and hashes only. A flip-seed set holds pairs of planted leads identical but for added text, each with the typed decision route it was sent into. A self-validation check frame samples findings validated under an AutonomyGrant and checks them by a different means, feeding its honesty and correctness records."
    produced_by: 
      - s7.sampling-service
    consumed_by: 
      - s7.snapshot-cohort-manager
      - s2.request-dispatcher
      - s7.tool-yield-evaluator
      - s7.road-adoption-telemetry
      - people.independent-security-staff
    measures: "Outcomes of each frame's draws with interval and sample size: the seeded catch rate for a seed-set frame, the flip rate per typed decision route for a flip-seed set, the suppression or yield rate for the others"
  - name: ValueLedgerEntry
    description: "Business unit, period, cost paid (attestation minutes, drafting hours, regression stage time, triage, closure acceptances, product-side hours), risk reduced on its assets (paths broken or constraint-enforced by asset tier, regressions current, closures by environment), friction removed (scanner findings and triage removed, test load avoided) net of sampled escapes, things that went right (first-run regression pass share, legitimate-function pass share, false-failure rate, time to adapt a regression), agent arm versus no-agent arm (descriptive until phase 3), sources."
    produced_by: 
      - s7.value-ledger
    consumed_by: 
      - people.risk-acceptance-owner
      - s7.evaluation-operations
      - people.line-of-business-owner
    measures: "Per business unit and period: risk reduced on its assets by consequence tier, against cost paid and friction removed"
  - name: AdminSession
    description: "Session id, requester role and identity, second approver identity (never the requester), break-glass flag and security risk owner approval id when set, target part, permitted operations, start and expiry, every command with its time and result, recording hash. Never carries content edits to evidence or grants. The privileged access broker records each session to protected audit, with its requester, its second approver and any break-glass approval, before the session opens, and each command before it runs, under custody the operator cannot alter."
    produced_by: 
      - s3.privileged-access-broker
    consumed_by: 
      - s3.policy-decision-point
      - s3.grant-approval-store
      - s3.key-management
      - s5.protected-evidence-store
      - s4.request-data-gate
      - s4.response-proposal-gate
      - s3.protected-audit
      - s3.action-control-service
      - s5.proof-evidence-service
      - s1.live-precondition-resolver
      - s6.release-state-correlator
      - s6.retest-regression-planner
      - s6.road-conformance-check
      - s6.developer-queue-filter
      - s6.fix-cap-gate
      - s7.promotion-review
      - s7.assurance-incident-integration
      - s5.fixture-oracle-registry
      - s5.finding-ledger
      - s6.change-closure-records
      - s6.regression-catalog
      - s1.consequence-register
      - s5.path-impact-graph
      - s3.gate-failure-policy
      - s5.failure-class-registry
      - s5.road-assurance-record
      - s7.tool-portfolio-decisions
      - s7.dial-register
      - s6.fix-cap-refusal-log
      - s5.learning-store
      - s3.policy-release-pipeline
      - s3.privileged-access-broker
      - s6.kept-test-mirror
  - name: KeyReference
    description: "Key id, version, algorithm, public key or certificate chain, purpose (posture, bundle, lease, receipt, dial, limit, frame, snapshot, partition, restore, release, learned item, fix brief, revocation), partition when set, valid-from, signs-until, verifies-until (overlap window), revocation status. Private key material never leaves key management."
    produced_by: 
      - s3.key-management
    consumed_by: 
      - s3.gate-failure-policy
      - s3.credential-lease-broker
      - s3.observation-receipt
      - s7.dial-register
