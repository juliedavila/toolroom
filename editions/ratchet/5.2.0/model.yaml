  - id: s3.action-control-service
    name: Action control service
    aliases: 
      - S3 · Authorized effects
      - S3 boundary contract
      - Separately enforced control APIs
      - Action policy + broker
      - External policy + cells
      - External authorization
    system: S3
    level: container
    kind: service
    responsibility: "Receive an authenticated, normalized ActionSpec; issue a denial or short-lived exact ExecutionGrant; produce a runner ExecutionReceipt including actual identity/target, observations, limits and cleanup. For attack injection, refuses with no person involved any injection past the pipeline whose layer or environment the declared injection policy does not allow, and every one while no policy is declared, before an approval request exists. Issues each injection grant with its restore approved inside it and an expiry at the service owner's time limit; a production grant also expires within the exposure window the profile sets, and is issued only for attack injection the approved production profile names explicitly. With each injection grant it issues a signed, single-use restore grant with the same expiry, sealing into it the restore credential the lease broker issued for that grant, and delivers it to the local enforcement point of the cell that applies the injection; the injection does not start until that cell holds it. The restore at expiry is the cell's to run, with no call to this service or the lease broker, and this service only records it. On the trusted agent's stop it revokes the grant at once and tells the cell to run the held restore now, within the organization's ceiling from stop to the environment restored. Failing closed covers effects not yet started: while this service or the lease broker is down no new injection starts, and every running one is still restored by its cell at the time limit."
    role_class: control
    trust_zone: control
    owner: "Assurance control unit: Policy/IAM + execution-cell/SRE (reporting line separate from S2 and S4 producer teams)"
    decides: authorization
  - id: s3.action-broker
    name: Action broker
    aliases: 
      []
    system: S3
    level: component
    parent: s3.action-control-service
    kind: gateway
    responsibility: Validate primitive/schema; normalize actual targets and destination rules. Reject changed or unknown requests.
    role_class: control
    trust_zone: control
    owner: Policy/IAM + execution-cell/SRE team
  - id: s3.policy-decision-point
    name: Policy decision point
    aliases: 
      - Policy decision and approval
    system: S3
    level: component
    parent: s3.action-control-service
    kind: service
    responsibility: "Resolve current facts, required human approval, data/environment scope and exact effect envelope. Required human approval is tiered by consequence: an action outside its producer's design limit, or one whose effects reach an asset at or above the organization's consequence line, needs a person's approval of that exact action; an action inside the limit and below the line may run on a reviewed grant alone (a standing permission or batch approval) once the trust gate holds. With no limits declared, approval is exactly as before limits existed: kept regression tests replay on their reviewed per-batch approvals and standing permissions along the cadence ladder, and every other action needs a person's approval. Limits declared while the consequence line is unset change nothing yet: no new grant-only action runs until the line is set. Once limits and the line are set, a producer with no limit has every action approved by a person, and kept-test replays sit inside their producer's limit like any grant. Honors a grant only when it was checked against the current limit version. Reads limits from its signed, versioned copy of the dial register's limits and current tiers from its copy of the consequence register at every decision, so neither register's outage stops a decision; a narrowing or a tier rise is pushed at once and applies on arrival, and while either copy's lease has lapsed every action that would run on a grant alone goes to a person (F104); an unattested asset counts at the profile's unattested default."
    role_class: control
    trust_zone: control
    owner: Policy/IAM + execution-cell/SRE team
    decides: authorization
    grants_authority: true
  - id: s3.approval-service
    name: Approval service
    aliases: 
      []
    system: S3
    level: component
    parent: s3.action-control-service
    kind: service
    responsibility: "Authorized person / role / workflow; reason, expiry, exact action binding. Issues three kinds of approval to match the cadence ladder: per run (periodic), per batch naming tests, targets and window (scheduled), and standing permission for one reviewed test, target, identity and environment with an expiry (continuous). With no design limits declared these serve kept regression replays, as before; once limits and the consequence line are set, batch approvals and standing permissions may also serve other reviewed agent actions inside their producer's limit. Standing permissions are revoked when the planner steps a test down. On each new limit version, re-checks every outstanding batch approval and standing permission against it and revokes any that is wider. Reads limits from its signed, versioned copy; while that copy's lease has lapsed it issues no new batch approval or standing permission and sends each request to a person action by action (F104). Seeded known-bad proposals from the sampling service arrive at the dial-register rate (default 1 in 50 approvals), indistinguishable at the console; their outcomes give approval, edit and reject rates a denominator. Never issues a standing permission or batch approval wider than the design limit of the producer it serves, or reaching an asset at or above the consequence line; such a request goes to a person action by action. Counts the approval requests sent to each approver and holds them to the dial register's rate per approver per hour and to the approver's work-in-progress limit; requests past either wait in order, so no approver receives a flood, and a count past its trailing baseline alerts the control-plane operator and the seeding owner as a possible attack on the gate. While the rate is unset, the work-in-progress limit alone bounds the requests and the gap is reported."
    role_class: control
    trust_zone: control
    owner: Policy/IAM + execution-cell/SRE team
    decides: authorization
    grants_authority: true
