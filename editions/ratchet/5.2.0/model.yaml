    responsibility: "Per service and per entry: adoption, escape-hatch rate, reintroduction rate on and off the road, findings per change on and off the road (split by human-written and agent-generated where the organization can label it), and the share of accepted findings whose class has a road answer. Also measures what analysis tailoring buys and costs: scanner findings, triage time and analysis effort removed for covered-by-road call sites, against escapes found by testing a pre-registered sample of covered call sites (drawn by the sampling service). Reports time-to-adopt per entry and the top escape-hatch reasons beside the hatch rate, so a rising rate can read as a missing road capability as well as drift; hatch reasons go to the road owner's backlog as product demand. Owned by evaluation, so the road team never grades its own road. For the secure-creation loop it computes each reviewer's seeded known-bad changes caught over those received, and sends the loop only those counts, never which changes were seeds."
    role_class: evaluation
    trust_zone: evaluation
    owner: Evaluation engineering + independent security/product owners
    module: paved-road
  - id: s5.road-assurance-record
    name: Road assurance record
    aliases: 
      - Road vetting record
      - Vetted road versions
    system: S5
    level: store
    kind: registry
    responsibility: "One record per road entry version: the deep vetting that entry version received before anything counts as covered-by-road. Holds the independent verifier's verdict for each class the entry claims to retire (varied-path fixtures, constraint-enforced or not), the road-level regression results, the scope the vetting covered (APIs, configurations, call patterns), the security-relevant defaults of the frameworks and components the entry depends on as checked at that version (an insecure dependency default voids the claim it touches), and known limits. Vetting runs once per version because an entry is more stable than the business logic built on it; a new version, or a new version of a dependency whose defaults it relies on, starts unvetted and is re-vetted, and a leak found in use (F28) withdraws the record. Written only by the independent verifier and disposition review, so neither the road team nor producers can mark their own entry vetted. For each entry version the status it sends the secure-creation loop is current or not current, with no class outcomes and no reason for a status change, including a failed vetting or a withdrawal after a leak. It projects vetted scope and known limits as API and configuration identifiers and named pattern classes, never an input shape or sequence, test input, fixture content, expected outcome or bypass description. These limits also apply to what reaches the model provider through the coding agent's model route."
    role_class: evidence
    trust_zone: control
    owner: Evidence/findings product + independent verifier
    module: paved-road
    unpartitioned: "Assurance status per road entry version, with references to the regressions behind it."
