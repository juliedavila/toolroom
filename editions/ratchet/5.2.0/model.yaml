  - id: s6.hardening-service
    name: Hardening and regression service
    aliases: 
      - S6 · Hardening and regression
      - S6 boundary contract
      - Reviewed change + deployed retest
    system: S6
    level: container
    kind: service
    responsibility: "Receive an accepted scoped finding; produce reviewed ChangeRecord, actual-deployment correlation, independent retest disposition and RegressionSpec. For each validated finding, proposes a detection of the demonstrated path's observable behavior to the defensive side, which reviews and owns it. Once the fix-cap gate admits a finding, prepares its fix path with security and the owning engineer before it enters the owning team's queue: the reproducing test from the replay of the demonstrated path (or a reproduction through the running system where no build-level test can reproduce it), the drafted fix or the reason none is possible, and the regression test or repeated reproduction that becomes the owned gate, with its named owner. Records the security side's hours for each fix path. The drafted fix starts from the finding's fix brief, and from the disposition it takes only identifiers, statuses, enumerated fields and references. Security, the owning engineer and an agent co-create the correction and its component-local instance regression as one pull request. The instance test lives in the owning team's suite and the owning team owns it. A newly discovered variant enters as a new finding through intake, independent reproduction and disposition. Nobody quietly changes the team's pull request. The independent aggregate validation stays with security. Its proof conditions, chained paths, protected fixtures and expected outcomes never reach the fixing agent. A local instance test contains no such material. There is no separate variant probe set."
    role_class: producer
    trust_zone: reasoning
    owner: Domain engineering/release owner
  - id: s6.owner-change-connector
    name: Owner/change connector
    aliases: 
      - Owner / change record
      - Owners + reviewed changes
      - Change/retest/regression connector
    system: S6
    level: component
    parent: s6.hardening-service
    kind: service
    responsibility: "Route root cause to code/IAM/network/defense owner; draft candidate PR or policy change, with proof and safe rollback. The connector is the core's fix drafter, whether a person or an agent drafts the change through it: its only description of the weakness is the finding's fix brief (FixBrief), and from the disposition it takes only identifiers, statuses, enumerated fields and references, so no free text a producer or a model wrote reaches the draft. Security and the owning team co-create the fix path: a validated finding enters an owning team's queue only with a complete fix path (FixPath) co-created by security, the owning engineer and an agent, made of a reproducing test that fails on the current build, or a reproduction through the running system where no build-level test can reproduce the weakness; a drafted fix the owning team takes, edits or declines with a reason, or \"no draft possible\" with the reason recorded, which goes to the owning team's lead and the security risk owner; and an owned gate, the regression test or repeated reproduction the fix must pass, with its named owner. Before the fix path is prepared, the connector sends the validated finding to the fix-cap gate, and prepares the path only for a finding the gate admits; the complete path goes back through the gate for queue entry. An incomplete path waits with the security side; the wait is measured per owning team, and a finding still waiting past the profile's remediation window is reported to the program decision owner. The connector applies no cap and writes no refusal. While the fix-cap gate is unavailable, it prepares the fix path for, and sends straight to the owning team, only a validated finding whose disposition records a pass ground, a field disposition review writes and the connector cannot; it holds every other finding with the security side. When the gate returns, it hands the gate every finding it sent during the outage, with the pass ground it sent it on. Security, the owning engineer and an agent co-create the correction and its component-local instance regression as one pull request. The instance test lives in the owning team's suite and the owning team owns it. A newly discovered variant enters as a new finding through intake, independent reproduction and disposition. Nobody quietly changes the team's pull request. The independent aggregate validation stays with security. Its proof conditions, chained paths, protected fixtures and expected outcomes never reach the fixing agent. A local instance test contains no such material. There is no separate variant probe set."
    role_class: producer
    trust_zone: reasoning
    owner: Domain engineering/release owner
  - id: s6.release-state-correlator
    name: Release and state correlator
    aliases: 
      []
    system: S6
    level: component
    parent: s6.hardening-service
    kind: service
    responsibility: "Bind approved correction to actual artifact or effective policy revision in the stated deployment; expose missing joins. Writes the deployment record into closure as a machine record (commit, build, artifact digest, deployed workload or effective policy revision, environment); a missing join leaves closure open, it never asks a human to vouch for deployment. For a finding of kind infrastructure misconfiguration it judges the closure check: it reads the live configuration state of the named resources through the estate's own interfaces, with no model, compares it with the declared intent (the policy or configuration rule and its version), and records match, mismatch or unknown; only a match closes, and a merged or applied change to the infrastructure code alone never does. Records the SLSA build level of the provenance each deployment record rests on; a closure or escape attribution resting on provenance below Build Level 2 is labeled self-attested in every record and measure, because below that level the team that ships the fix also writes the record that says it shipped."
    role_class: evidence
    trust_zone: control
    owner: Security finding-quality owner (accepts technical closure; not the correcting team)
  - id: s6.retest-regression-planner
    name: Retest and regression planner
    aliases: 
      - Deployed-state retest
      - Deployed retest + regression
    system: S6
    level: component
    parent: s6.hardening-service
    kind: service
    responsibility: "Request S2/S3-approved retest with valid prerequisites; require intended defense and legitimate behavior, not incidental failure. For a constraint-enforced claim, include an adjacent-path hypothesis set and varied-path fixtures. Run each accepted regression in the cadence mode the organization chooses for it: periodic (with the existing assessment cycle, each run approved), scheduled (fixed schedule under a batch approval) or continuous (every relevant change under a standing permission). Propose a step up only when the trust gate holds: a run of clean replays with no false failures, no out-of-scope attempt, no harmful run or cleanup failure, and a stable target. Step down automatically on any of those events. For services the road conformance check passes, replace per-service regressions of retired classes with the road entry's road-level regression; reinstate them on escape-hatch use or a failed check. Every road-level replay runs under the normal S3 authorization envelope. Bounds the delivery tax: each service has a regression time budget in the dial register; a replay runs only when a change touches its declared dependencies, and replays run in parallel; regressions whose class reaches constraint-enforced closure or a vetted road entry are consolidated; stage time per service is reported as a trend against the budget. A kept test leaves the blocking path only by a recorded route and is never deleted. Demotion moves only routine runs: a test that has not failed within the organization's quiet period still runs, and still blocks, on every change that touches its declared dependencies; only its extra time-based runs move to the scheduled lane, which runs on the organization's lane interval, and a failure there still blocks the next deploy in its dependency scope. Quarantine: a test with false failures leaves the blocking path, keeps running, and counts as an open exception under the exception policy, within the organization's cap on how many and for how long; at expiry it is fixed, re-proved or retired. Retirement: proposed when a paved-road entry or a derived check covers the test's weakness class and that check is itself kept and passing; before the security risk owner may accept it, the covering check runs against this test's isolated reverted-fix copy under the normal authorization envelope and must fail there; it takes effect only when the security risk owner accepts it, and lapses back to active when the covering check fails or is withdrawn. Re-proof: on the organization's cadence each kept test, in either lane, runs against an isolated copy with its fix reverted under the normal authorization envelope and must fail; the purple team's AI may run it. A \"no longer fails\" result moves the test out of the blocking lane only after the verifier independently confirms the result; the test is then proposed for retirement or repair. A copy whose revert conflicts, or that no longer builds or starts, is reported not re-provable with the fix's age: never as no longer failing, and never a step toward retirement. While the organization leaves the quiet period unset, no run moves to the scheduled lane; while it leaves the quarantine limits unset, a quarantine lasts at most the exception ceiling and the count is uncapped but reported; while it leaves the re-proof cadence unset, the gap is reported and no cadence is assumed. Attack injection: plans each experiment that reintroduces a verified fix's weakness class, names the detection layer expected to catch it (workstation, pull request, pipeline, deployed test environment or production), writes its injection record, and submits every injection as an ActionSpec under the normal authorization envelope, with the restore that undoes it inside the same ActionSpec and an expiry at the service owner's time limit. At the pre-deploy layers the injected change is never merged or deployed: it runs without notice, ends when the layer catches it or passes it, and may repeat on the re-proof cadence. A pull request injection opens as a draft or on an isolated branch, carrying a required status check that fails while the injection is open, so the repository refuses any merge attempt, and it closes when its grant expires. A workstation injection runs in a harness that stamps its start and finish, never on a developer's own machine. At the pipeline layer the injection is the reverted-fix copy the re-proof runs. Routine re-proof injection runs count against the service's regression time budget and appear in its stage-time trend. Past deployment it plans an injection only into an environment the profile's injection section allows, under the notice mode that section declares, and none while the section is absent or holds a placeholder; the action control service refuses any other. In the trusted-agent mode the trusted agent can stop it at any point, and the stop goes straight to the action control service. A production injection runs only while the production-effects module is enabled, as attack injection named explicitly among the reversible effect classes its approved production profile lists, through the production cell. It also runs each class test of the secure-creation loop: a rule the policy-owning team turned from a proven class, run against the class's reproduced members at their revisions before the fix. It takes the rule and the members from the regression catalog, proposes the run as an ActionSpec like any retest, so it runs in an execution cell under the normal authorization envelope with its effects recorded, and returns the result to the catalog. The members' code and the rule's output never leave Ratchet's cells and catalog. This independent aggregate validation is the held-out layer. Its proof conditions and chained-path validations never reach a coding agent. A component-local instance test may be visible and pass while this layer finds a remaining path. That variant becomes a new finding through the normal loop and never silently changes a team pull request. There is no separate variant probe set."
    role_class: evidence
    trust_zone: control
    owner: Domain test team + CI/context owners
  - id: s6.change-closure-records
    name: Change and closure records
    aliases: 
      []
    system: S6
    level: store
    kind: store
    responsibility: "Review/deploy/retest references; separate technical closure, residual risk and risk acceptance. Technical closure has two states: path broken (the demonstrated chain fails) and constraint enforced (varied paths to the same objective also fail under a held-out check). A finding closes only through the closure its kind declares in the finding-kind registry: the kind's closure check, judged with no model by the part the kind names, records the expected outcome; the kind's kept gate is in the regression catalog; nothing the kind lists as never closing it is counted as closure; and two attributed human acceptances by distinct identities (review of the correction, retest outcome). For a path finding the check is the independent retest with a machine deployment record from the release-state correlator; no human signs for what the correlator proves. Every closure carries an environment label (staging, production or another declared environment) from phase 2, and a staging closure never reads as production risk reduction. A finding of kind exposed secret closes path broken only when the revocation check records the credential failed by its type's recipe, which takes the place of the machine deployment record, with the owning team's revocation and rotation and each derived session's end recorded through its fix path, the kept scan rule that blocks the secret's return in the regression catalog, the detection side's exposure-use review finding no unexplained use, and the same two acceptances; a type with no recipe closes on the owning team's attestation and the closure is labeled attested. Removing the secret from code, history, logs or tickets is recorded and never closes it. Each closure records its kind's recovery measure: time to revoke for an exposed secret, from detection to the credential failed."
    role_class: evidence
    trust_zone: control
    owner: Security finding-quality owner (accepts technical closure; not the correcting team)
    decides: closure
    partitioned_by: 
      - jurisdiction
      - line_of_business
  - id: s6.regression-catalog
    name: Reviewed regression catalog
    aliases: 
      - Regression + drift triggers
      - Durable regression
    system: S6
    level: store
    kind: registry
    responsibility: "Versioned fixture/invariant/scope dependencies; material changes invalidate assurance and trigger scoped replays. Holds two scopes of regression: per-service regressions and road-level regressions that test a paved-road entry once for every service proven to use it. Holds each kept test's lane for its time-based runs and its status (blocking or scheduled; active, quarantined, retired or set aside pending repair), its last failure and last re-proof, and the record of every lane or status change with who decided it. A \"no longer fails\" re-proof result changes the test's status only with the verifier's independent confirmation; a not re-provable result changes nothing and is recorded with the fix's age. A retirement is recorded only with the security risk owner's acceptance, the covering check's own kept status, and the covering check's failing result against this test's reverted-fix copy; a retired test keeps its record and code so it can be reinstated. Holds held-dependency tests beside the regressions: each runs a held finding's path with the observed control in place against the weakness's proof condition, names its owner (the team that owns the control) and its re-test interval, and is run by the retest planner at least once per interval under the normal authorization envelope. It sends each held-dependency test's last run and verdict to disposition review, so a test missing, unowned or past its interval makes its held finding read unresolved and a run that meets the proof condition converts the finding. It reports, per control, how many held findings the control holds and how many of their tests have failed, so a control that holds many weaknesses is visible as the most valuable test to keep running and the share of credited controls that fail is measured. For the secure-creation loop it derives each derived check from a static or in-process kept test, and the check's pattern is general to the weakness class, never the kept test's input, fixtures or expected behavior. It keeps the full result of each class test, a policy-owning team's rule run against the class's reproduced members at their revisions before the fix, and sends agent-reachable parts only pass or fail per rule version under ClassTestCount. It sends per-class counts directly to the policy-owning team: people, never an agent under ClassTestTotals, never through the check suite, measurement plane or model route. The full class-test result and all member details stay in the catalog. It hands each class test to the retest planner, which runs it in an execution cell under the normal authorization envelope as it runs a kept test, and receives the result back; the members' code and the rule's output never leave Ratchet. It also counts, per derived check, its kept test's replay failures on changes deployed since the check's version was issued, from the replay verdicts it receives, and sends the loop only that count, never a replay result. Security owns the protected aggregate validation and the class-level paved roads and guardrails. The class-level checks remain visible to agents only as derived checks. The catalog sends metadata for every protected kept test to the kept-test mirror. The mirror cannot edit a test, its verdict, lane, retirement or owner. Team-owned component-local tests are kept in the team suite and mirrored separately."
