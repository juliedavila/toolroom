    responsibility: "Minimize/classify payload; enforce legal-entity and task/data eligibility before routing; block unauthorized export. Eligibility is the first decision: which sources and data classes a task may send to which route, from the organization's data classification and the route's eligibility. Content detection (secrets, personal data) is a second layer behind it, because detectors recognize those far better than source code, designs or business logic. Load-bearing: for every producer route that holds untrusted content, non-public data and an outbound path, this gate is one of the controls on the exfiltration leg, beside the quarantine that keeps outsider text from producers and the route registry that admits only eligible endpoints; its payload scoping is tested on every change (F39) and no producer reaches a model endpoint around it. A model-boundary control: it sits inline on the model path but is deployed and administered in the control zone, apart from the gateway it guards; its decision is deterministic (no model call), its policy arrives only through the policy release pipeline, and it sends nothing into the authorization plane. Computes each model request's outsider label set as the union of the labels on the context items the run was given and on everything the run has received since (earlier responses, and the observations its receipts record, a target's response counting as outsider text), and records it under the attempt id, so the response and everything the run produces inherit it. A label set a producer supplies is ignored and logged."
    role_class: control
    trust_zone: control
    owner: Control-plane operator (assurance unit); data-risk and security owners set gate policy
