    system: S4
    level: store
    kind: registry
    responsibility: "Versioned record of every model route: provider, model and version, hosting (self-hosted or hosted), output kind (text or typed), the data classes it may receive, its rung on the degradation ladder and its last drill date. A typed route also lists the decision types it is qualified for, each with the reliability curve and calibration error from its qualification run; it is eligible only for those types. A self-hosted route is pinned to the digest of the weights released for it. The registry pins a released digest only when the release attestation that comes with it verifies, as the local enforcement point verifies software and images before they start: the release signature against a current key reference whose purpose is release that key management sends to the registry, and, under that signature, provenance naming the organization's build platform at SLSA Build Level 3, an attested digest equal to the released one, and an artifact name and version equal to the route's model and version. A release that fails pins nothing: the registry records the refusal with the check that failed, sends it to protected audit, and the route keeps its last verified version. A pinned digest is a new route version that stays unqualified, and serves nothing, until promotion review requalifies it, and a digest mismatch the gateway reports marks the route unqualified. Route entries change only through promotion review, a verified release and a digest mismatch the gateway reports."
