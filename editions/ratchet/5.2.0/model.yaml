trust_zones: 
  - id: reasoning
    name: Reasoning and workflow boundary
    description: S1/S2 workers + S4 gateway. No estate secrets; scoped context/artifacts. Target content remains untrusted.
  - id: control
    name: Authorization and proof boundary
    description: S3 policy/lease authority + S5 oracle/evidence writes + S7 acceptance. Separate permissions and accountable administration.
  - id: execution
    name: Bounded execution cells
    description: "Isolated source/build, representative staging and approved production cells; no worker-to-target bypass. (View E, C0 Execution and integration)"
  - id: evaluation
    name: Protected evaluation records
    description: "S7 frozen cohorts, held-out partitions, evaluation artifacts and qualification records. Producers cannot read held-out partitions or write records; no execution authority (replays go through S3)."
  - id: shared:existing
    name: Existing enterprise operations
    description: CI/releases retain change control; SOC preserves independent observations. Model provider egress occurs only through S4 eligible routes.
  - id: shared:third-party
    name: Third-party inference boundary
    description: Conditional access to contracted hosted frontier endpoints.
