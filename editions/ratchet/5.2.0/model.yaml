  - id: s5.failure-class-registry
    name: Failure-class registry
    aliases: 
      - Failure classes
      - Recurring weakness classes
    system: S5
    level: store
    kind: registry
    responsibility: "Groups accepted findings into failure classes: the same mistake across services (first-party patterns) or the same weakness in a shared third-party component. A class exists only when at least one finding an independent verifier reproduced sits under it; producers may propose a grouping, but only disposition review accepts one, and a model's judgment never creates or merges a class. Each class records its member findings, the services and components it spans, the consequence its members reach (by reference to the path-impact graph), the road entries that claim to retire it and the closure state of each claim (path broken or constraint enforced). Lives in S5 rather than S6 because a class claim steers road investment and test consolidation, so it must be accepted evidence that producers and the road team cannot write. For the secure-creation loop it sends each class's existence, definition and fix rule while any member finding is open, withholding services and components spanned and highest consequence tier until every member's finding is closed. Per-class member counts go only to the policy-owning team: people, never an agent, never to an agent-reachable part or the model route, even after all members close. Its definition and fix rule name no service, component, path or file of the organization's own, and a third-party class names the component without its versions until a fix exists. A class that gains an open member again sends its next version without spans and consequence tier. The model provider is a reader through the coding agent's model route, so the projection's limits apply to it too. A class's projection version increases when its definition, fix rule, fix availability, road claims, derived-check references, weakness identifiers or disclosed spans or consequence tier change, or when it enters or leaves the all-members-closed state; membership changes while already open do not by themselves increase that version."
    role_class: evidence
    trust_zone: control
    owner: Evidence/findings product + security/risk owners
    module: paved-road
    unpartitioned: "Failure classes span services by design; each class refers to its findings by id, and their evidence stays in the partitioned ledger and evidence store."
  - id: s6.paved-road-catalog
