    system: S3
    level: component
    parent: s3.action-control-service
    kind: store
    responsibility: "Correlate intent, denial, grant, action, outcome and cleanup; audit failure blocks controlled high-risk effects. Append-only and tamper-evident (hash chain) with WORM retention whose custody sits with the independent assurance owner: control-plane operators can read it and can never alter or delete it. Records every administrative session and command from the privileged access broker before the command runs, every key event, and every weights release the route registry refuses, with the check that failed."
    role_class: evidence
    trust_zone: control
    owner: Policy/IAM + execution-cell/SRE team
    partitioned_by: 
      - jurisdiction
      - line_of_business
  - id: s3.credential-lease-broker
    name: Credential / lease broker
    aliases: 
      []
    system: S3
    level: component
    parent: s3.action-control-service
    kind: service
    responsibility: "Scoped, short-lived test identity; secrets delivered only to runner. For an exposed secret's status probe it releases the sealed old credential to the runner for that one probe series only, and asks key management to destroy it after the series' last attempt. With each injection grant it issues one restore credential to the action control service: a lease scoped to the restore's target and effect, sealed to the cell that applies the injection and valid until the grant's expiry plus the cell's clock-skew margin, so the restore never asks it for a lease at run time."
    role_class: control
    trust_zone: control
    owner: Policy/IAM + execution-cell/SRE team
  - id: s3.local-enforcement-point
    name: Local enforcement point
    aliases: 
      []
    system: S3
    level: component
    parent: s3.bounded-runner
    kind: gateway
    responsibility: "Verify/consume applicable approvals immediately before effect; enforce expiry, destination, time, health and replay rules. For an attack injection, holds the signed restore grant that came with the injection grant, with the restore credential sealed inside it, verified offline against cached key references, and refuses to apply an injection whose restore grant it does not hold or cannot verify. A dead-man timer on the cell's trusted time source consumes the restore grant and has the runner run the restore under the restore credential at the grant's expiry, with no control-plane call and no lease request, or earlier when the action control service relays a stop. Running the restore is idempotent, so a restore the service owner's rollback already made leaves nothing to undo. Each restore is written to the local audit buffer before it runs and reported to the action control service afterwards. At deploy, starts a runner, cell image or Ratchet software release only when its release attestation verifies: signature against a current key reference whose purpose is release, SLSA Build Level 3 provenance from the organization's build platform, and the running digest equal to the attested one; anything else is refused, recorded and alerted, and the cell keeps its last verified release (F102). Each release attestation carries a monotonically increasing release sequence number covered by the release signature. Release signatures and rollback authorizations verify only against a current key reference whose purpose is release. For release admission a cell is a stable logical execution destination, independent of its disposable image or enforcement process. Withdrawal is per cell in this edition: a rolled-away release is refused on the stable logical cell that rolled back; another cell can still admit it. Fleet withdrawal needs a separate protocol in the next minor edition. The local enforcement point keeps that cell's highest verified release sequence, last consumed rollback number and sticky refusal ranges in durable storage outside the disposable cell; all survive restart, rebuild and restore. A new or rebuilt cell takes its first mark and rollback state from the release pipeline through authenticated provisioning, never from the first arriving release or an empty local store; unavailable or stale initialization refuses all starts. A rollback authorization is part of the release attestation and is signed by key management for the pipeline with purpose release; it names the cell, its highest verified sequence, the running sequence being rolled away from, the older target sequence and digest, a per-cell rollback number and the highest release sequence issued before this rollback. The enforcement point requires the target to be older than the running release and the rollback number to exceed the last consumed number, and atomically persists its consumption and the new refusal range before starting the target. A rollback never lowers the high-water mark and permanently refuses every previously issued release from its rolled-away-from sequence through its signed issued-through sequence, even with another rollback authorization. These refusal ranges accumulate; reusing that code at or above a rolled-away-from sequence requires the pipeline to issue a fresh release with a new sequence beyond the applicable refusal ranges and the high-water mark. Outside these ranges an older release still requires a matching unused rollback authorization; a missing, invalid, reused or non-increasing authorization is refused before any start. It refuses, records and alerts on every failed admission, including reused authorizations and sticky-range replays. Its protected audit event names the cell, prior and resulting release sequences and rollback number, so every older start matches exactly one rollback event on the pipeline's own release record."
    role_class: control
    trust_zone: execution
    owner: Policy/IAM + execution-cell/SRE team
    applies_injection: true
  - id: s3.bounded-runner
    name: Bounded runner deployments
    aliases: 
      - Execution cell and secret lease
      - Execution cell
      - Bounded execution cells
    system: S3
    level: container
    kind: runner
    responsibility: S3 local enforcement + source/staging/production profiles; scoped credential leases and outcome/cleanup receipts.
    role_class: control
    trust_zone: execution
    owner: Policy/IAM + execution-cell/SRE team
  - id: s3.source-build-cell
    name: Isolated source/build cell
    aliases: 
      - Source / proof cell
    system: S3
    level: component
    parent: s3.bounded-runner
