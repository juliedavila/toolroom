finding_kinds: 
  - id: path
    name: Demonstrated path
    description: A weakness demonstrated through the running system along a path the finding ledger records. A finding with no kind is a path finding. A path finding whose reproduction a control stopped short of the proof condition is held by that control until its held-dependency test shows the control no longer stops the path.
    closure_check: 
      check_type: independent retest of the demonstrated path in the stated environment
      judged_by: s3.replay-verdict
      expected_outcome: "the demonstrated chain fails (path broken), or varied paths to the same objective also fail under a held-out check (constraint enforced), with the machine deployment record of the fix"
    kept_gate: "the kept regression test for the path in the regression catalog, blocking deploys that touch its declared dependencies"
    recovery_measure: 
      name: time to remediate
      definition: "from the reproduced finding to a fix verified in the running system, median and spread per weakness class and owning team; an escape of this kind reports it as its time to recover"
    never_closes: 
      - a merged change or a closed ticket without the independent retest
      - a human signature in place of the machine deployment record
      - a staging closure read as production risk reduction
      - "a held disposition, since a control that stops the path holds the weakness and leaves it in place"
      - "a control credited from a ticket, a diagram or a model's reasoning, never observed in a reproduction"
    held: 
      kept_test: "a held-dependency test in the regression catalog that runs the path with the observed control in place against the weakness's proof condition, with an owner (the team that owns the control) and a re-test interval"
      judged_by: s3.replay-verdict
      converts_when: "the test's run meets the proof condition, so the control no longer stops the path; the finding becomes confirmed with the reach that run demonstrated and the tier recorded at hold, with no new triage"
  - id: exposed-secret
    name: Exposed secret
    description: "A live credential found in code, history, logs, tickets or another store. The value becomes a fingerprint at intake; the owning team revokes and rotates the credential through its fix path."
    closure_check: 
      check_type: "revocation check by the credential type's verification recipe (status by identifier first, else the announced status probe repeated over the issuer's propagation time)"
      judged_by: s3.replay-verdict
      expected_outcome: "the issuer reports the credential revoked, or every probe attempt of the series is refused with a code the recipe maps to revoked or invalid, with every derived session ended and an exposure-use review finding no unexplained use, and every stretch of the window no issuer log covers recorded as not verifiable with its dates and accepted by the security risk owner, named and dated; a type with no recipe closes on the owning team's attestation, labeled attested"
    kept_gate: "the scan rule that blocks the secret's return, matching its fingerprint, in the regression catalog"
    recovery_measure: 
      name: time to revoke
      definition: "from detection to the credential failed (revoked status, a fully refused probe series, its recorded expiry, or the attestation), running while it still authenticates; an escape of this kind reports it as its time to recover"
    never_closes: 
      - "removing the secret from code, history, logs or tickets"
      - "one refused attempt, or a refusal with a code the recipe does not map to revoked or invalid"
      - "unexplained use during the exposure window, which opens an incident"
      - a derived session or token still live
      - "a stretch of the exposure window no issuer log covers, written as no use, or left without the security risk owner's named, dated acceptance"
  - id: infra-misconfiguration
    name: Infrastructure misconfiguration
    description: "Live infrastructure configuration that does not match its declared intent (an identity policy, a network rule, a storage setting, a cluster setting), found with or without a demonstrated path. A worked example: an organization declares its own kinds the same way."
    closure_check: 
      check_type: "model-free read of the live configuration state through the estate's own interfaces"
      judged_by: s6.release-state-correlator
      expected_outcome: the live configuration matches the declared intent (the policy or configuration rule and its version)
    kept_gate: "a policy check on the infrastructure code that blocks the change returning, or drift detection on the live state, in the regression catalog with its owner"
    recovery_measure: 
      name: time to conform
      definition: "from detection to the first read of the live configuration that matches the declared intent, running until one does; an escape of this kind reports it as its time to recover"
    never_closes: 
      - a closed ticket
      - a merged or applied change to the infrastructure code without a read of the live state
      - a read that returns unknown
sequence: 
  - step: 1
    from: s2.producer-adapters
    to: s3.action-broker
    action: "Receive typed proposal: S2 worker → S3 broker. No embedded credential or authority."
  - step: 2
    from: s3.action-broker
    to: s3.policy-decision-point
    action: "Normalize and recheck: actual destination, current target, prerequisites, policy and approval."
  - step: 3
    from: s3.policy-decision-point
    to: s3.grant-approval-store
    action: "Persist decision and grant: denial or exact expiring binding; mandatory audit before effect."
  - step: 4
    from: s3.policy-decision-point
    to: s3.local-enforcement-point
    action: "Enforce at the runner: atomically consume applicable approval; check identity, limits and health. Only the authorized request proceeds."
  - step: 5
    from: s3.local-enforcement-point
    to: s3.bounded-runner
    action: "Execute within the cell: scoped secret lease; observed outcome; cleanup, stop and incident rules."
  - step: 6
    from: s3.bounded-runner
    to: s5.independent-verifier
    action: "Independently verify: receipt + protected oracle + telemetry; confirm / reject / unresolved."
