    description: "A known-bad agent-written change the sampling service opens on a sandbox branch for the reviewer-drift baseline, never on the protected branch: the branch, the revision and the diff, and nothing else. It carries no fixture binding, no original or patched outcome and no test result, which stay in the sampling service's own frame, so the engineering system and the reviewer never receive what the change was built to show. Which changes were seeded stays in that frame. Drawn as it is, a seeded change does not pick up the triage labels, AI review comments, routing and provenance stamp a real change collects on its way through the protected branch, so a careful reviewer may tell it from a real one and the catch rate may read higher than the truth."
