      name: "Authorization boundary"
      description: "Policy and approvals. No model calls."
  elements:
    - id: "s1.worker"
      name: "Workflow worker"
      module: "toy-module"
      system: "S1"
      level: "component"
      kind: "service"
      responsibility: "Drafts proposed actions."
      role_class: "producer"
      trust_zone: "reasoning"
      owner: "Producer platform team"
    - id: "s3.approval-console"
      name: "Approval console"
      system: "S3"
      level: "component"
      kind: "service"
      responsibility: "Approvers approve or deny one exact action."
      role_class: "control"
