      level: "component"
      kind: "service"
      responsibility: "Decides whether a proposed action is allowed."
      role_class: "control"
      trust_zone: "control"
      owner: "Control plane team"
    - id: "people.approver"
      name: "Approver"
      system: "shared:PEOPLE"
      level: "actor"
      kind: "person"
      responsibility: "Approves or denies proposed actions."
      role_class: "human"
      trust_zone: null
      owner: null
  relationships:
    - id: "r1"
      from: "s1.worker"
      to: "s3.policy-engine"
      label: "Proposed action"
      carries:
        - "ActionSpec"
      kind: "proposal"
      optional: false
    - id: "r2"
      from: "people.approver"
      to: "s3.approval-console"
      label: "Approve or deny"
      carries: []
      kind: "control"
      optional: false
    - id: "r3"
      from: "s3.approval-console"
      to: "s3.policy-engine"
      label: "Approval decision"
      carries: []
      kind: "control"
      optional: false
  contracts:
    - name: "ActionSpec"
      description: "One proposed action: target, effect and requester."
      produced_by:
        - "s1.worker"
      consumed_by:
        - "s3.policy-engine"
  views:
    - id: "B"
      title: "Proposals reach the policy engine, and approvals come from people"
      level: "component"
      elements:
        - "s1.worker"
        - "s3.approval-console"
        - "s3.policy-engine"
        - "people.approver"
      relationships:
        - "r1"
        - "r2"
        - "r3"
  seams:
