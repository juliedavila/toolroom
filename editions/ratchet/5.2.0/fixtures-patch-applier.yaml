  - name: "fixture-pa-expects.yaml"
    description: "A modify op may declare what it replaces: expects holds, for each field the set names, the first 12 hex digits of the SHA-256 of the field's current value as canonical JSON. A match applies, any mismatch refuses the patch naming the target, the field and both hashes, and an op without expects behaves as before (PA-22). Hashes were computed by hand with shasum over the canonical JSON text."
    cases:
      - case: "every hash matches: an element, a relationship and a contract apply"
        files:
          model.yaml: *base_model
          patches/O01-expects-match.md: |
            # O01: Toy change for a fixture

