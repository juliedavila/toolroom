            The organization needs this change to fit its own approval practice.

            ## Ops
            ```yaml
            ops:
              - op: modify_element
                id: s3.approval-console
                set: { responsibility: "Approvers approve or deny one exact action, and see its consequence tier." }
                expects: { responsibility: "b6ac893bc4c7" }
              - op: modify_relationship
                id: r1
                set: { optional: true }
                expects: { optional: "fcbcf165908d" }
              - op: modify_contract
                name: ActionSpec
                set: { description: "One proposed action: target, effect, requester and consequence tier." }
                expects: { description: "217780ac3d2f" }
            ```

            ## Risk and threat-model delta
            No new path reaches an authorization decision.

            ## Feasibility note
            One team builds it within one phase.

            ## Exceptions needed
            None.

            ## Status
            accepted by the security risk owner on 2030-01-15

        expect:
          outcome: "ok"
          exit: 0
          errors: []
          applied: ["O01"]
          model_written: true
          model:
            elements:
              s3.approval-console: { responsibility: "Approvers approve or deny one exact action, and see its consequence tier.", patch_op: "modified", patches: ["O01"] }
            relationships:
              r1: { optional: true }
            contracts:
