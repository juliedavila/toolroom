      patches/O01-scenario.md: "# O01: Declare an organization test\n\n## Why\nExercise the declared failure behavior.\n\n## Ops\n\n```yaml\nops: \n  - op: add_failure_scenario\n    scenario: \n      id: org.hostile-response\n      title: Hostile model response\n      elements: \n        - s1.worker\n        - s3.policy-engine\n      trigger: A hostile response reaches the gate.\n      required_behavior: The gate refuses it and no action is authorized.\n      invariant: I1\n      module: unknown-module\n      detection: The refusal is recorded.\n      runbook: RB-org.hostile-response\n      test: \n        kind: pipeline\n        steps: Send hostile response text and assert refusal.\n```\n\n## Risk and threat-model delta\nThe compiled scenario traces the named parts.\n\n## Feasibility note\nRun the declared pipeline test.\n\n## Exceptions needed\nNone.\n\n## Status\naccepted by Security risk owner on 2030-01-15\n"
