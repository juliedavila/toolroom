    files:
      model.yaml: *base_model
      patches/O01-second-approver.md: |
        # O01: A second approver signs production-effects runs

        ## Why
        The organization needs this change to fit its own approval practice.

        ## Ops
        ```yaml
        ops:
          - op: add_element
            element: { id: org.second-approver, name: Second approver, system: shared:PEOPLE, level: actor, kind: person, responsibility: "Signs every production-effects run with the first approver.", role_class: human, trust_zone: null, owner: null }
          - op: add_relationship
            relationship: { id: o01-r1, from: org.second-approver, to: s3.approval-console, label: "Second approval", carries: [], kind: control, optional: false }
          - op: add_view
            view: { id: O01, title: "Two approvers sign production-effects runs", level: component, elements: [org.second-approver, s3.approval-console], relationships: [o01-r1] }
        ```

        ## Risk and threat-model delta
        No new path reaches an authorization decision.

        ## Feasibility note
        One team builds it within one phase.

        ## Exceptions needed
        None.

        ## Status
        accepted by the security risk owner on 2030-01-15
    expect:
      outcome: "ok"
      exit: 0
      errors: []
      warnings: []
      applied:
        - "O01"
      skipped: []
      model_written: true
      model:
        elements:
