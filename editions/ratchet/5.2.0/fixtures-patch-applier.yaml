# Acceptance fixtures for the patch applier (specification: spec-patch-applier.md).
# Each fixture lists its input files by path. "model.yaml" is the toy base model below, so the
# fixtures do not depend on the shipped model. Patch files sit under "patches/".
# expect.errors and expect.warnings list every message the run must produce: code, file, op index.
# expect.model lists facts the output model must show; keys not listed are not checked.
# element_ids_include / _exclude, relationship_ids_exclude and changes_exclude are membership checks.
# A fixture with "cases" runs each case separately. A fixture with "runs: 2" runs twice into two outputs.
# A file given as { shipped: <name> } is this edition's own file of that name (beside these fixtures), byte for byte.
# options.layer_out: true compiles the design layer from the layer files beside model.yaml into an output folder;
# options.overlay names the organization's own overlay file, which replaces overlay-aws.yaml in the compiled layer.
# options.preview_withdraw lists patches to leave out as if withdrawn. A version_record file is the organization's
# version.yaml, read for its overlay record.
# expect.outcome is "ok" for exit 0, else "error". A run uses version.yaml at the fixture's top as the version record
# path unless options.version_record names another.
# expect.changes names exactly the patches with a changes entry; within one, a list group must equal the reported
# list and a mapping group each listed kind. expect.error_text_names are strings each found anywhere in some error's
# text. expect.layer lists entries the compiled layer must hold, per file, under elements, contracts, account_classes,
# zone_accounts (by key), scenarios (by id) or critical_paths (by path id under quality.yaml critical_paths.paths):
# null means absent, a list is the exact entry, a mapping lists fields the entry must equal. layer_files names every
# compiled file; layer_byte_identical means each compiled file equals its input; input_layer_unchanged means the input
# layer files are untouched; retired_scenarios is the report's retired.scenarios; edition_is_shipped means the report
# and the output meta name the input model's top-level edition. report_overlay is the report's overlay (file and
# found_by); preview_withdrawn is the report's list of patches left out; error_text_tokens are strings that must
# each appear in some error's text as a whole token, the wording around them being free. An unknown expect key is a
# mismatch, never ignored.
# Every expected result was written from the specification and is reproduced by our reference implementation.

base_model: &base_model
  meta:
    version: "2.1.2"
  systems:
    - id: "S1"
      name: "Workflow workers"
    - id: "S3"
      name: "Action control"
    - id: "shared:PEOPLE"
      name: "People"
  trust_zones:
    - id: "reasoning"
      name: "Reasoning boundary"
      description: "Workers that call models. No estate secrets."
    - id: "control"
      name: "Authorization boundary"
      description: "Policy and approvals. No model calls."
  elements:
    - id: "s1.worker"
      name: "Workflow worker"
      system: "S1"
      level: "component"
      kind: "service"
      responsibility: "Drafts proposed actions."
      role_class: "producer"
      trust_zone: "reasoning"
      owner: "Producer platform team"
    - id: "s3.approval-console"
      name: "Approval console"
      system: "S3"
      level: "component"
      kind: "service"
      responsibility: "Approvers approve or deny one exact action."
      role_class: "control"
      trust_zone: "control"
      owner: "Control plane team"
    - id: "s3.policy-engine"
      name: "Policy engine"
      system: "S3"
      level: "component"
      kind: "service"
      responsibility: "Decides whether a proposed action is allowed."
      role_class: "control"
      trust_zone: "control"
      owner: "Control plane team"
    - id: "people.approver"
      name: "Approver"
      system: "shared:PEOPLE"
      level: "actor"
      kind: "person"
      responsibility: "Approves or denies proposed actions."
      role_class: "human"
      trust_zone: null
      owner: null
  relationships:
    - id: "r1"
      from: "s1.worker"
      to: "s3.policy-engine"
      label: "Proposed action"
      carries:
        - "ActionSpec"
      kind: "proposal"
      optional: false
    - id: "r2"
      from: "people.approver"
      to: "s3.approval-console"
      label: "Approve or deny"
      carries: []
      kind: "control"
      optional: false
    - id: "r3"
      from: "s3.approval-console"
      to: "s3.policy-engine"
      label: "Approval decision"
      carries: []
      kind: "control"
      optional: false
  contracts:
    - name: "ActionSpec"
      description: "One proposed action: target, effect and requester."
      produced_by:
        - "s1.worker"
      consumed_by:
        - "s3.policy-engine"
  views:
    - id: "B"
      title: "Proposals reach the policy engine, and approvals come from people"
      level: "component"
      elements:
        - "s1.worker"
        - "s3.approval-console"
        - "s3.policy-engine"
        - "people.approver"
      relationships:
        - "r1"
        - "r2"
        - "r3"

# The toy design layer for the base model: the four layer files an applier compiles when it is given an output layer
# directory. Fixtures that compile a layer list them beside model.yaml.
base_realization: &base_realization
  version: 1
  planes:
    orchestration: "Requests, durable workflow and producers."
    control: "Exact-action authorization and approvals."
    shared:integration: "Adapters to the organization's systems and roles."
    evidence: "Intake, verification and evidence stores."
  elements:
    s1.worker: { plane: "orchestration", class: "Workflow worker service", examples: ["Temporal worker"], swap_point: false, existing_tool_default: false }
    s3.approval-console: { plane: "control", class: "Approval console", examples: [], swap_point: false, existing_tool_default: false }
    s3.policy-engine: { plane: "control", class: "Policy decision service", examples: ["Open Policy Agent"], swap_point: true, swap_kind: "requalify", existing_tool_default: false }
    people.approver: { plane: "shared:integration", class: "Identity-provider role", examples: [], swap_point: false, existing_tool_default: true }

base_quality: &base_quality
  version: 1
  failure_modes:
    fail-closed: "The request is denied."
    queue-and-retry: "Work waits durably and resumes."
  tiers:
    T0: { name: "Control safety", failure_mode: "fail-closed" }
    T1: { name: "Evidence", failure_mode: "queue-and-retry" }
  elements:
    s1.worker: ["T1", "queue-and-retry", "durable tasks"]
    s3.approval-console: ["T0", "fail-closed", "no approval, no action"]
    s3.policy-engine: ["T0", "fail-closed", "deny when unavailable"]
  contracts:
    ActionSpec: ["at-least-once", "idempotency key = action id"]

base_overlay: &base_overlay
  provider: "aws"
  version: 1
  account_classes:
    control: "Control-zone parts."
    reasoning: "Workers that call models."
    identity: "The organization's identity source."
  zone_accounts:
    control: ["control"]
    reasoning: ["reasoning"]
  elements:
    s1.worker: { services: ["ECS on Fargate"], fit: "managed-open", account: "reasoning", portability: "open" }
    s3.approval-console: { services: ["AWS Lambda"], fit: "managed", account: "control", portability: "proprietary", keeps: "Approvals are recorded by the organization." }
    s3.policy-engine: { services: ["Amazon Verified Permissions"], fit: "managed", account: "control", portability: "open", keeps: "Policies are signed by the organization." }
    people.approver: { services: ["IAM Identity Center permission set"], fit: "existing", account: "identity", portability: "open" }

base_failures: &base_failures
  version: 1
  scenarios:
    - id: "F01"
      title: "Workflow worker down"
      elements: ["s1.worker"]
      runbook: "RB-F01"
    - id: "F02"
      title: "Policy engine unreachable"
      elements: ["s3.policy-engine", "s1.worker"]
      runbook: "RB-F02"

# An organization's own overlay in the shipped overlay's shape, for an on-premises setup (its own account classes).
org_overlay: &org_overlay
  provider: "onprem"
  version: 1
  account_classes:
    control-enclave: "Control network enclave, administered only by the control-plane operator."
    evidence-enclave: "Evidence network enclave."
    worker-cluster: "The organization's worker cluster."
    identity: "The organization's directory."
  zone_accounts:
    control: ["control-enclave", "evidence-enclave"]
    reasoning: ["worker-cluster"]
  elements:
    s1.worker: { services: ["worker pods on the organization's cluster"], fit: "self-run", account: "worker-cluster", portability: "open" }
    s3.approval-console: { services: ["approval service on the organization's cluster"], fit: "self-run", account: "control-enclave", portability: "open", keeps: "Approvals are recorded by the organization." }
    s3.policy-engine: { services: ["Open Policy Agent"], fit: "self-run", account: "control-enclave", portability: "open", keeps: "Policies are signed by the organization." }
    people.approver: { services: ["directory group"], fit: "existing", account: "identity", portability: "open" }

# The same overlay as text, for fixtures that record its sha256: a hash is over bytes, so the file is written exactly as
# given here, never re-serialized.
org_overlay_text: &org_overlay_text |
  # The organization's own overlay, recorded as its baseline in version.yaml.
  provider: onprem
  version: 1
  account_classes:
    control-enclave: "Control network enclave, administered only by the control-plane operator."
    evidence-enclave: "Evidence network enclave."
    worker-cluster: "The organization's worker cluster."
    identity: "The organization's directory."
  zone_accounts:
    control: [control-enclave, evidence-enclave]
    reasoning: [worker-cluster]
  elements:
    s1.worker: { services: ["worker pods on the organization's cluster"], fit: self-run, account: worker-cluster, portability: open }
    s3.approval-console: { services: ["approval service on the organization's cluster"], fit: self-run, account: control-enclave, portability: open, keeps: "Approvals are recorded by the organization." }
    s3.policy-engine: { services: ["Open Policy Agent"], fit: self-run, account: control-enclave, portability: open, keeps: "Policies are signed by the organization." }
    people.approver: { services: ["directory group"], fit: existing, account: identity, portability: open }

