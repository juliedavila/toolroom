  - name: fixture-pa-contract-pending-content-refused
    missing_owner_identities: true
    acceptance:
      - owner: Sender owner
        accepted: true
      - owner: Receiver owner
        accepted: true
    ops: [{op: modify_contract, name: 'shared:Projection', set: {description: Changed projection} }]
    error: shared-acceptance-required

  - name: fixture-pa-contract-initial-basis
    missing_owner_identities: true
    ops:
      - op: modify_contract
        name: shared:Projection
        set:
          owners:
            &owners
            - side: ratchet:sender
              role: Sender owner
              identity: Sending team
              basis: confirmed
            - side: jig:receiver
              role: Receiver owner
              identity: Receiving team
              basis: provisional
    acceptance:
      &acceptance
      - owner: Sending team
        accepted: true
      - owner: Receiving team
        accepted: true
    bound_contract_owners:
      *owners
  - name: fixture-pa-contract-missing-basis
    missing_owner_identities: true
    ops:
      - op: modify_contract
        name: shared:Projection
        set:
          owners:
            - side: ratchet:sender
              role: Sender owner
              identity: Sending team
            - side: jig:receiver
              role: Receiver owner
              identity: Receiving team
    acceptance:
      *acceptance
    error: shared-acceptance-required

  # Edition 5.2.0 (MC-114, PA-31): an identity names a person or team. A row's shipped role copied into identity
  # (compared trimmed, in any case) is no identity: the binding that writes it is refused, so acceptance under the role
  # text can never authorize a later content change, and a role copy already recorded counts as pending.
  - name: fixture-pa-claim-role-copy-refused
    claim_owners:
      - side: ratchet:sender
        role: Sender owner
        identity: null
      - side: jig:receiver
        role: Receiver owner
        identity: null
    ops:
      - op: bind_claim_owners
        claim: shared:SH-probe
        bindings:
          - side: ratchet:sender
            role: Sender owner
            identity: Sender owner
            basis: confirmed
          - side: jig:receiver
            role: Receiver owner
            identity: "  receiver OWNER "
            basis: confirmed
    acceptance:
      - owner: Sender owner
        accepted: true
      - owner: "  receiver OWNER "
        accepted: true
    error: shared-acceptance-required
  - name: fixture-pa-contract-role-copy-refused
    missing_owner_identities: true
    ops:
      - op: modify_contract
        name: shared:Projection
        set:
          owners:
            - side: ratchet:sender
              role: Sender owner
              identity: Sender owner
              basis: confirmed
            - side: jig:receiver
              role: Receiver owner
              identity: Receiver owner
              basis: confirmed
    acceptance:
      - owner: Sender owner
        accepted: true
      - owner: Receiver owner
        accepted: true
    error: shared-acceptance-required
  - name: fixture-pa-contract-role-copy-content-refused
    role_copied_identities: true
    acceptance:
      - owner: Sender owner
        accepted: true
      - owner: Receiver owner
        accepted: true
    ops: [{op: modify_contract, name: 'shared:Projection', set: {description: Changed projection} }]
    error: shared-acceptance-required
  - name: fixture-pa-claim-real-identity-binds
    claim_owners:
      - side: ratchet:sender
        role: Sender owner
        identity: null
      - side: jig:receiver
        role: Receiver owner
        identity: null
    ops:
      - op: bind_claim_owners
        claim: shared:SH-probe
        bindings:
          - side: ratchet:sender
            role: Sender owner
            identity: Sender owner team
            basis: confirmed
    acceptance:
      - owner: Sender owner team
        accepted: true
    claim_expects: true
    bound_claim:
      - side: ratchet:sender
        role: Sender owner
        identity: Sender owner team
        basis: confirmed
      - side: jig:receiver
        role: Receiver owner
        identity: null

  # Edition 5.2.0 (MC-114): a whitespace-only identity is pending like null, so an initial binding from it succeeds.
  - name: fixture-pa-claim-blank-identity-binds
    claim_owners:
      - side: ratchet:sender
        role: Sender owner
        identity: "   "
      - side: jig:receiver
        role: Receiver owner
        identity: null
    ops:
      - op: bind_claim_owners
        claim: shared:SH-probe
        bindings:
          - side: ratchet:sender
            role: Sender owner
            identity: Sending team
            basis: provisional
    acceptance:
      - owner: Sending team
        accepted: true
    bound_claim:
      - side: ratchet:sender
        role: Sender owner
        identity: Sending team
        basis: provisional
      - side: jig:receiver
        role: Receiver owner
        identity: null

  # Edition 5.2.0 (MC-114, PA-31): a present basis is checked on every row, a row left pending included.
  - name: fixture-pa-claim-pending-row-bad-basis
    claim_owners:
      - side: ratchet:sender
        role: Sender owner
        identity: null
      - side: jig:receiver
        role: Receiver owner
        identity: null
        basis: assumed
    ops:
      - op: bind_claim_owners
        claim: shared:SH-probe
        bindings:
          - side: ratchet:sender
            role: Sender owner
            identity: Sending team
            basis: provisional
    acceptance:
      - owner: Sending team
        accepted: true
    error: shared-acceptance-required
