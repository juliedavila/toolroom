            kind: control
            optional: false
          - id: r3
            from: s3.approval-console
            to: s3.policy-engine
            label: Approval decision
            carries:
              []
            kind: control
            optional: false
        contracts:
          - name: ActionSpec
            description: "One proposed action: target, effect and requester."
            produced_by:
              - s1.worker
            consumed_by:
              - s3.policy-engine
        views:
          - id: B
            title: "Proposals reach the policy engine, and approvals come from people"
            level: component
            elements:
              - s1.worker
              - s3.approval-console
              - s3.policy-engine
              - people.approver
            relationships:
              - r1
              - r2
              - r3
      realization.yaml:
        version: 1
        planes:
          orchestration: "Requests, durable workflow and producers."
          control: Exact-action authorization and approvals.
          shared:integration: "Adapters to the organization's systems and roles."
          evidence: "Intake, verification and evidence stores."
        elements:
          s1.worker:
            plane: orchestration
            class: Workflow worker service
            examples:
              - Temporal worker
            swap_point: false
            existing_tool_default: false
          s3.approval-console:
            plane: control
            class: Approval console
            examples:
              []
            swap_point: false
            existing_tool_default: false
          s3.policy-engine:
            plane: control
            class: Policy decision service
            examples:
              - Open Policy Agent
            swap_point: true
            swap_kind: requalify
            existing_tool_default: false
          people.approver:
            plane: shared:integration
            class: Identity-provider role
            examples:
              []
            swap_point: false
            existing_tool_default: true
      quality.yaml:
        version: 1
        failure_modes:
          fail-closed: The request is denied.
          queue-and-retry: Work waits durably and resumes.
        tiers:
          T0:
            name: Control safety
            failure_mode: fail-closed
          T1:
            name: Evidence
            failure_mode: queue-and-retry
        elements:
          s1.worker:
            - T1
            - queue-and-retry
            - durable tasks
          s3.approval-console:
            - T0
            - fail-closed
            - "no approval, no action"
          s3.policy-engine:
            - T0
            - fail-closed
            - deny when unavailable
        contracts:
          ActionSpec:
            - at-least-once
            - idempotency key = action id
