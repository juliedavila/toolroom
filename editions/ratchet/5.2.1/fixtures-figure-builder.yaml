# Acceptance fixtures for the figure builder (specification: spec-figure-builder.md).
# Every fixture runs on the shipped files of the edition folder (model.yaml, realization.yaml, quality.yaml,
# profile-schema.yaml), changed only by its "edits". An edited model is passed with the model option, an edited
# realization or quality file in a layer folder, an edited schema in a copy of the edition folder. "profile" is written
# as the profile file. Expected results were written from the specification, and the reference implementation reproduces every one.
# expect.errors and expect.warnings list every message of that level (a code, or a code and location), order ignored.
# expect.built lists the figures written, in order. The figure keys (header, nodes, edges, members, classes,
# text_contains) read each written Mermaid file by the statement subset; edges are "<from> <op> <to>" with op ">" for
# -->, "." for -.->, "x" for -.-x, "<>" for <--> and "~" for ~~~. svg_text_contains holds strings in the SVG file.
# For every figure a run writes, the runner also checks the SVG beside the Mermaid against FB-13 to FB-15, whatever
# the expect block says: written in both forms, the same structure read by the SVG statement subset, and the drawing rules.

fixtures:
  - name: "fixture-fb-shipped.yaml"
    description: "The shipped files byte for byte, with no profile: all five design figures, no messages (FB-1 to FB-4, FB-6 to FB-10)."
    expect:
      outcome: "ok"
      exit: 0
      errors: []
      warnings: []
      built: ["FIG-LOOP", "FIG-CONTROL-BOUNDARY", "FIG-PLANES", "FIG-PROVIDER-LADDER", "FIG-PART-MAP"]
      header:
        FIG-CONTROL-BOUNDARY: ["flowchart LR", "  %% FIG-CONTROL-BOUNDARY: The control boundary"]
        FIG-PLANES: ["flowchart LR", "  %% FIG-PLANES: The planes and their primary flows"]
        FIG-PROVIDER-LADDER: ["flowchart TB", "  %% FIG-PROVIDER-LADDER: Losing a model provider degrades the loop in steps"]
        FIG-PART-MAP: ["flowchart LR", "  %% FIG-PART-MAP: Every part by plane, trust zone and quality tier"]
      nodes:
        FIG-LOOP:
          count: 18
          contains: ["STEP-1", "STEP-6", "STEP-7", "STEP-12", "legend-agent", "legend-person", "legend-control", "legend-team", "change-stopped", "next-scenario"]
        FIG-CONTROL-BOUNDARY:
          count: 6
          contains: ["people.accountable-authorities", "s2.workflow-worker-app", "s4.model-data-gateway", "s3.action-control-service", "s5.proof-evidence-service", "s3.bounded-runner"]
        FIG-PLANES:
          count: 10
          contains: ["integration", "road", "context", "orchestration", "model-access", "control", "execution", "evidence", "evaluation", "roles"]
        FIG-PROVIDER-LADDER:
          count: 5
          contains: ["frontier", "self-hosted", "no-agent", "manual", "control"]
        FIG-PART-MAP:
          contains: ["s3.bounded-runner", "ext.estate", "s1.tool-signal-intake", "people.accountable-authorities"]
          excludes: ["s3.local-enforcement-point"]
      edges:
        FIG-LOOP:
          contains: ["STEP-1 > STEP-2", "STEP-5 > STEP-6", "STEP-7 > STEP-8", "STEP-11 > STEP-12", "STEP-10 . change-stopped", "STEP-11 > next-scenario", "who ~ find", "find > keep", "legend-agent ~ legend-person"]
          excludes: ["STEP-6 > STEP-7"]
        FIG-CONTROL-BOUNDARY:
          contains: ["s2.workflow-worker-app > s3.action-control-service", "people.accountable-authorities > s3.action-control-service", "s3.action-control-service > s3.bounded-runner", "s3.bounded-runner > s5.proof-evidence-service", "s2.workflow-worker-app . s4.model-data-gateway", "s2.workflow-worker-app x s3.bounded-runner"]
        FIG-PLANES:
          contains: ["integration > context", "context > orchestration", "orchestration > control", "control <> model-access", "roles > control", "control > execution", "execution > evidence", "evidence > integration", "evidence > evaluation", "evaluation > orchestration", "evidence > road", "road > integration"]
          excludes: ["model-access > control", "model-access <> control"]
        FIG-PROVIDER-LADDER:
          contains: ["frontier > self-hosted", "self-hosted > no-agent", "no-agent > manual", "control . frontier", "control . self-hosted", "control . no-agent", "control . manual"]
      text_contains:
        FIG-LOOP: ['%%{init: {"flowchart": {"rankSpacing": 26, "nodeSpacing": 22}', "%%\nflowchart TB\n  %% FIG-LOOP: The loop by actor\n"]
      members:
        FIG-LOOP: { STEP-1: "find", STEP-6: "find", STEP-7: "keep", STEP-12: "keep", legend-team: "who", change-stopped: "keep", next-scenario: "keep" }
        FIG-CONTROL-BOUNDARY: { people.accountable-authorities: null, s2.workflow-worker-app: "reasoning", s4.model-data-gateway: "reasoning", s3.action-control-service: "control", s5.proof-evidence-service: "control", s3.bounded-runner: "cell" }
        FIG-PART-MAP: { s3.bounded-runner: "zone-execution-execution", ext.estate: "zone-integration-shared_existing", s1.tool-signal-intake: "zone-integration-reasoning", people.accountable-authorities: "people-roles" }
      classes:
        FIG-LOOP: { STEP-1: "person", STEP-3: "agent", STEP-4: "person", STEP-5: "control", STEP-8: "team", STEP-9: "control", STEP-12: "team", change-stopped: "stop", next-scenario: "again" }
        FIG-PART-MAP: { s3.bounded-runner: "tierT0", ext.estate: "tierEXT", s1.tool-signal-intake: "tierT2", people.accountable-authorities: "person" }
      svg_text_contains:
        FIG-LOOP: ['role="img"', 'aria-label="FIG-LOOP: The loop by actor', 'data-figure="FIG-LOOP"', '<g data-node="STEP-3" data-in="find" data-classes="agent" data-shape="box">']
        FIG-CONTROL-BOUNDARY: ['data-from="s2.workflow-worker-app" data-to="s3.bounded-runner" data-op="x"', 'data-subgraph="cell" data-in=""']
        FIG-PLANES: ['data-from="control" data-to="model-access" data-op="&lt;&gt;"', 'data-node="roles" data-in="" data-classes="" data-shape="round"']
        FIG-PART-MAP: ['data-subgraph="zone-execution-execution" data-in="plane-execution"', 'stroke:var(--ink-2,#5A5047)']

