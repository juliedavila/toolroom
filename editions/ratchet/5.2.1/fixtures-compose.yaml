# Portable composition contracts. Each numbered rule is checked without a model checker.
fixtures:
  - name: compose-four-projections
    base: full
    modes:
      - full
      - ratchet
      - core
      - jig
  - name: compose-patched-organization
    base: full
    patch:
      ops:
        - op: add_element
          element:
            id: jig:org.adopter-probe
            name: Organization harness
            system: shared:EXT
            trust_zone: shared:existing
            level: component
            kind: service
            role_class: existing
            module: secure-creation
            responsibility: Runs the declared checks.
            agent_reachable: true
          layers:
            realization:
              plane: shared:integration
              class: service
              examples:
                []
              swap_point: false
              existing_tool_default: organization
            overlay:
              services:
                - Organization check runner
              fit: existing
              account: existing
              portability: open
        - op: add_relationship
          relationship:
            id: shared:o01-probe
            from: s6.regression-catalog
            to: jig:org.adopter-probe
            kind: data
            carries:
              []
            optional: true
            content: structured
            module: secure-creation
            no_contract: Reports the declared check signal.
        - op: add_to_seam
          seam: shared:secure-creation
          crossings:
            - id: shared:o01-probe
              carries:
                []
        - op: set_seam_exposure
          seam: shared:secure-creation
          part: jig:org.adopter-probe
          marks:
            agent_reachable: true
            exposed: false
            model_free: true
            role_class: existing
            kind: service
    modes:
      - full
      - ratchet
      - core
      - jig
  - name: compose-one-identity-binding
    base: full
    bind_identity: true
    modes:
      - full
      - ratchet
