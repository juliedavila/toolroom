            required_behavior: The gate refuses it and the task remains unauthorized.
            invariant: I1
            detection: A gate refusal is recorded.
            runbook: RB-org.hostile-response
            test:
              kind: pipeline
              steps: Send hostile model output and assert refusal with no unauthorized task.

