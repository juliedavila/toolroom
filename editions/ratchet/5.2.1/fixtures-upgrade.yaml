        profile: { name: Example, description: Organization fixture. }
        exceptions: []
      org/version.yaml: |
        version: 5.0.0+example.2
        upstream: 5.0.0
        org: example
        n: 2
        history: []
    expect:
      outcome: "ok"
      exit: 0
      errors: []
      warnings:
        - code: "checks.baseline"
          location: "shared:secure-creation.default_exceptions[0]"
      checks_baseline:
