      - CloudWatch
      - Bedrock model invocation logging to S3
    fit: managed
    account: reasoning
    portability: proprietary
    note: Invocation logging is off by default; logs stay in the source Region and record the Region that served the request.
  s5.proof-evidence-service: 
    services: 
      - ECS on Fargate
      - Lambda
    fit: managed-open
    account: evidence
    portability: open
    keeps: "Sole writer to the evidence stores: bucket and table policies deny every other principal, including administrators of other Ratchet accounts."
  s5.evidence-intake-validator: 
