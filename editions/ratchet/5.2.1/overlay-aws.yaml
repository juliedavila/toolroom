  s5.fix-brief-builder: 
    services: 
      - Step Functions or Temporal with templates
      - Lambda
    fit: managed-open
    account: evidence
    portability: open
    keeps: "Reads proof conditions under the evidence identity only; the brief schema has no field for expected outcomes or outsider text, and no model endpoint is reachable from its role."
  s5.learning-store: 
    services: 
      - Aurora PostgreSQL with append-only tables
      - Lambda for the retrieval check
    fit: managed-open
    account: evidence
    portability: open
    keeps: "Only the disposition service's role can write; the retrieval check runs under the evidence identity and withholds items without provenance before anything reaches the context compiler."
  s6.release-state-correlator: 
    services: 
      - "CodePipeline or the organization's CD"
      - ECR image digests
      - EventBridge
    fit: managed
    account: evidence
    portability: proprietary
