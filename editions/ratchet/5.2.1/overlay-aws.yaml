    account: reasoning
    portability: proprietary
    residency: true
    note: Use in-Region or geographic cross-Region inference profiles under a residency constraint; global profiles may process anywhere. vLLM on EKS is the portable self-hosted rung. See the shared failure domain trade-off.
  s4.route-usage-receipts: 
