    fit: managed-open
    account: evidence
    portability: open
    keeps: Append-only enforced by grants and triggers; digests anchored in Object Lock make tampering detectable.
    note: QLDB is retired; AWS itself points QLDB users to Aurora PostgreSQL.
  s5.path-impact-graph: 
    services: 
      - Amazon Neptune
      - Aurora PostgreSQL with Apache AGE (self-managed)
    fit: managed-open
    account: evidence
    portability: open
