      - S3 bucket with a dedicated KMS key
      - Secrets Manager
      - "the organization's Git host"
    fit: managed
    account: evidence
    portability: open
    keeps: "The KMS key policy names no agent role, so an agent cannot decrypt the proof condition even if a bucket policy is wrong. Never index this bucket into a Bedrock knowledge base."
  s5.protected-evidence-store: 
