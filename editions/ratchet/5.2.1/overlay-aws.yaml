      - S3 Object Lock in compliance mode
      - AWS Backup Vault Lock
    fit: managed
    account: evidence
    portability: open
    residency: true
    keeps: "Compliance-mode retention cannot be shortened by anyone, including the account root; the organization sets the retention."
