      patches/O01-stop-gate-harness.md: |
        # O01: Redraw the stop gate as a harness

        ## Why
        The organization's stop hook runs the agent's sessions after all.

        ## Ops
        ```yaml
        ops:
          - op: modify_element
            id: jig:stop-gate
            unset: [not_harness]
            set: { harness: { stop_gate: true, telemetry_export: full, version_pinning: true, blocking_hooks: true } }
        ```

        ## Risk and threat-model delta

        ## Feasibility note
        No build work.

        ## Exceptions needed
        None.

        ## Status
        proposed
