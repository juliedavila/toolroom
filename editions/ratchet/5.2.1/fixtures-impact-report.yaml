# Acceptance fixtures for the impact report (specification: spec-impact-report.md).
# Every fixture runs on the shipped data files (model.yaml, rules.yaml, quality.yaml, failures.yaml, realization.yaml,
# units.yaml), since the report must read real data, unless it brings its own under "data" (file name to content), which
# replace the shipped files; that is how a fixed input gives an exact model hash. Each fixture adds the organization's
# patches under "patches/" and, where it says so, a profile.yaml. "layer" stands for the organization's compiled design
# layer: for each of realization, quality and failures, the entries the organization added, merged into that shipped
# file's elements (failures: appended to its scenarios) and passed as the layer directory.
# "options.patch" names the patch under report; its base model is model.yaml with every earlier patch applied that is
# neither rejected nor withdrawn.
# A fixture runs once, twice with "runs: 2", or as a list of "steps": "run" (with its own expect block) or "replace"
# (an edit to a materialized file, made between runs; the text replaced occurs exactly once).
# expect.errors and expect.warnings list every message the run must produce (a code, or a code and location).
# expect.report is a partial match on the impact_report object: maps by the keys given, lists item by item.
# expect.report_contains needs each listed item, in a list at any depth, to match some item; an empty list there must
# be empty. expect.codes maps a should-never code to its basis.
# expect.markdown_equals is the generated Markdown sections, before the YAML block; expect.yaml_equals the block's text;
# expect.message_lines the printed message lines, in order;
# expect.json_keys the JSON report's top-level keys, in order.
# Every expected result is reproduced by our reference implementation; exact values (hashes, whole Markdown) were taken
# from its output.

fixtures:
  - name: "fixture-ir-noop.yaml"
    description: "A modify that sets an element's responsibility to its current text changes nothing; every section says None and the run warns (IR-2, IR-11)."
    options: { patch: "O01" }
    files:
      patches/O01-same-wording.md: |
        # O01: Restate the approval service responsibility

        ## Why
        The organization confirms the wording it reviewed.

        ## Ops
        ```yaml
        ops:
          - op: modify_element
            id: s3.approval-service
            set: { responsibility: "Authorized person / role / workflow; reason, expiry, exact action binding. Issues three kinds of approval to match the cadence ladder: per run (periodic), per batch naming tests, targets and window (scheduled), and standing permission for one reviewed test, target, identity and environment with an expiry (continuous). With no design limits declared these serve kept regression replays, as before; once limits and the consequence line are set, batch approvals and standing permissions may also serve other reviewed agent actions inside their producer's limit. Standing permissions are revoked when the planner steps a test down. On each new limit version, re-checks every outstanding batch approval and standing permission against it and revokes any that is wider. Reads limits from its signed, versioned copy; while that copy's lease has lapsed it issues no new batch approval or standing permission and sends each request to a person action by action (F104). Seeded known-bad proposals from the sampling service arrive at the dial-register rate (default 1 in 50 approvals), indistinguishable at the console; their outcomes give approval, edit and reject rates a denominator. Never issues a standing permission or batch approval wider than the design limit of the producer it serves, or reaching an asset at or above the consequence line; such a request goes to a person action by action. Counts the approval requests sent to each approver and holds them to the dial register's rate per approver per hour and to the approver's work-in-progress limit; requests past either wait in order, so no approver receives a flood, and a count past its trailing baseline alerts the control-plane operator and the seeding owner as a possible attack on the gate. While the rate is unset, the work-in-progress limit alone bounds the requests and the gap is reported." }
        ```

        ## Risk and threat-model delta

        ## Feasibility note
        Nothing to build.

        ## Exceptions needed
        None.

        ## Status
        proposed
    expect:
      outcome: "ok"
      exit: 0
      errors: []
      warnings: ["IR-W-empty"]
      sections_none: ["Summary", "Elements, relationships and contracts", "Trust-zone crossings", "Plane joins", "Enforcing parts", "Separations of duty", "Failure scenarios", "Quality", "Should-never codes that may need an exception", "Work units"]
      report:
        elements: { added: [], removed: [], changed: [] }
        relationships: { added: [], removed: [], changed: [] }
        should_never_codes: []
    source: "reference implementation"

