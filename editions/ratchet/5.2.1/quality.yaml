version: 1
security_test_time: 
  target_minutes: 10
  profile_field: delivery.security_test_time_target_minutes
  objective: "Security checks aim for test time strictly below the target at every delivery stage. The organization may change the target in its profile. A missing profile value uses the shipped default. This objective does not change a gate's timeout or failure posture."
deploy_gate: 
  applies_to: "The regression stage that s6.enterprise-adapters places in each owning service's pipeline."
  failure_mode: posture-from-policy
  dependency_grain: "A regression test declares its dependencies at this grain: the artifact digests it exercises, each library it exercises at its resolved version, each configuration key it reads, each policy id and each identity. A change touches the test when it changes any of these; a change to the service's deployable alone touches only tests that declare that artifact's digest. A declaration that names only the deployable makes every deploy of it a replay, so the test costs its full time on every deploy and saves nothing by scoping."
  scope_when_unavailable: "Only deploys that touch a regression's declared dependencies (artifact, policy, identity) are subject to the posture, reusing the dependency-scoped invalidation rule. Every other deploy proceeds while the gate is unavailable and is recorded, with its replay owed after recovery only if a later check finds it touched a dependency."
  core_posture_defaults: "Fail-closed when the demonstrated path reaches a crown-jewel or critical asset; fail-open-with-record for standard. Ship-through on a critical or crown-jewel path is a short-lived acceptance by the business risk owner with security risk owner concurrence. A path reaching the ship-through renewal cap (default 2 consecutive acceptances, a dial) refuses another until its posture review, fed by gate outcomes, is recorded. Profiles may override with attribution."
  service_level_owed_to_service_teams: 
    availability: "99.9% during the service's deploy windows (default), given the pipeline reached the stage; composed in critical_paths.deploy-gate from the execution cell alone, counting the four co-deployed cell parts as one unit; if they fail independently the same path composes to about 99.6%, and phase 2 measures which holds; the figure excludes the staging target's own availability"
    added_deploy_latency_p95: "10 minutes (default; the organization sets it in its profile, gate_failure_policy.added_latency_objective_minutes, beside the regression time budget dial, also 10 minutes by default). The stage stops waiting at the budget and applies the posture; an objective below the budget is refused unless the organization records dependency-scoped or post-deploy handling"
    blast_radius: "an outage holds only deploys inside a regression's declared dependency scope; the program reports how many deploys an outage held and how many it let through"
    decision: the program publishes this SLO and reports against it monthly; breaching it is a program incident
  unknown_consequence: "No core default. Each organization profile must set unattested_default (crown-jewel | critical | standard); the unattested count is reported as a register-gap metric. truly unattested assets should be rare, because someone in the organization usually knows roughly how critical an asset is."
