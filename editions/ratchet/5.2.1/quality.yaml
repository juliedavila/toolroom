contracts: 
  ContextQuery: 
    - request-response
    - read-only; safe to retry
  ContextSnapshot: 
    - immutable artifact by content hash
    - "same hash, same bytes"
  ValidationRequest: 
    - at-least-once
    - idempotency key = request id
  CandidateFinding: 
    - at-least-once
    - dedup at intake on producer run id plus finding fingerprint
  ValidationArtifact: 
    - at-least-once
    - content-addressed; duplicates collapse
  PatchCandidate: 
    - at-least-once
    - content-addressed
  ActionSpec: 
    - at-least-once
    - hash over normalized spec; duplicate submissions map to one approval
  ExecutionGrant: 
    - exactly-once consumption
    - atomic single-use consume in the grant store; replay denied; expiry against trusted time with skew margin
  ExecutionReceipt: 
    - at-least-once
    - keyed by grant id; a grant has at most one terminal receipt; missing receipt means effect-uncertain
  FindingDisposition: 
    - at-least-once
    - "keyed by finding id and version; later versions supersede, never overwrite"
  RegressionSpec: 
    - at-least-once
    - versioned by test id
  ModelRequest: 
    - at-most-once per attempt
    - retries create a new attempt with a new key; usage recorded per attempt
  TestFixture: 
    - immutable artifact by version
    - checksum verified before use
  OracleSpec: 
    - immutable artifact by version
    - readable only by S5; others receive a hash reference
  EvaluationSnapshot: 
    - immutable artifact by version
    - frozen before the first run of a cohort
  ConsequenceFact: 
    - versioned record
    - attestation id; supersedes chain; expiry
  RunRecord: 
    - event-sourced
    - attempt ids are unique; delivery acknowledgment never sets succeeded
  CostHandoffEntry: 
    - at-least-once
    - "keyed by run, activity and actor; corrections append"
  FailureClass: 
    - versioned record
    - class id plus version; membership changes append; merges only by disposition review
  RoadAdoption: 
    - at-least-once
    - "keyed by service, call site, entry version and deployed digest; latest observation wins, history kept"
  RoadAssurance: 
    - versioned record
    - "entry id plus version; superseded or withdrawn, never overwritten"
  PortfolioDecision: 
    - versioned record
    - "tool id plus version; superseded, never overwritten"
  TypedDecision: 
    - at-least-once
    - "keyed by decision type, subject and route version; advisory, so a lost or duplicate decision changes a ranking or a flag, never a grant, verdict or closure"
  DialSetting: 
    - versioned record
    - dial id plus version; every turn appends with actor and evidence; a setting past its floor links a risk acceptance
  SampleFrame: 
    - immutable artifact by version
    - frozen before any result; draws reproducible from the recorded seed
  ValueLedgerEntry: 
    - at-least-once
    - "keyed by business unit, period and source; corrections append"
  AdminSession: 
    - append-only record
    - session id; every command recorded before it runs; never edits evidence or grant content
  KeyReference: 
    - versioned artifact
    - key id plus version; overlapping validity windows; revocation propagates to every consumer within the posture expiry; a window bundle already minted sees a revocation only when it expires
  ReplayRequest: 
    - at-least-once
    - idempotency key = stage run id plus test id
  ReplayWindowBundle: 
    - signed artifact with expiry
    - "one per service and deploy window; each grant inside is consumed once; verified offline; its revocation lag is its lifetime: a narrowed design limit or a revoked key reaches a bundle only when it expires, so the lifetime from minting to expiry is capped by window_bundle_max_hours, or by posture_expiry_hours while that dial is unset, and a longer bundle is never minted"
  ReplayVerdict: 
    - at-least-once
    - "keyed by stage run id, test id and grant id; one terminal verdict per grant"
  AuditRecord: 
    - append-only
    - hash-chained; written before the effect; drained exactly once by record id
  PolicyBundle: 
    - versioned artifact
    - bundle id plus version; staged; rollback re-releases the previous version
  ReleaseAttestation: 
    - versioned artifact
    - "artifact digest plus signed increasing release sequence; release-purpose verification before admission; durable per-cell high-water mark, consumed rollback number and sticky refusal ranges; pipeline provisioning initializes new and rebuilt cells"
  ServiceIndicator: 
    - at-least-once
    - "keyed by indicator, source and window; missing windows read as unknown"
  ErrorBudgetStatus: 
    - latest-wins record
    - objective id plus window; freeze state changes are recorded with actor
  ModelResponse: 
    - at-most-once per attempt
    - attempt id; untrusted content; never retried into a different attempt
  FeedbackProposal: 
    - at-least-once
    - proposal id; applies only after context owner review
  PromotionDecision: 
    - versioned record
    - "configuration id plus version; superseded, never overwritten"
  GateOutcome: 
    - at-least-once
    - "keyed by gate, path and event"
  RouteQualification: 
    - latest-wins record
    - route id; history kept
  SourceRecord: 
    - at-least-once
    - "keyed by source system, record id and cursor window; a re-read appends, never overwrites"
  RouteUsage: 
    - at-least-once
    - "keyed by attempt id; one record per attempt, rejected attempts included"
  CredentialLease: 
    - exactly-once consumption
    - bound to one grant id; single use; expiry against trusted time; revocation honored before use
  DefensiveObservation: 
    - at-least-once
    - "keyed by detection source and observation id; reconciliation appends, never edits the observation"
  ReviewClaim: 
    - versioned record
    - claim id plus version; status changes append with their evidence references
  GatedResponse: 
    - at-most-once per attempt
    - attempt id; keeps the untrusted marking of its input; never retried into a different attempt
  ApprovalOutcome: 
    - at-least-once
    - keyed by ActionSpec hash and approver; one terminal decision per approval request
  AutonomyGrant: 
    - versioned record
    - grant id plus version; lapse and revocation append with the record that caused them; an expired grant is never renewed in place
  KeptTestStatus: 
    - versioned record
    - test id plus version; every lane or status change appends with who decided it; a retired test is never deleted
  DetectionProposal: 
    - append-only record
    - "keyed by proposal id; the defensive side's review outcome appends and never overwrites"
  EscapeRecord: 
    - versioned record
    - "keyed by escape id; confirmation, recovery and fix scope append as they happen, and an unconfirmed record never counts in a measure"
  FixPath: 
    - versioned record
    - "keyed by finding id; the owning team's decision on the drafted fix appends and never overwrites; complete only with all three parts"
  FixCapRefusal: 
    - append-only record
    - keyed by finding id and refusal date; each review appends its outcome; a refusal is never deleted
  LearnedItem: 
    - append-only record
    - keyed by item id and version; provenance and clearing records append and never change; each retrieval decision is logged
  OutsiderLabelSet: 
    - versioned record
    - "carried inside the record it labels; a clearing appends a clearing record to the field and never removes the field's sources; recomputed from input ids where a part checks coverage"
  PostmortemRecord: 
    - versioned record
    - "keyed by postmortem id; the review, the security risk owner's signature and each action item's outcome append; a record is never deleted, and one trigger event opens at most one postmortem"
  DesignLimit: 
    - versioned record
    - "limit id plus version; every change appends with the role that made it and its evidence; each grant records the version it was last checked against, and a grant checked only against an older version is not honored, except a grant inside a window bundle already minted, which is honored until the bundle expires (the bundle's stated revocation lag)"
  ConsequenceLine: 
    - versioned record
    - one current line plus version; every change appends with the business risk owner who made it and the reason; lowering it starts a new limit version
  AgentActionRecord: 
    - append-only record
    - keyed by action id; the accuracy verdict and the cost of a wrong action append later and never overwrite what the action touched
  InjectionRecord: 
    - append-only record
    - "keyed by experiment id; detection, a stop, recovery and the actual cost append as they happen and never overwrite the layer and estimate recorded before the start"
  RestoreGrant: 
    - exactly-once consumption
    - "signed artifact with the injection grant's expiry; verified offline by the local enforcement point and consumed once, by the cell's timer at expiry or early on a stop; never extended"
  SecretRevocation: 
    - append-only record
    - "keyed by finding id; the owning team's revocation and rotation and each revocation check result append as they happen; the record holds the credential's fingerprint and never its value"
  CredentialRecipe: 
    - versioned register
    - keyed by credential type; a recipe change is a new version and the next revocation check uses it; a type with no recipe closes only on attestation
  SealedCredential: 
    - sealed record
    - released once per probe series to the lease broker and destroyed after its last attempt; an unreleased value is destroyed when the finding closes
  ConformanceRead: 
    - append-only record
    - keyed by finding id; every read appends with its result; unknown never closes
  ExploitationSignal: 
    - versioned record
    - keyed by source and catalog entry or report reference; a later listing or retraction appends a version and never overwrites the date first listed or observed
  PriorityInputs: 
    - versioned record
    - keyed by finding id; a changed exposure or automatable value appends a version with who or which check set it and never overwrites the value in force at disposition
  MitigationRecord: 
    - append-only record
    - "keyed by finding id and mitigation; each replay result, expiry and removal appends as it happens and never overwrites what held the path or who applied it"
  DisclosureRecord: 
    - append-only record
    - keyed by finding id and direction; a changed deadline or a new outcome appends with its date and never overwrites the deadline or outcome recorded before it
  GateCatchRate: 
    - latest-wins record
    - "keyed by gate, person and window; recomputed by rule from recorded outcomes, so a resend replaces the window's value; a window with no record reads as silent, never as zero"
  OutcomeFeedback: 
    - latest-wins record
    - "keyed by receiving role, decision type, measure and window; recomputed by rule from the records it references, so a resend replaces the window's value; a window with no record reads as silent, never as zero"
  VerifiedObservation: 
    - append-only record
    - "keyed by run or intake id and the observer's version; a repeat with the same key and hashes adds nothing, and a new observation appends and never overwrites an earlier one"
  ClassTestResult: 
    - append-only record
    - "keyed by rule id, rule version and test date; appended to the rule version it tested and never overwrites an earlier result; it never leaves the regression catalog"
  RegressionHashes: 
    - versioned record
    - "keyed by test id and version; carries no expected behavior, only the registered hash"
  WeaknessStatement: 
    - immutable artifact by version
    - "keyed by proof condition id and version; a new condition version yields a new statement, never an edit in place"
  DiscoveryLeadSubmission: 
    - at-least-once
    - "Keyed by request or finding reference, author and time; each decision appends a record."
  AutonomyGrantRequest: 
    - at-least-once
    - "Keyed by request or finding reference, author and time; each decision appends a record."
  AutonomyGrantConcurrence: 
    - at-least-once
    - "Keyed by request or finding reference, author and time; each decision appends a record."
  AdminSessionRequest: 
    - at-least-once
    - "Keyed by request or finding reference, author and time; each decision appends a record."
  AdminSessionApproval: 
    - at-least-once
    - "Keyed by request or finding reference, author and time; each decision appends a record."
  PolicyChangeProposal: 
    - at-least-once
    - "Keyed by request or finding reference, author and time; each decision appends a record."
  PolicyChangeApproval: 
    - at-least-once
    - "Keyed by request or finding reference, author and time; each decision appends a record."
  PersonWrittenBrief: 
    - at-least-once
    - "Keyed by request or finding reference, author and time; each decision appends a record."
  InstanceRegression: 
    - at-least-once
    - "Append-only observations keyed by test id, version, source revision and run."
  InstanceTestObservation: 
    - at-least-once
    - "Append-only observations keyed by test id, version, source revision and run."
  KeptTestMirrorStatus: 
    - at-least-once
    - "Append-only observations keyed by test id, version, source revision and run."
  jig:HunkRouteAdvice: 
    - at-least-once
    - "keyed by change id, hunk id and advisor version; a repeat adds nothing, since advice can only add a hunk to the human route"
  jig:CreationOutcome: 
    - latest-wins record
    - "keyed by author, measure and closed cohort; recomputed by rule from the shared record, so a resend replaces the cohort's value; a window with no record reads as silent, never as zero"
  jig:ReviewerDrift: 
    - latest-wins record
    - "keyed by reviewer and window; recomputed by rule from review outcomes and the seeded catch counts Ratchet sends, so a resend replaces the window's value; a window with no record reads as silent, never as zero"
  jig:LayerCatchRate: 
    - latest-wins record
    - "keyed by layer or rule and closed cohort; recomputed by rule from the layer log and the assigned catch layers, so a resend replaces the cohort's value; a window with no record reads as silent, never as zero"
  shared:RoadEntry: 
    - versioned artifact
    - entry id plus version; released through the platform pipeline
  shared:DerivedCheck: 
    - versioned record
    - "keyed by check id and version with the kept regression's test id and version it came from; a new regression version yields a new check version, never an edit in place"
  shared:DroppedCheck: 
    - append-only record
    - "keyed by check id, version and time; a re-enabled check appends a new record"
  shared:ProvenClass: 
    - versioned record
    - class id plus projection version; public semantic or closure-state changes increase it; membership changes while already open alone do not
  shared:RoadAssuranceStatus: 
    - versioned record
    - "entry id plus version, projected from the road assurance record; superseded or withdrawn, never overwritten"
  shared:FixBrief: 
    - versioned record
    - "keyed by finding id; a new reproduction or proof-condition version yields a new brief version, never an edit in place; how it was made is part of the record"
  shared:CreationRule: 
    - versioned artifact
    - "rule id plus version, written only by the policy-owning team; a class test's result is a record of its own and never edits the rule"
  shared:CatchLayer: 
    - versioned record
    - keyed by finding id; a reassignment appends a version with who assigned it and never overwrites the layer in force when a measure was reported
  shared:ClassTestCount: 
    - latest-wins record
    - rule id plus rule version; only the current pass or fail is projected from the protected class-test result
  shared:CreationLead: 
    - at-least-once
    - "keyed by tool, rule id (with rename mapping) and fingerprint; the tool signal intake normalizes each into a tool lead and deduplicates within the tool"
  shared:ProvenanceStamp: 
    - immutable artifact by content hash
    - signed once per change and revision; a restamp is a new artifact and never replaces the stamp a review saw
  shared:ReviewerSeedCatch: 
    - latest-wins record
    - "keyed by reviewer and window; recomputed by rule from review outcomes and the seed frame, so a resend replaces the window's value; a window with no record reads as silent, never as zero"
  shared:SeededChange: 
    - immutable artifact by content hash
    - keyed by sandbox branch and revision; a reseed is a new branch and never replaces a change a reviewer has seen
  shared:DerivedCheckMisses: 
    - latest-wins record
    - "keyed by check id, check version and window; recomputed by rule from replay results, so a resend replaces the window's value; a window with no record reads as silent, never as zero"
  shared:ClassTestTotals: 
    - versioned record
    - "rule and class versions; delivered directly to the policy-owning team: people, never an agent, with no agent-readable copy"
  shared:ChangeRecord: 
    - at-least-once
    - keyed by finding id plus change id
  shared:GateFailurePosture: 
    - signed artifact with expiry
    - verified offline by the pipeline stage; an expired or untrusted posture falls back to the tier default it carries
  shared:ToolLead: 
    - at-least-once
    - "keyed by tool, rule id (with rename mapping) and fingerprint; status updates append"
  shared:DeliveryTelemetry: 
    - at-least-once
    - "keyed by tool gate, service and period"
  shared:ChangeProvenance: 
    - at-least-once
    - "keyed by change id and revision; a later attestation verification appends, never overwrites; an unlabeled change is recorded as unlabeled and an unverifiable stamp as unverified"
  shared:TrackerText: 
    - at-least-once
    - "keyed by item id and the time the text was written; an edited issue or comment appends a new record, and only the quarantined reader receives it"
tool_metrics: 
  lead_yield: "Share of sampled leads the loop demonstrates when tested, per tool, rule family and tool class. Untested leads are outside the sample and never count as false."
  miss_rate: "Demonstrated paths inside a tool's declared scope that no lead from that tool pointed at, per tool class."
  review_claim_contradictions: "Threat-model and review invariants contradicted by a demonstrated path, per review practice."
  developer_queue_toil: "Leads reaching developer queues per service-month and triage hours per item, before and after the confidence bar."
  delivery_impact_per_tool: "Side-quest metric. Direct: stage time and queue time attributable to each tool gate, deploys blocked or delayed by the tool, developer triage time per lead, all from pipeline timings and tracker data. Associated: DORA's five metrics (change lead time, deployment frequency, failed deployment recovery time, change fail rate, deployment rework rate) by tool configuration, reported as correlational, never causal, with the comparison set named. Only metrics the profile lists as collected."
  held_lead_sample_outcomes: Demonstration rate among sampled held-back leads; a rise means the bar is too high.
  typed_route_calibration: "Per typed route and decision type, on the organization's sampled ground truth: expected calibration error over ten equal-width probability bins, and its one-sided 90% upper confidence bound from a basic bootstrap over the labeled sample, which also removes the estimate's upward bias at small samples. A route qualifies for a decision type when the bound is at or under typed_route_max_calibration_error and it has at least the labels the dial register lists for that ceiling. Below that count the report says sample too small, the type stays on its declared fallback, and nothing is said about the model. Typed routes pay off where labels are cheap and plentiful, such as lead triage at high volume, and rarely where reproduced outcomes arrive a few dozen a quarter."
  catch_layer_per_accepted_defect: "For each accepted finding, two layers (agent-edit, stop-gate, commit, push, pr, post-merge, external, or none): where it was caught, the earliest layer at which any lead pointed at it, supplied only by the leads' detection_layer; and where it should have been caught, assigned by the evaluation group, which is independent of the secure-creation loop and of the road owner, so neither grades its own layers. Reported per failure class and tool. The secure-creation loop logs each derived check it drops or disables, and evaluation reports each such drop against the catch layer of the later findings in that check's class."
road_metrics: 
  road_answer_share: Share of accepted findings whose failure class has at least one road entry with a verified (constraint-enforced) retirement claim.
  adoption: "Share of in-scope services the road conformance check finds on-road, per entry, from deployed state."
  escape_hatch_rate: "Escape-hatch uses per on-road service per month, per entry and per hatch; a rise under deadline pressure is read as drift (F27)."
  reintroduction_on_vs_off_road: "Findings in a retired class per service-month, on-road versus off-road. A road entry whose on-road rate is not lower than off-road loses its retirement claim for that class."
  findings_per_change_on_vs_off_road: "Accepted findings per merged change, on-road versus off-road, split by human-written and agent-generated changes where the organization can label authorship, and further by tool and model where change provenance carries them. Counted on the reproduced tier only (see record_tiers), with the check-confirmed tier beside it; unlabeled changes stay in the denominator as their own row. Reported per lagged cohort (see lagged_cohorts). This is the measurable form of 'engineers can build however they like on the road, and it matters less'."
  record_tiers: "Every defect in the shared record carries one of two labeled tiers. Check-confirmed: a deterministic check confirmed it. Reproduced: Ratchet's independent verifier, or a person outside the authoring team, reproduced it against a proof condition. Shared measures count the reproduced tier; the check-confirmed tier is reported beside it and never merged into it, because the classes deterministic checks see best are the secure-creation loop's own targets."
  self_validated_findings: "While any earned-autonomy grant is active, every measure that counts findings is reported twice: with the findings the system validated itself under a grant, and without them. A self-validated finding carries its label and grant id in the record, is never counted in the reproduced tier, and each grant's honesty and correctness records are reported beside the measures it touches."
  lagged_cohorts: "Every defect-based measure (findings per change, reintroduction per retired class, catch layer) is reported only for cohorts of changes merged in a period whose reproduction window has closed; each report shows, beside the value, the count of candidate findings for that cohort still pending reproduction. A cohort inside its window is shown as pending, never as a value."
  reviewer_approval_drift_on_agent_changes: "Reported per period. Approval rate per reviewer on agent-authored changes (an agent together with the person whose session produced the change) against that reviewer's trailing baseline and against the same reviewer's rate on human-written changes, with the accepted findings later traced to the changes each approved. The baseline includes seeded known-bad agent-written changes from the sampling and seeding service (s7.sampling-service), the same way it seeds known-bad proposals for approvers (seeded_proposal_rate, approval_gate_health). Seeds go only into sandbox branches the reviewer cannot tell apart from real ones, never onto the protected branch, so a seed approved by mistake can never merge. A seed's approval rate is the drift signal that does not wait for findings to be traced. Seed results are read pooled per change kind with a confidence interval, and per reviewer only once that reviewer's own interval is narrower than approver_drift_threshold_pp. A rise in approvals with no fall in traced findings, or a rise in seeds approved, opens a recalibration task; it is never a performance rating."
  tailoring_return: "Scanner findings, triage time and analysis effort removed at covered-by-road call sites, against escapes found by testing the pre-registered sample of covered call sites (F36). A rising escape rate withdraws coverage for that entry and class."
  vetted_version_share: Share of on-road call sites running an entry version with a current road assurance record; unvetted versions confer no coverage.
  test_load_avoided: "Per-service regressions replaced by inherited road-level regressions, net of reinstatements; the program's testing-toil return on the road."
program_metrics: 
  security_test_time: "Security test time at every delivery stage, by service and stage: median, p95, sample size and share of stage runs strictly below delivery.security_test_time_target_minutes, using the shipped 10-minute target when the profile omits it. Report the effective target beside each result. Measure elapsed time spent running security checks, including parallel checks only once, and report queue time separately. A stage without collected timings reads not measured and remains visible."
  handoffs_per_closed_loop: "Headline flow metric from phase 2. Handoffs per closed loop and queue time per handoff, against the profile ceiling per claim; over the ceiling, the next pull must remove a handoff."
  ship_through_rate: "Ship-through acceptances per path, team and tier against a trailing baseline, shown beside the deploy-gate SLO; the renewal cap forces a posture review."
  posture_review_triggers: "Posture reviews by trigger (renewal cap, failed post-recovery replay, interval) and outcome (raised, lowered, unchanged)."
  approval_gate_health: "Approval latency, edit, approve and reject rates per approver and action class, with seeded known-bad proposals (default 1 in 50 approvals) as the denominator. Seeds are few at that rate, so their results are reported pooled per action class with a confidence interval; a per-approver seed figure is shown only once that approver's own interval is narrower than approver_drift_threshold_pp, and is labeled too few seeds to read until then."
  reviewer_wip_and_queue_age: Open items and oldest item age per approver and verifier against their dial limits; dispatcher refusals by reason.
  things_went_right: "First-run regression pass share, legitimate-function check pass share, false-failure rate, time to adapt a regression after a legitimate change; reported next to findings and closures."
  regression_stage_time: Regression stage time per service as a trend against its budget; replays skipped because no declared dependency changed; regressions consolidated onto constraint-enforced classes or vetted road entries.
  skipped_replay_misses: "Failures found later whose cause lies in a dependency a skipped replay did not declare (a transitive library, a framework default, configuration outside the declaration), per test and per kind of dependency; each one corrects that test's declaration."
  attestation_load: Owner minutes and testing-team drafting hours per attestation.
  value_per_line_of_business: "Cost paid, risk reduced on its assets and friction removed per business unit (s7.value-ledger), net of sampled escapes."
  no_agent_arm: "Time, cost and outcome per seeded case for the agent arm and the scripted no-agent arm from phase 1; descriptive only until phase 3's pre-registered minimum; feeds the early stop rule."
  loop_canary: "Scheduled end-to-end runs of the phase 1 seeded scenario against the live loop from phase 2: pass, or the first failing seam."
  dial_turns: "Every dial turn with actor, evidence and, past a floor, the linked risk acceptance."
  fix_capacity_saturation: "Per owning team: accepted findings open past the remediation window for their consequence tier (the profile's window for the highest tier the finding's path reaches, or its single window where that tier has none), median accepted-finding age trend, open accepted findings against the WIP cap, which is the team's fix cap (set by the team with security, or the program's default cap). On while age rises for the profile window with open findings at the cap; while on, new producers targeting the team are deferred and paved-road work is recommended."
  fix_path_and_refusals: "Per owning team: validated findings that entered its queue with a complete fix path, findings waiting for one and for how long, the team's decision on each drafted fix (taken, edited, declined), the team's hours per accepted finding on the fix path against its hours per finding before (from the current-practice map), and refusals above its fix cap by reason and age, with reviews done and overdue against the review interval (monthly unless the organization sets another)."
  approval_rate_drift: Approval-rate trend per approver and action class against a trailing baseline; drift past approver_drift_threshold_pp opens a rotation or recalibration task. Seeds measure gate health; they are not a vigilance control.
  verification_hours_per_closure: "Intake, reproduction, disposition review and retest hours per accepted closure and per rejected candidate, per arm; a cost comparison without them is refused."
  degradation_rung_time: "Share of runs and hours per rung of the degradation ladder (frontier, self-hosted, no-agent, manual), rung changes by cause, and work paused for lack of a rung."
  fallback_drill_freshness: "Days since each fallback route last passed a failover drill, the drill comparison with the primary route, and routes marked stale."
  clearing_gate_health: "Clearing outsider-labeled free text is an approval action class. Per clearer: open clearing requests against the approver WIP limit, the time from request to decision against the organization's objective, the clearing rate against a trailing baseline (drift past approver_drift_threshold_pp opens a recalibration task, as for approvals), and seeded requests carrying a planted instruction (sent at seeded_proposal_rate) that were cleared. Seeds measure gate health and screen clearers; finding what nobody flagged stays with the sampling frames."
  human_gate_load: "Per role and week, reported beside the remediation measures: approvals, clearings, person-written fix briefs, fix-cap reviews co-signed and approvals above the consequence line, each with its open count and oldest age. Clearing volume grows with findings and leads while the number of people who clear stays the same, so a gate turning into a formality shows here first."
  fix_brief_sources: "Per quarter: fix briefs derived by rule against briefs a person wrote, and derivations sent to a person because a labeled field (free-text steps, the target's output) was needed. A rising person-written share means the derived brief is too thin and the person-written fallback has become the common case."
  label_coverage_mismatches: "Per quarter: items the learning store found at write or at retrieval whose recorded outsider labels did not cover the labels recomputed from their input ids, and derived fix briefs the builder refused for the same reason. Any mismatch means labels are being dropped between parts; the untagged-item share cannot show this."
remediation_metrics: 
  escape_rate: "Security weaknesses that reached production, per deployment (the denominator DORA's change fail rate uses), by weakness class, read against the organization's own starting point, naming the version of the frozen baseline it read (the freeze at phase 2 entry, or a later dated amendment). An escape is an accepted finding whose demonstrated path runs through the running system; one a kept or pipeline test stopped before it shipped is a catch. Numerator from the finding ledger (accepted findings found in production, by weakness class and path key); denominator from deploy records. The starting point comes from the historical findings and incidents gathered in the current-practice map, because phase 1 handles one weakness."
  time_to_remediate: "An analogue of DORA's failed deployment recovery time for security: elapsed time from a reproduced finding to a fix verified in the running system, median and spread per weakness class and owning team. Start from the finding ledger (reproduction recorded), the waits in between from the tracker, and the end from deploy records and the closure record of the independent retest."
  remediation_change_fail_rate: "DORA's change fail rate restricted to deployments of security fixes: the share that cause a failure in production (a rollback, hotfix, incident or failed replay). As discovery slows, remediation may become the main change stream and this may become the main source of new defects."
  cost_per_validated_novel_finding: "Full cost (agent, model and runner spend plus verification hours) divided by validated findings that are novel, meaning no earlier record in the finding ledger has the same path key (weakness class plus the defined path the ledger records). A rising value with a flat novel count is the signal that discovery is reaching diminishing returns."
  arrivals_vs_verified_fixes: "Per weakness class and period: validated findings arriving against verified fixes (independently retested and accepted). Arrivals above fixes for a sustained period is the backlog signal; the fix-capacity saturation signal reads the same queues per team."
  validated_finding_queue_age: "Age of open validated findings, median and oldest, per weakness class and owning team, with the trend; the flow-time view of the remediation queue."
  novel_vs_recurring_share: "Share of validated findings in a period that are novel against recurring (the same path key as an earlier finding in the finding ledger, or a class a road entry claims to retire). A rising recurring share points at class-level fixes; a falling novel share with steady cost points at saturation of discovery."
  weakness_classes_retired: "Weakness classes retired per period (by a vetted road entry or a constraint-enforced closure), net of classes reinstated after an escape. Classes that new technology brings start a count of their own."
  time_to_revoke: "For a finding of kind exposed secret, reported in place of time to remediate: elapsed time from detection to the first revocation check that records the old credential refused, median and spread per owning team, still running while the old credential authenticates. Removing the secret from code, history, logs or tickets does not stop it. From the SecretRevocation record and the closure record; an escape whose finding is an exposed secret reports it as its time to recover."
  time_to_conform: "For a finding of kind infrastructure misconfiguration, reported in place of time to remediate: elapsed time from detection to the first read of the live configuration that matches the declared intent, median and spread per owning team, still running until a read matches. A merged or applied change to the infrastructure code does not stop it. From the ConformanceRead record; an escape whose finding is of this kind reports it as its time to recover."
  kept_test_suite_health: "Kept regression tests per lane (blocking, scheduled) and status (active, quarantined, retired); quarantine count and oldest age against the organization's caps; re-proof results, with tests that no longer fail against their reverted fix and whether the verifier confirmed each, and tests not re-provable (the revert conflicts, or the copy no longer builds or starts) by fix age, which never count as no longer failing; retirements by covering check; blocking-lane stage time against the regression time budget."
  team_time_lost_to_security_debt: "Owning-team time lost to security debt, the interest on that debt, reported beside the counts per owning team and period: the share of the team's engineering time it reports losing to open security findings and to the workarounds, rework and extra testing they cause, from a short periodic survey of the owning team at an interval the organization sets; beside it, what the flow ledger shows of the same team's time on security work (queue waits, hours on the fix path, reopened fixes and failed security fixes). The survey reading leads, because at scale engineers' own reports have proved more tractable than code metrics for measuring debt; the two sources are labeled and never merged. Where the organization surveys the same team's time lost to the rest of its quality debt (reliability, performance, operability and the rest), it is shown beside, since security debt is one share of quality debt and all of it draws on one engineering pool. Read against the team's open findings above its fix cap: findings validated beyond fix capacity that raise this measure without a fall in escapes add interest without reducing risk. No measure carries a target the edition set."
  contributed_test_survival: "For a named contribution cohort and assessment window, contributed instance tests still enabled and passing at the assessed revision, configuration and scope divided by every contributed test in that cohort. Removed, skipped, failing and retired tests remain in the denominator. Unknown observations are listed separately with observation coverage, so a missing source is never counted as passing. Report numerator, denominator, cohort and window. An empty cohort reads not measured. No edition-set target."
  instance_to_class_promotion: "For the same named contribution cohort, instance tests linked to an accepted security-owned class guardrail with passing independent class validation divided by all contributed instance tests in that cohort. Record class and guardrail versions and acceptance. Count each instance at most once and report distinct promoted classes separately. Retain retired instances in the cohort and list pending and unknown promotion evidence. An empty cohort reads not measured. No edition-set target."
