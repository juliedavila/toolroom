critical_paths: 
  external: 
    ext.identity-provider: 
      availability: 0.9995
      note: "assumed: enterprise identity provider; set in the profile's infrastructure_dependencies"
  paths: 
    approve-and-run: 
      name: Approve and run one test
      target_tier: T0
      must_answer: 
        - ext.identity-provider
        - s3.approval-console
        - s3.approval-service
        - s3.policy-decision-point
        - s1.live-precondition-resolver
        - s3.grant-approval-store
        - s3.credential-lease-broker
        - s3.local-enforcement-point
        - s3.bounded-runner
        - s3.local-audit-buffer
      co_deploy: 
        control: 
          - s3.approval-console
          - s3.approval-service
          - s3.policy-decision-point
          - s1.live-precondition-resolver
          - s3.grant-approval-store
          - s3.credential-lease-broker
        cell: 
          - s3.local-enforcement-point
          - s3.bounded-runner
          - s3.local-audit-buffer
      off_path: "Snapshot index (prefetched, r074), oracle references (cached, r095), postures (cached, and protected audit (drained from the local buffer) no longer gate a run."
    record-and-verify: 
      name: Record and verify evidence
      target_tier: T1
      must_answer: 
        - s3.observation-receipt
        - s5.evidence-intake-validator
      off_path: "Verification, disposition and the ledger work from durable queues; the outbox holds each receipt until intake acknowledges it."
    deploy-gate: 
      name: "Regression gate in the deploy path, blocking mode"
      target: deploy_gate
      condition: "Given the owning pipeline reached the stage: its CI runner is up and the candidate is deployed to staging. The stage runs inside the CI job."
      must_answer: 
        - s3.local-enforcement-point
        - s3.bounded-runner
        - s3.local-audit-buffer
        - s3.replay-verdict
      co_deploy: 
        cell: 
          - s3.local-enforcement-point
          - s3.bounded-runner
          - s3.local-audit-buffer
          - s3.replay-verdict
      required_hops: 
        - - s6.enterprise-adapters
          - s6.retest-regression-planner
          - the stage requests the replay
        - - s6.enterprise-adapters
          - s3.local-enforcement-point
          - the stage presents the window bundle
        - - s3.replay-verdict
          - s6.enterprise-adapters
          - the verdict returns to the stage
      off_path: "The window bundle is minted at least window_bundle_lead_hours before the window; posture and tier defaults are held offline in the stage; the planner, lease broker, gate failure policy, protected audit and S5 intake are off the deploy-time path."
ratchet_slos: 
  approval_latency: 
    objective: "95% of approval requests reach an approver's queue within 5 minutes"
    on_call: control-plane operator
  grant_success: 
    objective: 99.5% of approved actions receive their grant on the first request
    on_call: control-plane operator
  intake_to_verified: 
    objective: 90% of receipts verified or rejected within 2 business days
    on_call: evaluation engineer
  evidence_durability: 
    objective: 100% of acknowledged evidence readable with an intact hash chain in each restore drill
    on_call: control-plane operator
  posture_freshness: 
    objective: "99.9% of regression-stage runs hold current, signed outage instructions and replay-window permissions"
    on_call: control-plane operator
  injection_restore: 
    objective: "100% of attack injections restored at or before their grant's expiry, including while the control plane is down"
    on_call: platform operator
  canary_freshness: 
    objective: The loop canary passed within the last 24 hours; the dead-man alarm fires at 26 hours
    on_call: platform operator
  clearing_decision_time: 
    objective: Clearing requests decided within the time the organization sets; the edition ships no default
    on_call: evaluation engineer
  fix_brief_age: 
    objective: No reproduced finding waits for its fix brief longer than the gate queue-age limit; each one past it pages
    on_call: evaluation engineer
  fix_path_wait: 
    objective: "No finding waits for a fix path the security side cannot complete longer than the gate queue-age limit without reaching the security risk owner's report"
    on_call: evaluation engineer
  revocation_unknown: 
    objective: No exposed-secret revocation check stays unknown for more than one day; each one past it pages
    on_call: control-plane operator
operability: 
  on_call: 
    control_plane: control-plane operator
    orchestration_and_cells: platform operator
    evaluation: evaluation engineer
  runbooks: "Every failure scenario has a runbook RB-<scenario id>, owned by the on-call role of its first part; the model check refuses a scenario without one."
  game_days: Every game-day scenario runs at least twice a year; control-plane region loss and key compromise at least once a year.
  change_freeze: "A burned error budget freezes Ratchet's own policy and software releases until the budget recovers or the security risk owner records an exception; product deploys are never frozen by Ratchet's budget. Two kinds of change still release during a freeze, each recorded with its direction and still through the deny-diff, the policy unit tests and the staged rollout: a change whose deny-diff newly allows nothing (a narrowed limit, a revoked policy, a removed allowlist entry) and a security fix to Ratchet's own parts."
  postmortems: "Each of these triggers opens a postmortem, decided before any incident: an effect outside an approved scope or with no approval; a closure contradicted by a later confirmed escape on its path key; evidence lost or unreadable; one incident using more than 20% of an objective's error budget over its rolling window; the loop canary's dead-man alarm; a seeded proposal or seeded change that reached execution or merged; and a request from any role. The on-call role of the first failing part owns it. The review is blameless: it states contributing causes as conditions of the system, never as a person, and turns each action item into a design change, a profile change or a work unit with an owner. The security risk owner reads and signs each one, and an open postmortem stays on the status report until every action item has landed or been declined with a reason."
tiers: 
  T0: 
    name: Control safety
    intent: "Authorization, grants, credentials, audit and live prerequisite checks. Wrong answers are worse than no answer."
    failure_mode: fail-closed
    defaults: 
      availability: "99.9% monthly (unavailability blocks actions, never permits them)"
      rpo: 0 from acknowledgment (synchronous replication)
      rto: 1 hour
      consistency: linearizable for grant issue and consume; strongly consistent reads
      durability: audit records replicated across 3 failure domains before acknowledgment
      retention: 7 years for audit and grants (profile overrides per jurisdiction)
  T1: 
    name: Evidence integrity
    intent: "Intake, verification, disposition, ledger, evidence and closure. Losing or altering evidence is the failure that matters."
    failure_mode: queue-and-retry
    defaults: 
      availability: 99.5% monthly
      rpo: 0 from acknowledgment for ledger and evidence stores (the outbox holds work until the ack)
      rto: 4 hours
      consistency: strong for ledger and closure writes; immutable once written
      durability: object lock or WORM; 3 failure domains
      retention: 7 years for accepted evidence and dispositions; rejected and unresolved kept as long as accepted
  T2: 
    name: Orchestration
    intent: "Requests, workflow, dispatch, producers, context build and model access. Delays are acceptable; duplicate or phantom effects are not."
    failure_mode: queue-and-retry
    defaults: 
      availability: 99.5% monthly
      rpo: 5 minutes (workflow history is event-sourced)
      rto: 4 hours
      consistency: strong per workflow; at-least-once delivery with idempotency keys between services
      durability: replicated across 2 failure domains
      retention: 13 months for run records and model usage
  T3: 
    name: Best effort and analytics
    intent: "Evaluation, telemetry, sampling and dashboards. Gaps reduce what can be claimed; they never change what can be done."
    failure_mode: continue-without
    defaults: 
      availability: 99% monthly
      rpo: 24 hours
      rto: 2 business days
      consistency: eventual
      durability: "single region, daily backup"
      retention: 25 months (two annual cycles for comparison)
failure_modes: 
  fail-closed: The request is denied or the action does not start. No effect occurs. Callers see an explicit denial.
  queue-and-retry: Work waits durably and resumes on recovery. Nothing is lost; elapsed time grows.
  mark-unknown: "Missing or stale data is labeled unknown, never current. Consumers that need it refuse to proceed."
  degrade-to-manual: The step falls back to the recorded manual procedure for its fidelity rung.
  continue-without: "The loop continues; the gap is recorded (telemetry, sampling). Never used for a control."
  posture-from-policy: "Behavior when unavailable is the pre-decided, signed posture from s3.gate-failure-policy."
