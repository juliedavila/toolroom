# Acceptance fixtures for the status report tool (specification: spec-status-report.md).
# Each fixture lists its input files by path under the organization's root; a mapping is written as YAML and a
# string is written as is. "units.yaml" is a toy unit list, so the fixtures do not depend on the shipped units.
# The tool runs with the fixture's as_of (and period when given; otherwise the quarter of as_of).
# expect.exit is the exit status. expect.errors and expect.warnings list every message the run must produce, as
# "<code> <file>:<id>"; nothing else may appear. expect.report_written says whether org/status/<period>.md exists.
# expect.report lists facts the YAML block must show: phases keyed by phase number, stop_conditions keyed by id,
# other keys compared as given (a mapping checks only the keys listed; a list must match in length and order).
# expect.markdown_excludes lists text the written report must not contain; expect.markdown_contains lists text it must
# contain exactly (layout lines from the specification's Outputs).
# A fixture with "runs: 2" runs twice into the same root; both runs must give byte-identical reports and output.
# Every written report is also checked for: five phase rows, one status each, a reason starting with its rule,
# a proposed color only on green, yellow and red rows, recovery slots on every yellow row, and no hours anywhere in the report.
# Dates are made up and lie in the future. Every expected result comes from the specification and is reproduced by our
# reference implementation; exact values in the later fixtures were read from its output.

