  - {id: U-01, phase: 1, provides: [cap.a], requires: []}
  - {id: U-02, phase: 1, provides: [cap.b], requires: [cap.a]}
  - {id: U-03, phase: 1, provides: [cap.c], requires: []}
  - {id: U-04, phase: 2, provides: [cap.d], requires: [cap.b]}
