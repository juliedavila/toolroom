# Acceptance fixtures for the unit graph tool (spec-unit-graph.md). One entry per fixture under fixtures.
#
# Each fixture builds one unit list and one model, runs the tool, and compares the result with its expect block.
#   base: shipped   the shipped units.yaml with the shipped model.yaml
#   base: toy       the toy_units list below with the toy_model below
#   base: none      the fixture's own units list with the toy_model below
# The tool also reads a manual-work catalog and a premise register: the shipped manual-work.yaml and claims.yaml for
#   base: shipped, and toy_manual_work and toy_claims below for base: toy and base: none.
# edits: JSON Patch operations (RFC 6902: add, remove, replace) applied in order to the base unit list, with one
#   extension: a path segment written [key=value] selects the one list item whose key field equals value, for example
#   /[id=U-03]/contract. A selector that matches no item or more than one item is an error in the fixture. A trailing
#   - appends to a list, as in RFC 6902.
# exercises: a one-line description for people; no runner checks it.
# units: with base: none, the fixture's own unit list.
# org: the organization's unit changes (the org/units.yaml file), applied over the edited list as the tool applies them.
# repeat: run the tool this many times on the same inputs; every report must be identical.
# expect:
#   exit: the exit status (0 without errors, 1 with errors).
#   errors, warnings: findings written "<code> <unit or capability>: <text>". Each entry is the start of one finding
#     and must consume exactly one; the fixture passes only when every entry is consumed and no finding is left over.
#     An empty list means none.
#   report: a partial report. Every key given must equal the tool's report under unit_graph; mappings are compared
#     key by key at every depth, mappings inside lists included (only the keys given are compared); a list must match in
#     length and item by item, in order.

toy_model:
  elements:
    - id: t1.request-form
    - id: t2.run-ledger
    - id: t3.scanner
      module: tool-portfolio
    - id: t4.road-catalog
      module: paved-road
  contracts:
    - name: RequestCard
    - name: RunRecord

# A clean five-unit plan: no errors and no warnings.
toy_units:
  - id: U-01
    phase: 1
    seam: STEP-1
    kind: agreement
    flow_item: risk
    contract: RequestCard
    elements: [{id: t1.request-form, fidelity_from: none, fidelity_to: existing-tool}]
    provides: [cap.request]
    requires: []
    check: "The request card names three distinct owners."
    feedback_speed: next-loop-run
    independence_sensitive: true
    separates: [[proposer, approver]]
    contract_shape_ok: true
  - id: U-02
    phase: 1
    seam: STEP-2
    kind: measurement
    flow_item: debt
    contract: RunRecord
    elements: [{id: t2.run-ledger, fidelity_from: none, fidelity_to: stand-in}]
    provides: [cap.run-record]
    requires: [cap.request]
    check: "The ledger sheet holds one row per run."
    feedback_speed: minutes
    independence_sensitive: false
    contract_shape_ok: true
  - id: U-03
    phase: 2
    seam: STEP-1
    kind: code
    flow_item: feature
    relieves:
      - {manual_work: triage, effect: reduce, rests_on: TP-1, strength: weak, strength_reason: "A request without owners is refused at the API, so nobody chases owners by hand."}
    contract: RequestCard
    elements: [{id: t1.request-form, fidelity_from: existing-tool, fidelity_to: built}]
    provides: [cap.request-api]
    requires: [cap.request]
    check: "The request API rejects a card without owners."
    feedback_speed: minutes
    independence_sensitive: false
  - id: U-04
    phase: 2
    seam: STEP-4
    kind: code
    flow_item: risk
    module: tool-portfolio
    elements: [{id: t3.scanner, fidelity_from: none, fidelity_to: built}]
    provides: [cap.scan]
    requires: [cap.request-api]
    check: "The scanner runs only on an accepted request."
    feedback_speed: minutes
    independence_sensitive: false
  - id: U-05
    phase: 3
    seam: STEP-6
    kind: code
    flow_item: defect
    contract: RunRecord
    elements: [{id: t2.run-ledger, fidelity_from: stand-in, fidelity_to: built}]
    provides: [cap.verdict]
    requires: [cap.scan, cap.run-record]
    check: "Every verdict links its run record."
    feedback_speed: minutes
    independence_sensitive: false

# A toy manual-work catalog and a toy premise register, given to the tool for base toy and base none.
toy_manual_work:
  namespace: shared
  version: "1.0.0"
  manual_work:
    - {id: triage, name: Manual triage, description: "Sorting findings by hand.", flow_item: risk}
    - {id: retest, name: Manual retest, description: "Re-running a fixed attack by hand.", flow_item: risk}

toy_claims:
  claims:
    - {id: TP-1, statement: "A refused request costs less than a chased one.", verdict: holds, strength: moderate}
    - {id: TP-2, statement: "A claim the register dropped.", verdict: drop, strength: weak}
    - {id: TP-3, statement: "A claim graded in two halves.", verdict: honest bet, strength: "moderate (toil) / none (safety)"}

