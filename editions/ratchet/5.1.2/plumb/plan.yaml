phases:
  - id: PH-1
    order: 1
    name: The loop closes once
    exit_test: "One seeded weakness travels the whole loop by hand on existing tools: proposed, approved, run, reproduced independently, handed to the owning team with a reproducing test, a fix drafted by the security side and an owned regression gate (a blocking regression check the team owns), fixed, deployed, retested in the deployed state, and kept as a regression in the owning team's pipeline that fails when the fix is reverted. The map of how the loop works today records every attempt and every wait at a handoff, with effort reported as an estimate. The scripted no-agent comparison runs beside the agent, with a verdict per case on the scale the success criteria define, from a scorer the decision owner named in advance who is not the test operator. A feasibility test: it passes when the checks written before it starts hold (the loop closed, the fix independently verified, the regression test held) and the map, the scripted comparison and the per-case verdicts exist; a verdict against the agent does not fail it. The thresholds for later phases are set from its map before phase 2."
    rests_on:
      - CL-12
      - CL-17
  - id: PH-2
    order: 2
    name: The evidence can be trusted
    exit_test: "On a second real path, an automated check of the record passes only if: three different people proposed, held the proof condition and decided the outcome; changed, replayed and expired approvals caused zero effects; closure carries two human acceptances plus a machine record of what was deployed; the owning pipeline rejected a deliberate reintroduction; the detection check saw the test or recorded the gap; the scheduled canary closed; and the service's five DORA delivery metrics stayed within the agreed tolerance."
    rests_on:
      - CL-01
      - CL-12
      - CL-13
      - CL-20
  - id: PH-3
    order: 3
    name: "Ratchet is measured against today's process and a no-agent baseline"
    exit_test: "Over a set of comparable cases chosen before the first agent run, the report shows time, cost per accepted fix (estimated verification effort included) and false-acceptance rate for today's process, the no-agent arm and the agent arm, keeps failures in the denominator, and draws no conclusion below the agreed minimum number of fixes."
    rests_on:
      - CL-10
      - CL-26
      - CL-27
  - id: PH-4
    order: 4
    name: A second team runs it
    exit_test: A second team completes the loop with no change to the approval or acceptance rules beyond its own scope; a permission change in a source system marks dependent tests stale and replays them; a shared secure default blocks the reproduced weakness in a service that was never tested.
  - id: PH-5
    order: 5
    name: It works in production
    exit_test: "In an approved production profile, denied actions, a health pause with resume and a failed cleanup each run with no unapproved effect; tests that ran but were not seen by detection are reported separately; a change of model or tool sends the affected route back through its approval tests (qualification) before its next use."
    rests_on:
      - CL-20
