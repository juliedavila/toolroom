    rules: 
      proposal_not_permission: "A coding agent's change is a proposal: it merges only through the protected branch, with required checks run server-side that the agent cannot skip or reconfigure."
      proof_out_of_reach: "Narrower by design: checks sit out of the agent's edit reach, not out of its sight. A derived check reports pass or fail with a fixed message, and the kept regression, its variants and the retest stay inside the loop."
      intake_only: "Its checks and AI reviewers return leads; a deterministic check can place a defect only in the check-confirmed tier, and the reproduced tier needs a reproduction."
      independent_acceptance: "Narrower by design: one independent sign-off to merge. The author of a change is the agent together with the person whose session produced it, and whoever merges is neither."
    separations: 
      - between: "whoever merges a change, and its author (the agent and the person whose session produced it)"
        enforced_by: creation.author-merges
      - between: "the evaluation group that assigns the catch layer, and the secure-creation owner and the road owner"
        enforced_by: creation.catch-layer-conflicted
      - between: "reviewers of agent-written changes, and the team that reports their approval drift"
        enforced_by: creation.drift-reporter-is-reviewer
