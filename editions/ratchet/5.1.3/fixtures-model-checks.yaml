# fixtures-model-inputs.yaml sha256: 2e54d32b5afced8198340458a6b05d47ea52ce146890b5f98ec6c65743f67fef
# Acceptance fixtures for the model checks (spec-model-checks.md). One entry per fixture.
# Composition/source-patch/pin cases read the supplied fixtures-model-inputs.yaml bundle.
# It holds complete composition documents, explicit bound acceptance inputs and exact frozen pin bytes.
# Each fixture starts from the shipped edition files (model.yaml, realization.yaml, quality.yaml, failures.yaml,
# overlay-aws.yaml, modules.yaml), changes them as stated, and runs the checks on the result, given the model and the
# folder of layer files the way an organization gives its compiled model and layer.
# target: the file the edits change unless an edit names its own target.
# mode: full runs every check; core runs the model checks in core-only mode (optional modules removed).
# rename: optional, { old name: new name }, applied first (an organization's own overlay replaces overlay-aws.yaml).
# absent: optional, files removed before the checks run (a layer with no modules.yaml, for instance).
# edits: JSON Patch operations (RFC 6902: add, remove, replace) applied in order to the parsed YAML document of their
#   file, with two extensions. An edit may carry target, naming its file. A path segment written [key=value] selects
#   the one array item whose key field equals value, for example /elements/[id=s4.request-data-gate]/load_bearing.
#   Several conditions are separated by commas, for example /relationships/[from=a,to=b]/content. A selector that
#   matches no item or more than one item is an error in the fixture. A trailing - appends to an array.
# expect: every error the checks must report, as code and location. A fixture passes when the reported errors and the
#   entries match one to one (an empty list means zero errors).
# warnings: optional; warnings, as code and location, that must each be reported. Other warnings are not checked.
# Every fixture runs with --date 2026-12-01, so an exception's end is judged against a fixed date (edition 5.0.0).
# org: optional (edition 5.0.0); the organization's exceptions file, written as org.yaml beside the layer files and
#   passed with --org. marks: optional; contracts of the report's marks, each with the floor it must hold (rule codes,
#   order ignored) and whether it is relevant.
# judged: exact id lists, compared without regard to order. The four composition entries pin every reported set.
# Regenerate those four lists with the authors' pin generator; the small pins at the end have independent ids.
# shipped_edits: model edits applied to both the comparison baseline and the checked model before edits.
# The small pins replace whole documents with the empty JSON Pointer and supply matching layer documents.
