  - contract: ReleaseAttestation
    field: "An artifact with no attestation, a signature that does not verify against a current key reference whose purpose is release, provenance below Build Level 3, or a digest that differs from the attested one is never started or served. The local enforcement point checks this before anything starts in a cell, and the route registry before it pins a weights digest; the model gateway then serves only weights whose loaded digest matches that pin. Each release attestation carries a monotonically increasing release sequence number covered by the release signature. Release signatures and rollback authorizations verify only against a current key reference whose purpose is release. For release admission a cell is a stable logical execution destination, independent of its disposable image or enforcement process. The local enforcement point keeps that cell's highest verified release sequence, last consumed rollback number and sticky refusal ranges in durable storage outside the disposable cell; all survive restart, rebuild and restore. A new or rebuilt cell takes its first mark and rollback state from the release pipeline through authenticated provisioning, never from the first arriving release or an empty local store; unavailable or stale initialization refuses all starts. A rollback authorization is part of the release attestation and is signed by key management for the pipeline with purpose release; it names the cell, its highest verified sequence, the running sequence being rolled away from, the older target sequence and digest, a per-cell rollback number and the highest release sequence issued before this rollback. The enforcement point requires the target to be older than the running release and the rollback number to exceed the last consumed number, and atomically persists its consumption and the new refusal range before starting the target. A rollback never lowers the high-water mark and permanently refuses every previously issued release from its rolled-away-from sequence through its signed issued-through sequence, even with another rollback authorization. These refusal ranges accumulate; reusing that code at or above a rolled-away-from sequence requires the pipeline to issue a fresh release with a new sequence beyond the applicable refusal ranges and the high-water mark. Outside these ranges an older release still requires a matching unused rollback authorization; a missing, invalid, reused or non-increasing authorization is refused before any start."
    letter: T
    why: "The enforcement point verifies release-purpose signatures, provenance and digest before starting software or images. Its durable per-cell high-water mark, consumed rollback number and accumulated refusal ranges survive restart and rebuild; initialization comes from the pipeline. A rollback number must increase and is persisted before the target starts, preventing reuse at an unchanged mark. Sticky ranges refuse the rolled-away release and previously issued higher sequences on that cell; returning there requires a fresh release sequence. Withdrawal is per cell in this edition: a rolled-away release is refused on the stable logical cell that rolled back; another cell can still admit it. Fleet withdrawal needs a separate protocol in the next minor edition. The registry verifies release-purpose signatures and weights attestations before pinning, and the gateway checks the loaded digest against that pin. Key-reference delivery integrity is judged on the separate key-reference crossings, whose tampering cells remain open; post-admission revocation remains a known issue."
