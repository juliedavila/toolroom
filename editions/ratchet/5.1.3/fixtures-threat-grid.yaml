# Acceptance fixtures for the threat grid (specification: spec-threat-grid.md).
# base "shipped" runs on the edition folder's model.yaml, failures.yaml and threat-closures.yaml byte for byte;
# base "toy" runs on the toy documents below. "edits" change the base documents in order; an edited or toy document
# is written to a scratch folder and passed with its own option. "org_closures" and "org_sign_offs", when either is
# present, are written as the `closures` and `sign_offs` of one organization closure file, each as given;
# "org_document" is that whole file as given, in place of the two. "omit" leaves base files out of the run. Expected
# results were written from the specification. Toy ids and hashes that a YAML 1.1 reader could take for a boolean or
# a number are quoted.
# expect.exit, expect.errors and expect.warnings are in every fixture. errors and warnings list every message of that
# level, as a code or {code, location}, order ignored. expect.written lists what the run writes: register, summary or
# both; left out, it is [register, summary] when exit is 0 and [register] when exit is 1. counts, cells, controllers and
# closures are partial matches: cells by id (stride or stpa), controllers by id, closures by contract and letter; a list
# inside them matches a list of the same length item by item. absent lists ids no cell has. summary_contains lists
# whole lines of the summary.
# A sign-off's expects holds the hash of the rule's field and why: SHA-256 over the text written as a JSON string,
# first 12 lowercase hex digits. "Signed digest" 7cc07f6b964b; "The digest is signed." 6f942cc9cc15; "Signed by its
# sender." 24a3ed8a7a7e; "single use" f46bd45fd75c; "Plain record" b2b19d4dd565; "Recorded." 8a5cb3b8d84e; the escapes
# fixture's why d7a267f0bcdc (its JSON string escapes the quotes, the backslash, the tab and U+001B as \u001b); the
# shipped model-output rule's field "Never authority" 49c6c7344007 and its why dc6ce3241338.

toy:
  model:
    edition: toy
    elements:
      - { id: p, kind: person }
      - { id: q, kind: person }
      - { id: x, kind: service, trust_zone: a }
      - { id: z, kind: service, trust_zone: a }
      - { id: "y", kind: service, trust_zone: b }
      - { id: w, kind: store, trust_zone: b }
    contracts:
      - { name: K, description: "Signed digest and single use." }
      - { name: L, description: "Plain record." }
    relationships:
      - { id: r1, from: x, to: "y", kind: data, carries: [K] }
      - { id: r2, from: x, to: z, kind: data, carries: [K] }
      - { id: r3, from: p, to: x, kind: authorization, carries: [] }
      - { id: r4, from: "y", to: x, kind: feedback, carries: [L] }
      - { id: r5, from: x, to: "y", kind: control, carries: [K, L] }
      - { id: r6, from: x, to: w, kind: control }
      - { id: r7, from: q, to: p, kind: data, carries: [] }
  failures:
    scenarios:
      - { id: F1, elements: [x, "y"], invariant: I2 }
      - { id: F2, elements: [z], invariant: I5 }
      - { id: F3, elements: [x], invariant: I10 }
  closures:
    closures:
      - { contract: K, field: "Signed digest", letter: T, why: "The digest is signed.", reviewed: { by: "security reviewer", date: "2025-01-31" } }
      - { contract: K, field: "single use", letter: E, why: "It is used once.", reviewed: { by: "security reviewer", date: "2025-01-31" } }

