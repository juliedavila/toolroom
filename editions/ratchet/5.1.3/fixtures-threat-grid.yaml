        name: ReleaseAttestation
        value: "One release of Ratchet's own software, a runner or cell image, or a self-hosted model weights file: artifact kind, name and version, artifact digest; build provenance at SLSA Build Level 3 (the hosted, isolated build platform's identity, the source repository and revision, the build definition and its parameters, the dependencies resolved with their digests), generated and signed by the build platform and never by the build steps; a software bill of materials; the release signature with its key reference; the security risk owner's approval when the release widens what can run; and rollout stage and rollback reference. Ratchet's built parts follow the organization's own secure development requirements; the attestation records the requirement set each build was checked against. An artifact with no attestation, a signature that does not verify against a current key reference, provenance below Build Level 3, or a digest that differs from the attested one is never started or served. The local enforcement point checks this before anything starts in a cell, and the route registry before it pins a weights digest; the model gateway then serves only weights whose loaded digest matches that pin."
