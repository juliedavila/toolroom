    base: shipped
    edits:
      - op: set_contract_description
        name: shared:ProvenClass
        value: "The projection of a failure class for the secure-creation loop. Only classes with at least one independently reproduced member. It names the class, its definition and how many reproduced members it has, and the road entries and derived checks that answer it, which is what a coding agent needs to steer toward fixes that work. Its definition names no service, component, path or file of the organization's own; a third-party class names only the component and versions it is about, since that is the fix an agent needs. Where the class's findings sit (the services and components it spans) and how severe they are (the highest consequence tier its members reach) are sent only once every member's finding is closed: while any is open they would map open weaknesses in a store coding agents read. A class that gains an open member again sends its next version without them, and the loop keeps only the current version of each class. Carries no verdict reference, fixture-set reference, kept-regression id or finding text; a derived check names the kept test it came from by id, and the test itself never crosses. The policy-owning team turns each into a rule."
