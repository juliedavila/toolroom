    untested: true
    load: "Thesis item 4, catch-layer attribution by Ratchet's evaluation group (never by Jig), the policy-owning team turning proven classes into rules with a class test, the durable path from a proven, recurring class to a paved-road default and skill, and the reintroduction measures per retired class. The policy-owning team reads ClassTestTotals directly as people, never an agent; the suite and measurement plane receive only a binary rule result."
