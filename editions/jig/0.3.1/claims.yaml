  - id: JC-35
    statement: "A static or in-process check can be derived from a kept runtime test for the classes that matter, so derived checks reach the agent's turn; for authorization, where a flaw is a relation rather than a data flow, this is untested and may fail."
    type: engineering-practice
    premise_group: Interface with Ratchet
    verdict: honest bet
    strength: weak (pattern classes) / none (authorization)
    strength_reason: "Studies show checkers can be synthesized from known vulnerabilities and their fixes for a third to a half of cases, and one peer-reviewed system found many new kernel bugs; none derives a check from a runtime test, and for authorization a 2026 preprint argues and measures that fixed rules do not carry."
    untested: true
    load: "Interface point I2 (derived checks from Ratchet's regression catalog into the shared suite), the fast path where a derived check runs at the agent's turn, the fix handoff that gives the fixing agent the derived check, U-197 and the derived-check gaming watch (U-438)."
    falsifier: "Over Ratchet's first proven classes, few kept tests yield a derived check that catches the class's reproduced members, and none does for authorization classes."
    if_it_flips: "I2 stays empty for the classes it cannot serve, and those classes reach the agent only as proven classes, road entries and fix briefs; Ratchet's kept tests stay the only check that holds them."
    extrapolation: "From checkers synthesized from vulnerability records and patches to checks derived from Ratchet's kept runtime tests. The derived check is restricted to a general pattern, without kept-test inputs or expected behavior; the cited studies do not test that projection limit."
