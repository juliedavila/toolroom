# Jig edition 0.3.1. Organization profile template.
# Jig organization profile (starter). Copy it to org/jig-profile.yaml in the organization's workspace.
# Every answer is present and unanswered. Each answer is a record of its own:
#   value       the current answer, null while unanswered
#   evidence    one entry per source read, {source, date, found}, oldest first; add new readings, never overwrite
#   confirmed   {by, at}, filled only on a named person's explicit word; the agent never fills it
#   superseded  earlier confirmed values a person replaced, {value, confirmed, replaced_at}, kept as history
# Confirming one answer confirms that answer only. An unanswered answer is a gap, never an error.
# Edit this file in place: these comments carry the field help. A tool that parses the file and writes it back drops
# every comment; if one is used, say in the session report that the comments are lost and keep this template beside it.
# Quote every date as text in YYYY-MM-DD form, such as at: "YYYY-MM-DD". Some YAML readers turn a bare date into a date
# value, and the schema wants text; the profile check warns on each date written without quotes.
# profile-schema.yaml describes every field; workflow-seed.md and workflow-fill-profile.md say how to fill them, and the
# profile check shipped beside this file validates it (workflow-fill-profile.md gives the command).
profile:
  edition: null
  filled_by: null
  updated: null
# Jig alone: the roles that decide on design changes. With Ratchet, leave these null and use Ratchet's profile.
governance:
  security_risk_owner_role: {value: null, evidence: [], confirmed: null, superseded: []}
  business_risk_owner_role: {value: null, evidence: [], confirmed: null, superseded: []}
  patch_acceptor_roles: {value: null, evidence: [], confirmed: null, superseded: []}
  proposer_may_accept: false # fixed: whoever proposed a patch never accepts it
# One answer per entry. Add an entry for each class, language and build system found.
creation_surfaces:
  repository_classes: []
  languages: []
  build_systems: []
# One entry per coding agent in use. Replace this placeholder entry; keep the list empty if no agent is in use yet.
coding_agents:
  - name: null
    runs_where: {value: null, evidence: [], confirmed: null, superseded: []}
    # Hook answers: yes (it can run a check there and one is configured), none-configured (it can, and the slot is
    # empty), no (it cannot) or unknown (someone looked and could not tell).
    edit_hooks: {value: null, evidence: [], confirmed: null, superseded: []} # value: yes, none-configured, no or unknown
    turn_stop_hook: {value: null, evidence: [], confirmed: null, superseded: []} # value: yes, none-configured, no or unknown
