elements: 
  - id: secure-creation
    name: "Jig (secure creation at the developer's edit)"
    aliases: 
      - Secure-creation loop
      - Secure-creation companion
    system: shared:EXT
    level: container
    kind: external-system
    responsibility: "The organization's secure-creation loop, where developers and coding agents write code, drawn as its planes: the context plane that steers what the agent copies, the inner loop of the agent's turn, the commit and push boundary, the pull-request plane and the measurement plane. Ratchet is its learning plane. A sibling design that runs alone or beside this loop. Coding agents run inside it, so it is agent-reachable: it receives proven failure classes, road entries with a current assurance record, derived checks that report pass or fail and fix briefs, and never a kept regression, a proof condition, an expected-outcome hash or text an outsider wrote. Its controlled-environment premise is declared as assumptions, each with the parts that rely on it and a fallback that does not."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    owner: null
    module: secure-creation
    assumptions: 
      - id: managed-endpoints
        statement: "Developer endpoints are managed: device management, endpoint detection, data-loss prevention and governance of agents and editor extensions."
        relied_on_by: 
          - harness-full-parity
          - harness-no-pinning
          - harness-no-stop-gate
          - edit-checks
          - stop-gate
          - precommit-gate
        fallback: "Rule 2 falls back to the server-side required checks: a local check that was skipped or reconfigured is caught at the protected branch, where rule 1 also holds."
        fallback_by: 
          - protected-branch
      - id: mirrored-dependencies
        statement: "Developers and their build jobs install dependencies only through the organization's mirrors."
        relied_on_by: 
          - p55-r8
          - stop-gate
        fallback: "The dependency policy runs again in the server-side required checks against the mirror's admission record, so a dependency from outside the mirror fails before merge."
        fallback_by: 
          - protected-branch
      - id: code-from-engineers
        statement: "Code in the organization's repositories arrives only from its own engineers, through the protected branch."
        relied_on_by: 
          - p55-r8
        fallback: "Text from an outside contributor is outsider text: it reaches the coding agent only through the quarantined reader, and the change still merges only through the protected branch with an independent reviewer."
        fallback_by: 
          - quarantined-reader
          - reader-schema-gate
          - protected-branch
      - id: locked-policy
        statement: Policy files and hook configuration are delivered and locked centrally on every endpoint.
        relied_on_by: 
          - harness-full-parity
          - harness-no-pinning
          - harness-no-stop-gate
          - edit-checks
          - stop-gate
          - precommit-gate
        fallback: The same suite at the same versions runs as server-side required checks that the agent cannot skip or reconfigure.
        fallback_by: 
          - protected-branch
          - check-suite
  - id: context-plane
    name: "Context plane: paved-road guidance and skills"
    aliases: 
      - Jig context plane
    system: shared:EXT
    level: component
    parent: secure-creation
    kind: registry
    responsibility: "What the coding agent copies from: paved-road references in the codebase, a skill per paved road, short instruction files under code ownership, the security constraints written into the task's spec for high-risk work, and the diff-size budget per task. Steers toward proven classes and toward road entries whose assurance record is current. Holds proven classes until the policy-owning team turns each into a rule. Guidance only: instruction files are hygiene and enforce nothing. It keeps only the current version of each proven class, replacing any earlier spans and consequence tier when a class gains an open member. It exposes road assurance per entry version only as current or not current, with no class outcomes or failure or withdrawal reasons. The model provider is a reader through the coding agent's model route, and guidance sent on that route obeys the same projection limits."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    unpartitioned: "Holds guidance (road references, skills, instruction files, spec constraints and proven classes as projected for this loop), never evidence content"
    owner: Policy-owning team
    module: secure-creation
  - id: check-suite
    name: Shared check suite and policy source
    aliases: 
      - One policy source
      - Jig check suite
    system: shared:EXT
    level: component
    parent: secure-creation
    kind: registry
    responsibility: "The one policy source, compiled into every harness's locked configuration, the git hooks and the server-side required checks, so the same checks at the same versions run at every point from the agent's turn to the pull request. Holds the rules (type checks, linters, diff-scoped analysis, secret scanning, dependency policy, authorization-pattern rules), the derived checks Ratchet sends, and each rule the policy-owning team turned from a proven class with its class test. Logs every derived check it drops or disables. It gates on a rule turned from a proven class only once a class test at the rule's version has passed (the rule caught every member it ran against, and ran against at least one), and until then the rule steers and reports. It receives only rule id, rule version and pass or fail for each class test, and passes only that binary result to the measurement plane; no per-class counts reach it."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    unpartitioned: "Holds rules, check versions and binary class-test results, never per-class counts or evidence content"
    owner: Policy-owning team
    module: secure-creation
  - id: inner-loop
    name: "Inner loop: the agent's turn"
    aliases: 
      - Jig inner loop
    system: shared:EXT
    level: container
    parent: secure-creation
    kind: service
    responsibility: "Where the coding agent works in a developer's session, inside a harness, with findings returned to the agent while it is still working and a gate before it may end its turn."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    owner: Policy-owning team
    module: secure-creation
  - id: coding-agent
    name: Coding agent session
    aliases: 
      - Coding agent
    system: shared:EXT
    level: component
    parent: inner-loop
    kind: service
    responsibility: "Writes code in a developer's session. Reads repository code and mirrored dependencies, the context plane, the findings of the per-edit checks and the stop gate, fix briefs, and typed answers from the quarantined reader. It reads no outsider text itself: issue text, web pages and dependency documentation go to the reader. Its changes are proposals that merge only through the protected branch. Its egress goes only to approved model routes and the organization's mirrors."
    role_class: producer
    trust_zone: shared:existing
    agent_reachable: true
    holds_nonpublic: true
    owner: Engineering owners (the developer whose session runs it)
    module: secure-creation
  - id: harness-full-parity
    name: Coding harness with full parity (example)
    aliases: 
      - Harness example
      - full parity
    system: shared:EXT
    level: component
    parent: inner-loop
    kind: service
    responsibility: "A worked example of a coding harness that runs the agent under a locked managed policy, with blocking hooks, a stop gate, full session telemetry linked to each commit, and a pinned version."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    harness: 
      stop_gate: true
      telemetry_export: full
      version_pinning: true
      blocking_hooks: true
    owner: Policy-owning team
    module: secure-creation
  - id: harness-no-pinning
    name: Coding harness without version pinning (example)
    aliases: 
      - Harness example
      - no version pinning
    system: shared:EXT
    level: component
    parent: inner-loop
    kind: service
    responsibility: "A worked example of a coding harness with locked requirements, hooks and a stop gate, partial session telemetry and no way to pin its own version, so the server-side run of the suite is the version of record for its changes."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    harness: 
      stop_gate: true
      telemetry_export: partial
      version_pinning: false
      blocking_hooks: true
    owner: Policy-owning team
    module: secure-creation
  - id: harness-no-stop-gate
    name: Coding harness without a stop gate (example)
    aliases: 
      - Harness example
      - no stop gate
    system: shared:EXT
    level: component
    parent: inner-loop
    kind: service
    responsibility: "A worked example of a coding harness with blocking hooks, no stop gate and no telemetry export. The same suite runs at commit through the locked pre-commit gate in place of the stop gate, and its changes count as unlabeled in every provenance measure."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    harness: 
      stop_gate: false
      telemetry_export: none
      version_pinning: false
      blocking_hooks: true
      stop_gate_compensated_by: precommit-gate
    owner: Policy-owning team
    module: secure-creation
  - id: edit-checks
    name: Per-edit checks
    system: shared:EXT
    level: component
    parent: inner-loop
    kind: service
    responsibility: "Type checks, linters, fast secure-pattern rules and the derived checks that fit the per-edit budget, run on each edit with the results returned to the agent's context. A derived check reports pass or fail and its fixed message only."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    decision: deterministic
    owner: Policy-owning team
    module: secure-creation
  - id: stop-gate
    name: Stop gate
    system: shared:EXT
    level: component
    parent: inner-loop
    kind: service
    responsibility: "Holds the agent's turn open until the deterministic suite passes on its diff: tests, diff-scoped analysis, secret scanning, the dependency policy against the mirror, authorization-pattern rules and derived checks."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    decision: deterministic
    owner: Policy-owning team
    module: secure-creation
    not_harness: "Holds the coding agent's turn open until the deterministic suite passes on its diff, and sends the agent only the suite's result; it runs no agent session of its own, so it has no harness parity to declare."
  - id: quarantined-reader
    name: Quarantined reader for outside text
    aliases: 
      - Jig quarantined reader
    system: shared:EXT
    level: component
    parent: secure-creation
    kind: service
    responsibility: "The only place in the loop where outside text is read by a model: issue and review text, web pages, public issue threads and dependency documentation. A tool-less model session with no repository access, no write path and no shared context with the coding agent. It answers the agent's typed question in the question's schema, and its answer reaches the agent only through the reader's schema gate."
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: reader-schema-gate
    name: Reader schema gate
    system: shared:EXT
    level: component
    parent: secure-creation
    kind: gateway
    responsibility: "Validates each reader answer against its question's schema with no model call, and passes only typed fields: package and version identifiers, API names and signatures, error codes and links. Prose does not pass; an agent that needs prose from outside asks the developer, who reads it."
    role_class: existing
    trust_zone: shared:existing
    decision: deterministic
    owner: Policy-owning team
    module: secure-creation
  - id: model-routes
    name: Model routes for coding agents and reviewers
    system: shared:EXT
    level: component
    parent: secure-creation
    kind: external-system
    responsibility: "The approved model endpoints the harnesses, the AI reviewer, triage, the hunk-risk advisor and autofix call, each call in its own session. No outside text reaches these sessions, so a response carries no outsider label. The quarantined reader calls a route of its own."
    role_class: existing
    trust_zone: shared:third-party
    owner: null
    module: secure-creation
  - id: reader-model-route
    name: Model route for the quarantined reader
    system: shared:EXT
    level: component
    parent: secure-creation
    kind: external-system
    responsibility: "The model route the quarantined reader calls, kept apart from the routes the coding agent and the reviewers call: its own credentials and sessions, no tools, no knowledge base and no context shared with any other session. Its requests carry outside text, so every response it returns keeps the outsider label of the request it answers."
    role_class: existing
    trust_zone: shared:third-party
    owner: null
    module: secure-creation
  - id: repository
    name: Repositories and mirrored dependencies
    system: shared:EXT
    level: component
    parent: secure-creation
    kind: store
    responsibility: "The organization's repositories as merged through the protected branch, and the dependencies admitted to its mirrors, as the session's checkout sees them."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    partitioned_by: 
      - repository
      - branch
    owner: Engineering owners
    module: secure-creation
  - id: change-boundary
    name: Commit and push boundary
    system: shared:EXT
    level: container
    parent: secure-creation
    kind: service
    responsibility: "Where each change is checked again with the same suite, stamped with its provenance and proposed for merge."
    role_class: existing
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: precommit-gate
    name: Locked pre-commit gate
    system: shared:EXT
    level: component
    parent: change-boundary
    kind: service
    responsibility: "Runs the same suite at the same versions on each commit, from a hook path set and locked by endpoint management. For a harness without a stop gate, it is where the suite runs in the stop gate's place."
    role_class: existing
    trust_zone: shared:existing
    agent_reachable: true
    decision: deterministic
    owner: Policy-owning team
    module: secure-creation
  - id: provenance-stamper
    name: Provenance stamper
    system: shared:EXT
    level: component
    parent: change-boundary
    kind: service
    responsibility: "Attaches a signed provenance stamp to each change from the harness's session telemetry: tool and version, model and version, session and skill-bundle hash. A change from a harness that exports no telemetry carries no stamp and counts as unlabeled. The stamp feeds measurement and routing and grants no trust."
    role_class: existing
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: protected-branch
    name: Protected branch and server-side required checks
    system: shared:EXT
    level: component
    parent: change-boundary
    kind: service
    responsibility: "The only way a change merges: the same suite runs server-side as required checks that the agent cannot skip or reconfigure, and a person who is neither the agent nor its session's developer approves and merges. High-risk hunks also need the sign-off of a qualified person outside the authoring team. Its settings are a requirement, and a declared premise with a test and a fallback: each required check is tied to the app that reports it, the rule is enforced for repository administrators, and no agent identity holds administrator rights or any way to set a check's status. The backstop for a skipped local check and the fallback for every endpoint assumption."
    role_class: existing
    trust_zone: shared:existing
    decision: deterministic
    owner: Policy-owning team
    module: secure-creation
  - id: pr-plane
    name: Pull-request plane
    system: shared:EXT
    level: container
    parent: secure-creation
    kind: service
    responsibility: "Deep checks on each proposed change and focused human attention: diff-scoped analysis, model triage, review by a second model family, routing of hunks by risk, and autofix that shows only validated patches."
    role_class: existing
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: pr-analysis
    name: Diff-scoped deep analysis
    system: shared:EXT
    level: component
    parent: pr-plane
    kind: service
    responsibility: "Runs deep data-flow analysis scoped to the diff of each proposed change, with no model call. Its findings are leads, held to an effective false-positive rate under the bar the organization sets."
    role_class: existing
    trust_zone: shared:existing
    decision: deterministic
    owner: Policy-owning team
    module: secure-creation
  - id: pr-triage
    name: Model triage of pull-request findings
    system: shared:EXT
    level: component
    parent: pr-plane
    kind: service
    responsibility: "Labels each analysis finding for the reviewer's view. A label orders what the reviewer reads first; it never removes a finding from a hunk routed to a person, and it travels to Ratchet as a label on the lead."
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: ai-reviewer
    name: AI reviewer from a second model family
    system: shared:EXT
    level: component
    parent: pr-plane
    kind: service
    responsibility: "Reviews each diff with a model family other than the author's. Its comments are leads and never the independent review."
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: hunk-router
    name: Hunk router
    system: shared:EXT
    level: component
    parent: pr-plane
    kind: service
    responsibility: "Routes each hunk by rule, with no model call: a hunk whose paths, owners or rule matches touch authorization, cryptography, data access or money goes to a qualified person with the spec and findings attached, and every other hunk goes to the lighter pass. The hunk-risk advisor may add hunks to the human route; nothing it sends can move a hunk off it."
    role_class: existing
    trust_zone: shared:existing
    decision: deterministic
    routes_by_rule: true
    owner: Policy-owning team
    module: secure-creation
  - id: hunk-risk-advisor
    name: Hunk-risk advisor
    system: shared:EXT
    level: component
    parent: pr-plane
    kind: service
    responsibility: "A model that reads the hunks the rules left on the lighter pass and names any it judges high-risk, with its reason. Its output can only add a hunk to the human route."
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: autofix
    name: Autofix
    system: shared:EXT
    level: component
    parent: pr-plane
    kind: service
    responsibility: Proposes patches for analysis findings and abstains when unsure. Shows a patch only when the suite passes on the patched diff; the reviewer decides whether to apply it.
    role_class: producer
    trust_zone: shared:existing
    owner: Policy-owning team
    module: secure-creation
  - id: measurement-plane
    name: Measurement plane and layer log
    system: shared:EXT
    level: component
    parent: secure-creation
    kind: service
    responsibility: "Logs where each layer caught what, sends findings to Ratchet as leads before triage with the dropped-check log, and reports outcomes to the people who decide: escaped defects per change by origin on the reproduced tier, reviewer approval drift, catch rate per layer and per rule, each on cohorts whose reproduction window has closed. The layer that should have caught each defect comes from Ratchet's evaluation group, never from this plane. It shows the policy-owning team each derived check's misses against its floor as Ratchet counted them, beside its own log of checks dropped or disabled; it never receives which changes missed or what a replay found. For class tests it receives and reports only rule id, rule version and pass or fail, never per-class counts; those go from the regression catalog directly to the policy-owning team: people, never an agent."
    role_class: existing
    trust_zone: shared:existing
    decision: deterministic
    owner: Secure-creation measurement owner (outside the reviewer teams)
    module: secure-creation
  - id: outside-text
    name: Text from outside the organization
    system: shared:EXT
    level: external
    kind: external-system
    responsibility: "Web pages, public issue threads and dependency documentation that a coding session needs to consult. Anyone may have written it."
    role_class: existing
    trust_zone: shared:third-party
