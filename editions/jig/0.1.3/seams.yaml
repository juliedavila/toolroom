  modules: 
    never_cross: 
      - contract: ratchet:OracleSpec
        what: proof conditions
      - contract: ratchet:RegressionSpec
        what: kept regressions; only a derived check crosses in their place
      - contract: ratchet:FailureClass
        what: failure classes in full; only the projection ProvenClass crosses
      - contract: ratchet:RoadAssurance
        what: road assurance in full; only the projection RoadAssuranceStatus crosses
      - contract: ratchet:ClassTestResult
        what: "the full class-test result; only pass or fail per rule version reaches agent-reachable parts and a separate totals projection goes directly to the policy-owning team: people, never an agent"
      - contract: ratchet:ReplayVerdict
        what: replay results; only the count of misses per derived check crosses
      - contract: ratchet:KeptTestStatus
        what: "kept-test status: lanes, runs, verdicts and re-proof results"
  threat-closures: 
    closures: 
      - contract: DerivedCheck
        field: "Its pattern is the body the check suite compiles into configuration coding agents can read, so it holds a general pattern for the weakness class the kept test holds, never the kept test's input, its fixtures or the boundary behavior it expects."
        letter: I
        why: "The agent-readable body holds only a general weakness-class pattern. The catalog excludes the kept test's input, fixtures and expected behavior; the fixed message excludes expected outcomes, and no proof condition or expected-outcome hash crosses."
      - contract: ProvenClass
        field: "Its definition names no service, component, path or file of the organization's own. While any member finding is open, the projection shows the class's existence, definition and fix rule, with no member count, services or components spanned, or highest consequence tier. A third-party class names the component without its versions until a fix exists. Per-class member counts are never carried in this projection, including after every member closes; they go only to the policy-owning team: people, never an agent, never to an agent-reachable part or the model route. Spans and highest consequence tier are sent only once every member's finding is closed; a class that gains an open member again sends its next version without them, and the loop keeps only the current version of each class. The model provider is a reader through the coding agent's model route, so the same limits apply to what reaches it."
        letter: I
        why: "Class projections carry no per-class counts at any closure state. The catalog sends only pass or fail per rule version to the check suite and measurement plane, and sends counts directly to the policy-owning team: people, never an agent; no counts reach agent-reachable parts or the model route. Open-class projections withhold spans and consequence tier, and third-party component versions stay withheld until a fix exists. The context plane keeps only the current projection version, whose bump conditions are explicit. These are delivery bounds on the projections; separately authorized fixing briefs and version history can still support inference. A derived check may name its source test by id, but its content stays protected. The definition's bound is a producer duty; its send-time check remains a known issue."
        reviewed: 
          by: design owner
          date: 2026-10-27
      - contract: RoadAssuranceStatus
        field: "For each entry version its status is current or not current, with no class outcomes and no reason for a status change, including a failed vetting or a withdrawal after a leak. Its vetted scope and known limits use API and configuration identifiers and named pattern classes, never an input shape or sequence. They never hold a test's input, fixture content, expected outcome or a bypass description."
        letter: I
        why: "This record directly discloses only current or not-current per entry version, with no class outcomes or failure or withdrawal reason. Scope and known limits directly disclose API and configuration identifiers and named pattern classes, never input shapes or sequences, test inputs, fixture content, expected outcomes or bypass descriptions. Fixture and verdict references and road-level regression results stay out of this record. The canary scans the sent record, context guidance and model prompts for protected literals. The rule covers direct disclosure by this projection; it does not close inference from status timing joined with class-version changes, road entries or dropped road claims."
