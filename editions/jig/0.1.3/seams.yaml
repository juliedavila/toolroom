  - name: ProvenClass
    owners: 
      - side: ratchet:s5.failure-class-registry
        role: Evidence/findings product + security/risk owners
        identity: null
      - side: jig:context-plane
        role: Policy-owning team
        identity: null
      - side: jig:people.creation-policy-owner
        role: Policy-owning team
        identity: null
    description: "The projection of a failure class for the secure-creation loop. Only classes with at least one independently reproduced member. It names the class, its definition and fix rule, and the road entries and derived checks that answer it. Its definition names no service, component, path or file of the organization's own. While any member finding is open, the projection shows the class's existence, definition and fix rule, with no member count, services or components spanned, or highest consequence tier. A third-party class names the component without its versions until a fix exists. Per-class member counts are never carried in this projection, including after every member closes; they go only to the policy-owning team: people, never an agent, never to an agent-reachable part or the model route. Spans and highest consequence tier are sent only once every member's finding is closed; a class that gains an open member again sends its next version without them, and the loop keeps only the current version of each class. The model provider is a reader through the coding agent's model route, so the same limits apply to what reaches it. Carries no verdict reference, fixture-set reference, kept-regression id or finding text; a derived check names the kept test it came from by id, and the test itself never crosses. The policy-owning team turns each into a rule. A class's projection version increases when its definition, fix rule, fix availability, road claims, derived-check references, weakness identifiers or disclosed spans or consequence tier change, or when it enters or leaves the all-members-closed state; membership changes while already open do not by themselves increase that version."
    produced_by: 
      - ratchet:s5.failure-class-registry
    consumed_by: 
      - jig:context-plane
      - jig:people.creation-policy-owner
    module: secure-creation
    fields: 
      - name: class_id
        type: id
        required: true
      - name: version
        type: integer
        required: true
        description: "A class's projection version increases when its definition, fix rule, fix availability, road claims, derived-check references, weakness identifiers or disclosed spans or consequence tier change, or when it enters or leaves the all-members-closed state; membership changes while already open do not by themselves increase that version."
      - name: kind
        type: enum
        values: 
          - first-party-pattern
          - third-party-component
        required: true
      - name: definition
        type: text
        required: true
        description: "The invariant the members violate; names no service, component, path or file of the organization's own. A third-party class names the component without its versions until a fix exists."
      - name: fix_rule
        type: text
        required: true
        description: "The rule that fixes the class's invariant, available while members are open; names no service, component, path or file of the organization's own, and no third-party component versions until a fix exists"
      - name: services_spanned
        type: list
        of: id
        required: false
        description: "Sent only once every member's finding is closed"
      - name: components_spanned
        type: list
        of: id
        required: false
        description: "Sent only once every member's finding is closed"
      - name: max_consequence_tier
        type: id
        required: false
        description: "Sent only once every member's finding is closed"
      - name: road_claims
        type: list
        of: object
        required: true
        description: Road entries claiming to retire the class
        fields: 
          - name: road_entry_id
            type: id
            required: true
          - name: road_entry_version
            type: string
            required: true
          - name: closure_state
            type: enum
            values: 
              - path-broken
              - constraint-enforced
            required: true
      - name: derived_check_ids
        type: list
        of: id
        required: true
      - name: cwe_ids
        type: list
        of: string
        required: false
        description: "CWE weakness ids, set or changed only by the disposition reviewer"
    failure_scenarios: 
      - id: F134
        title: An open class exposes member counts or component versions to coding agents
        elements: 
          - ratchet:s5.failure-class-registry
          - jig:context-plane
          - jig:coding-agent
          - jig:model-routes
          - jig:people.creation-policy-owner
          - jig:check-suite
          - ratchet:s6.regression-catalog
          - jig:measurement-plane
        trigger: "A class projection or class-test report leaks per-class counts into an agent-reachable part or the model route, an open class exposes spans or consequence tier, a third-party class names component versions before a fix exists, or the context plane keeps withdrawn fields."
        required_behavior: "Class projections carry no per-class counts, even after every member closes. The catalog keeps full class-test results, sends the suite only pass or fail per rule version, and sends per-class totals directly to the policy-owning team: people, never an agent. The suite and measurement plane hold no per-class counts and forward only that binary outcome; the owner never republishes totals into agent-readable rules, guidance, reports or prompts. An open class exposes existence, definition and fix rule, with no spans or consequence tier; third-party component versions stay withheld until a fix exists. On reopening, the next version removes the gated fields and replaces the context copy. Projection versions follow the declared public-change and closure-state conditions."
        invariant: I2
        detection: "Per-class counts in class projections, suite storage, measurement storage, agent-readable owner reports or model-route prompts (must be zero); full results in agent-reachable parts (must be zero); component versions before a fix or stale gated fields in current guidance (must be zero)."
        runbook: RB-F134
        test: 
          kind: pipeline
          steps: "Project first-party and third-party classes with independently reproduced open members and no third-party fix; inspect the sent projection, current context copy, suite, measurement plane, owner guidance and model-route prompts for absent counts, spans and consequence tiers, with the third-party component named without versions. Run class tests with all caught, a miss, some members not runnable and zero runnable members; only all runnable members caught with at least one tested passes. Across these tests inspect the catalog's full results and direct totals to the policy-owning team: people, never an agent; assert accurate counts only on that direct route and only rule id, rule version and pass or fail reach the suite, measurement plane and their reports, with no tested, caught, not-run or member total, finding text or location. Assert the owner keeps totals out of published rules, guidance and model prompts. Add a fix and allow its version in the fix rule. Close every member; spans and tier may cross but counts still cannot. Reopen a member; the next projection removes spans and tier and replaces the context copy. Change the definition, fix rule, fix availability, road claim, derived-check reference, weakness identifier and disclosed span or tier in turn and assert a version increase; add another member while already open without a public change and assert no version increase solely for that membership change. Previously sent guidance cannot be recalled."
    security: 
      relevant: true
      floor: 
        - MC-23
        - MC-102
  - name: RoadAssuranceStatus
    owners: 
      - side: ratchet:s5.road-assurance-record
        role: Evidence/findings product + independent verifier
        identity: null
