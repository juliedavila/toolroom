  - name: DerivedCheck
    owners: 
      - side: ratchet:s6.regression-catalog
        role: Domain test team + CI/context owners
        identity: null
      - side: jig:check-suite
        role: Policy-owning team
        identity: null
    description: "The only form in which a kept regression reaches a part where coding agents run; the kept regression itself stays in the loop. Static or in-process only: a runtime replay never yields a derived check. Its pattern is the body the check suite compiles into configuration coding agents can read, so it holds a general pattern for the weakness class the kept test holds, never the kept test's input, its fixtures or the boundary behavior it expects. The fixed message is set when the check is derived and never states the expected boundary behavior or an expected outcome. Carries no expected-outcome hash, no proof condition and no text an outsider wrote."
    produced_by: 
      - ratchet:s6.regression-catalog
    consumed_by: 
      - jig:check-suite
    module: secure-creation
    fields: 
      - name: check_id
        type: id
        required: true
      - name: version
        type: integer
        required: true
      - name: derived_from_test_id
        type: id
        required: true
      - name: derived_from_test_version
        type: integer
        required: true
      - name: execution_class
        type: enum
        values: 
          - static
          - in-process
        required: true
      - name: pattern
        type: text
        required: true
        description: "A general pattern for the weakness class, set when the check is derived; never the kept test's input, fixtures or expected behavior"
      - name: expected_runtime_ms
        type: integer
        required: true
      - name: result
        type: enum
        values: 
          - pass
          - fail
        required: true
      - name: message
        type: string
        required: true
        description: Fixed when the check is derived
    failure_scenarios: 
      - id: F129
        title: The coding agent learns to pass a derived check while the weakness stays
        elements: 
          - jig:check-suite
          - jig:coding-agent
          - ratchet:s6.regression-catalog
          - jig:measurement-plane
        trigger: "The agent sees a derived check's pass or fail and its fixed message, and changes the code's shape until the check passes without fixing the weakness the kept test holds."
        required_behavior: "Passing a derived check never counts as the weakness fixed. The kept test's replay still runs on the deployed change; its failure is a reintroduction in that class and a miss recorded against the derived check. A derived check whose misses pass its floor, which the security risk owner sets, goes to the policy-owning team, who retires it from the check suite; a request back to Ratchet to rework it is not drawn in this edition. Only the count of misses per derived check is sent to the loop; replay detail beyond the pipeline stage's pass or fail never reaches it."
        invariant: I2
        detection: "Per derived check, changes that passed it and later failed the kept test's replay (misses), against the check's floor; misses per class on and off the road."
        runbook: RB-F129
        test: 
          kind: pipeline
          steps: "Open a seeded change that satisfies a derived check's pattern while keeping the runtime weakness; assert the derived check passes, the kept test's replay fails the deployed change, the reintroduction counts in its class, and the miss is recorded against the derived check."
    security: 
      relevant: true
      floor: 
        - MC-23
        - MC-102
