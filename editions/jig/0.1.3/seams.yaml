    system: EXT
    level: external
    kind: external-system
    responsibility: PR / CI / ticket / release / rollback. These remain the change and deployment path.
    role_class: existing
    trust_zone: existing
    owner: Engineering system owner
    assumptions: 
      - id: regression-stage-unread
        owners: 
          - side: shared:ext.engineering-workflows
            role: Engineering system owner
            identity: null
          - side: ratchet:s6.enterprise-adapters
            role: Platform integration owner
            identity: null
          - side: shared:p14-r12
            role: Platform integration owner
            identity: null
          - side: shared:p14-r12
            role: Engineering system owner
            identity: null
          - side: ratchet:p24-r2
            role: Policy/IAM + execution-cell/SRE team
            identity: null
          - side: ratchet:p24-r2
            role: Platform integration owner
            identity: null
          - side: ratchet:s6.regression-catalog
            role: Domain test team + CI/context owners
            identity: null
          - side: ratchet:s6.retest-regression-planner
            role: Domain test team + CI/context owners
            identity: null
        statement: "Coding agents cannot read the regression stage's tests, expected outcomes, window bundle or logs, or any result beyond pass or fail: in the pipeline that runs a kept regression, an agent's session, and any job an agent can start or change, is refused when it reads any of them."
        relied_on_by: 
          - ratchet:s6.enterprise-adapters
          - p14-r12
          - ratchet:p24-r2
        fallback: "Kept regressions leave the owning pipeline and run only in Ratchet's own replay: the regression catalog takes every kept test out of the pipeline's stage, and the retest planner runs each one in Ratchet's execution cells under the normal authorization envelope on every change that touches its declared dependencies. No test, expected outcome or log then sits where an agent can read it. Until the premise holds again, the pipeline no longer holds a deploy on a kept test, so a reintroduction is found after the deploy."
        fallback_by: 
          - ratchet:s6.regression-catalog
          - ratchet:s6.retest-regression-planner
        failure_scenarios: 
          - id: F132-premise
            title: A coding agent can read the regression stage in the engineering system
            elements: 
              - ext.engineering-workflows
            trigger: "A permission change, a new pipeline runner, or a job an agent can start or change gives an agent's session read access to the regression stage's test definitions, its window bundle, its results beyond pass or fail, or its logs."
            required_behavior: "The engineering system owner's test of the premise fails and the premise is recorded as not holding."
            invariant: I2
            detection: "The engineering system owner's test of the premise, run whenever the pipeline's permissions change and on a schedule: a planted agent session tries to read a canary kept test's definition, its window bundle, its result and its log, and every read but the stage's pass or fail must be refused."
            runbook: RB-F132
            test: 
              kind: game-day
              steps: "In a test pipeline, grant a test agent session read access to the regression stage's logs; assert the premise test fails and the premise is recorded as not holding."
        claim: shared:SH-2
      - id: branch-settings-hold
        owners: 
          - side: shared:ext.engineering-workflows
            role: Engineering system owner
            identity: null
          - side: jig:protected-branch
            role: Policy-owning team
            identity: null
          - side: jig:people.change-reviewer
            role: Reviewer who merges agent-written changes
            identity: null
        statement: "The protected branch's settings hold against the agent's own credentials: every required check is tied to the app that reports it, the rule is enforced for repository administrators, and no agent identity holds administrator rights or any way to set a check's status. Some platforms let anyone with write access set a check's status, and let administrators skip required checks, unless these settings are switched on."
        relied_on_by: 
          - jig:protected-branch
        fallback: "Merging moves to a path the agent's credentials cannot reach: a merge service the engineering system owner runs under an identity no agent holds, which merges only after the checks pass server-side and a person who is neither the agent nor its session's developer approves. Until the premise holds again, no change merges from a path an agent credential can reach."
        fallback_by: 
          - ext.engineering-workflows
          - jig:people.change-reviewer
        failure_scenarios: 
          - id: F133-premise
            title: "An agent's credentials can skip a required check or set its status on the protected branch"
            elements: 
              - ext.engineering-workflows
            trigger: "A branch rule is changed so required checks no longer bind administrators, a check stops being tied to the app that reports it, or an agent identity gains administrator rights or write access that lets it post a check's status."
            required_behavior: "The engineering system owner's test of the premise fails and the premise is recorded as not holding."
            invariant: I1
            detection: "The engineering system owner's test of the premise, run whenever the branch settings change and on a schedule: with an agent's credentials, push a planted change that skips the local hook and sets its required check's status; the change must still fail to merge, and any merge is a failed test."
            runbook: RB-F133
            test: 
              kind: game-day
              steps: "With the agent's own credentials, try to bypass the hook and post passing required-check statuses; assert the protected branch refuses the merge, then switch one setting off and assert the premise test fails and the premise is recorded as not holding."
        claim: jig:JC-27
