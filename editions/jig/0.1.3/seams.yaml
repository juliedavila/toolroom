  - name: TrackerText
    module: secure-creation
    audience: restricted
    description: "Issue and review text from the organization's engineering system: an issue, a comment on one, a change's description or a review comment, with the ids that place it. Anyone the tracker lets write, people outside the organization included, can write the title and the body, so both are marked untrusted. Restricted to its one reader, the quarantined reader: a coding agent never reads it, and receives only the reader's typed answer through the reader's schema gate."
