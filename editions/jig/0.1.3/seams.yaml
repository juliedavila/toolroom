layers: 
  realization: 
    version: 1
    planes: 
      integration: "Adapters to the organization's tracker, CI/CD, IAM, change management, SIEM, and external systems."
    elements: 
      ext.engineering-workflows: 
        plane: integration
        class: "The organization's tracker, SCM, CI/CD and change management"
        examples: 
          []
        swap_point: false
        existing_tool_default: true
  quality: 
    elements: 
      {}
    contracts: 
      RoadEntry: 
        - versioned artifact
        - entry id plus version; released through the platform pipeline
      DerivedCheck: 
        - versioned record
        - "keyed by check id and version with the kept regression's test id and version it came from; a new regression version yields a new check version, never an edit in place"
      DroppedCheck: 
        - append-only record
        - "keyed by check id, version and time; a re-enabled check appends a new record"
      ProvenClass: 
        - versioned record
        - class id plus projection version; public semantic or closure-state changes increase it; membership changes while already open alone do not
      RoadAssuranceStatus: 
        - versioned record
        - "entry id plus version, projected from the road assurance record; superseded or withdrawn, never overwritten"
      FixBrief: 
        - versioned record
        - "keyed by finding id; a new reproduction or proof-condition version yields a new brief version, never an edit in place; how it was made is part of the record"
      CreationRule: 
        - versioned artifact
        - "rule id plus version, written only by the policy-owning team; a class test's result is a record of its own and never edits the rule"
      CatchLayer: 
        - versioned record
        - keyed by finding id; a reassignment appends a version with who assigned it and never overwrites the layer in force when a measure was reported
      ClassTestCount: 
        - latest-wins record
        - rule id plus rule version; only the current pass or fail is projected from the protected class-test result
      CreationLead: 
        - at-least-once
        - "keyed by tool, rule id (with rename mapping) and fingerprint; the tool signal intake normalizes each into a tool lead and deduplicates within the tool"
      ProvenanceStamp: 
        - immutable artifact by content hash
        - signed once per change and revision; a restamp is a new artifact and never replaces the stamp a review saw
      ReviewerSeedCatch: 
        - latest-wins record
        - "keyed by reviewer and window; recomputed by rule from review outcomes and the seed frame, so a resend replaces the window's value; a window with no record reads as silent, never as zero"
      SeededChange: 
        - immutable artifact by content hash
        - keyed by sandbox branch and revision; a reseed is a new branch and never replaces a change a reviewer has seen
      DerivedCheckMisses: 
        - latest-wins record
        - "keyed by check id, check version and window; recomputed by rule from replay results, so a resend replaces the window's value; a window with no record reads as silent, never as zero"
      ClassTestTotals: 
        - versioned record
        - "rule and class versions; delivered directly to the policy-owning team: people, never an agent, with no agent-readable copy"
      ChangeRecord: 
        - at-least-once
        - keyed by finding id plus change id
      GateFailurePosture: 
        - signed artifact with expiry
        - verified offline by the pipeline stage; an expired or untrusted posture falls back to the tier default it carries
      ToolLead: 
        - at-least-once
        - "keyed by tool, rule id (with rename mapping) and fingerprint; status updates append"
      DeliveryTelemetry: 
        - at-least-once
        - "keyed by tool gate, service and period"
      ChangeProvenance: 
        - at-least-once
        - "keyed by change id and revision; a later attestation verification appends, never overwrites; an unlabeled change is recorded as unlabeled and an unverifiable stamp as unverified"
      TrackerText: 
        - at-least-once
        - "keyed by item id and the time the text was written; an edited issue or comment appends a new record, and only the quarantined reader receives it"
    tiers: 
      T0: 
        name: Control safety
        intent: "Authorization, grants, credentials, audit and live prerequisite checks. Wrong answers are worse than no answer."
        failure_mode: fail-closed
        defaults: 
          availability: "99.9% monthly (unavailability blocks actions, never permits them)"
          rpo: 0 from acknowledgment (synchronous replication)
          rto: 1 hour
          consistency: linearizable for grant issue and consume; strongly consistent reads
          durability: audit records replicated across 3 failure domains before acknowledgment
          retention: 7 years for audit and grants (profile overrides per jurisdiction)
      T1: 
        name: Evidence integrity
        intent: "Intake, verification, disposition, ledger, evidence and closure. Losing or altering evidence is the failure that matters."
        failure_mode: queue-and-retry
        defaults: 
          availability: 99.5% monthly
          rpo: 0 from acknowledgment for ledger and evidence stores (the outbox holds work until the ack)
          rto: 4 hours
          consistency: strong for ledger and closure writes; immutable once written
          durability: object lock or WORM; 3 failure domains
          retention: 7 years for accepted evidence and dispositions; rejected and unresolved kept as long as accepted
      T2: 
        name: Orchestration
        intent: "Requests, workflow, dispatch, producers, context build and model access. Delays are acceptable; duplicate or phantom effects are not."
        failure_mode: queue-and-retry
        defaults: 
          availability: 99.5% monthly
          rpo: 5 minutes (workflow history is event-sourced)
          rto: 4 hours
          consistency: strong per workflow; at-least-once delivery with idempotency keys between services
          durability: replicated across 2 failure domains
          retention: 13 months for run records and model usage
      T3: 
        name: Best effort and analytics
        intent: "Evaluation, telemetry, sampling and dashboards. Gaps reduce what can be claimed; they never change what can be done."
        failure_mode: continue-without
        defaults: 
          availability: 99% monthly
          rpo: 24 hours
          rto: 2 business days
          consistency: eventual
          durability: "single region, daily backup"
          retention: 25 months (two annual cycles for comparison)
    failure_modes: 
      fail-closed: The request is denied or the action does not start. No effect occurs. Callers see an explicit denial.
      queue-and-retry: Work waits durably and resumes on recovery. Nothing is lost; elapsed time grows.
      mark-unknown: "Missing or stale data is labeled unknown, never current. Consumers that need it refuse to proceed."
      degrade-to-manual: The step falls back to the recorded manual procedure for its fidelity rung.
      continue-without: "The loop continues; the gap is recorded (telemetry, sampling). Never used for a control."
      posture-from-policy: "Behavior when unavailable is the pre-decided, signed posture from s3.gate-failure-policy."
