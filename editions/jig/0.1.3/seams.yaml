    description: "The projection of road assurance for the secure-creation loop. Carries no fixture-set or verdict reference and no road-level regression result. For each entry version its status is current or not current, with no class outcomes and no reason for a status change, including a failed vetting or a withdrawal after a leak. Its vetted scope and known limits use API and configuration identifiers and named pattern classes, never an input shape or sequence. They never hold a test's input, fixture content, expected outcome or a bypass description."
    produced_by: 
      - ratchet:s5.road-assurance-record
    consumed_by: 
      - jig:context-plane
    module: secure-creation
    fields: 
      - name: entry_id
        type: id
        required: true
      - name: entry_version
        type: string
        required: true
      - name: vetted_scope
        type: text
        required: true
        description: "Covered API and configuration identifiers and named pattern classes; never an input shape or sequence, test input, fixture content, expected outcome or bypass description"
      - name: known_limits
        type: text
        required: false
        description: "Uncovered API and configuration identifiers and named pattern classes, at the same grain as vetted scope; never an input shape or sequence, test input, fixture content, expected outcome or bypass description"
      - name: vetted_on
        type: date
        required: true
      - name: status
        type: enum
        values: 
          - current
          - not-current
        required: true
        description: "Whether this entry version has current assurance; all other states project as not-current, with no failure or withdrawal reason"
    failure_scenarios: 
      - id: F135
        title: Road assurance guidance discloses a failure reason or protected test text
        elements: 
          - ratchet:s5.road-assurance-record
          - ratchet:s5.independent-verifier
          - ratchet:s5.disposition-review
          - jig:context-plane
          - jig:coding-agent
          - jig:model-routes
        trigger: "A status projection exposes a class outcome or a failure or withdrawal reason, or copies a test input, fixture, expected outcome or bypass description into agent-readable scope or known limits."
        required_behavior: "The assurance record sends current or not current per entry version without class outcomes or reasons, including failed vetting and withdrawal after a leak. Vetted scope and known limits contain API and configuration identifiers and named pattern classes only, never an input shape or sequence, test input, fixture content, expected outcome or bypass description. The same limits hold for the model provider reached through the coding agent's model route."
        invariant: I2
        detection: "Protected canary literals found in sent road status, context guidance or model-route prompts (must be zero); class outcomes or failure or withdrawal reasons in those records (must be zero)."
        runbook: RB-F135
        test: 
          kind: pipeline
          steps: "Plant distinct canary literals in a protected test input, fixture, expected outcome and bypass description. Project the same entry version when current, unvetted, superseded, failed in vetting and withdrawn after a leak. Assert the status is current only for current assurance and not-current for every other state, with no outcomes field and no reason. Scan the full sent record, all context guidance and the coding-agent prompts sent to the model provider for every literal and assert zero hits. Assert scope and limits use only API and configuration identifiers and named pattern classes and contain no input shape or sequence."
    security: 
      relevant: true
      floor: 
        - MC-23
        - MC-102
