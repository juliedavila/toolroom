claims: 
  - id: SH-1
    owners: 
      - side: jig:context-plane
        role: Policy-owning team
        identity: null
      - side: jig:check-suite
        role: Policy-owning team
        identity: null
      - side: jig:people.creation-policy-owner
        role: Policy-owning team
        identity: null
      - side: jig:measurement-plane
        role: Secure-creation measurement owner (outside the reviewer teams)
        identity: null
      - side: jig:p55-r28
        role: Policy-owning team
        identity: null
      - side: jig:p55-r29
        role: Policy-owning team
        identity: null
      - side: jig:p55-r30
        role: Policy-owning team
        identity: null
    statement: "A creation-time loop sees less context than a validation loop that reproduces its findings, so its findings are broad, fast and noisier; Ratchet's proven classes and the checks derived from its kept tests sharpen Jig's aim as Ratchet's record grows."
    type: engineering-practice
    premise_group: Interface with Ratchet
    load: "Jig's place beside Ratchet: proven classes (interface point I1) as the targets the context plane steers toward and the policy-owning team turns into rules, derived checks (I2) in the shared suite, vetted road entries (I3), Jig's findings flowing to Ratchet as leads before triage (I5), and Jig alone starting with a creation-premise and harness inventory while its stage exits wait on the declared Ratchet capabilities."
    rests_on: 
      parts: 
        - jig:context-plane
        - jig:check-suite
        - jig:people.creation-policy-owner
        - jig:measurement-plane
      relationships: 
        - jig:p55-r28
        - jig:p55-r29
        - jig:p55-r30
    evidence: 
      - source: Peer reviewed study
        url: https://doi.org/10.1145/3650212.3680313
        kind: peer-reviewed
      - source: Peer reviewed study
        url: https://doi.org/10.1145/3661167.3661262
        kind: peer-reviewed
    strength: moderate (creation-time findings are noisier) / weak (proven classes sharpen the aim)
    strength_reason: "Peer-reviewed studies show analyzers at the point of change emitting mostly irrelevant warnings and missing many real flaws, and one shows rules written from missed vulnerabilities more than doubling an analyzer's detection. No study measures a creation loop fed by another loop's reproduced classes; Ratchet's CL-02 grades the validation side's noise and the need for reproduction."
    extrapolation: "From one analyzer tuned on a curated set of known vulnerabilities to a policy-owning team turning an organization's reproduced classes into rules."
    falsifier: "Rules turned from proven classes catch their class's reproduced members no better than the organization's earlier rules (the class test U-434 runs), or Jig's precision does not rise as Ratchet's record grows."
    measured_by: 
      - ratchet:U-434
      - jig:U-436
      - "The policy-owning team reads ClassTestTotals directly as people, never an agent; the suite and measurement plane receive only a binary rule result."
    verdict: honest bet
    untested: true
    if_it_flips: "Jig runs on its own best-guess classes, as it does without Ratchet, and the interface carries leads and provenance more than targets."
    kind: engineering-practice
    grade: moderate (creation-time findings are noisier) / weak (proven classes sharpen the aim)
    source: Published studies linked in the evidence record
    fallback: "Jig runs on its own best-guess classes, as it does without Ratchet, and the interface carries leads and provenance more than targets."
  - id: SH-2
    owners: 
      - side: shared:ext.engineering-workflows
        role: Engineering system owner
        identity: null
      - side: ratchet:s6.regression-catalog
        role: Domain test team + CI/context owners
        identity: null
    statement: "The protected regression stage keeps test inputs, logs and artifacts outside the coding agent's credentials."
    type: engineering-practice
    premise_group: Engineering system
    load: Kept regression secrecy and detection of derived-check gaming.
    rests_on: 
      parts: 
        - shared:ext.engineering-workflows
        - ratchet:s6.regression-catalog
      relationships: 
