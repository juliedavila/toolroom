  - id: JC-23
    statement: "Analyzers miss most real vulnerabilities and nearly all authorization flaws, the class that concentrates in agent-built applications; people asked to focus on security find far more than people who are not, yet still miss many, so a qualified person's attention on those hunks catches some of what machines miss."
