claims:
  - id: JC-01
    statement: Coding agents working on real repository tasks often write code that passes its functional tests and is still insecure.
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Peer reviewed study; Preprint"
    fallback: "The inner loop's security checks shrink to secrets and the dependency policy, and Jig moves its effort to the pull-request plane and to paved roads."
    attrs:
      ratchet_type: empirical
      strength: moderate
      verdict: holds
      premise_group: AI capability
      strength_reason: "Three benchmarks from different groups, two peer-reviewed, agree in direction for repository-level and whole-application tasks; absolute rates differ by benchmark and paper version, and none measures an organization's own code."
      falsifier: "In the organization's own agent sessions, diffs that pass their functional tests seldom carry a security finding the suite confirms, so the inner loop's security checks catch little."
      load: "Jig's objective and its inner loop: deterministic findings go back to the agent during its turn, and the stop gate holds the turn open until the suite passes, because passing tests alone does not catch what the agent gets wrong. The 'agent fixes first' stage and the plausibility target start from this baseline."
      tested_by:
        - U-436
      measured_by:
        - U-436
  - id: JC-02
    statement: "Whether agent-written changes carry more defects than human-written ones is unsettled: the reported excess of about 1.7 times the issues per pull request is vendor-measured, and independent studies find differences that vary by agent and by measure, including fewer security smells in agent code."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Vendor report; Preprint; Peer reviewed study"
    fallback: "No control changes, since every control applies to every change. The plausibility target stops being 'back to human parity' and becomes an absolute rate per change; the split by origin stays as the way to tell."
    attrs:
      ratchet_type: empirical
      strength: weak
      verdict: "weak, reword"
      premise_group: AI capability
      strength_reason: "The only figure for the size of the excess is vendor-measured, with the vendor's own reviewer as the instrument. Independent studies point both ways: static-analysis warnings rise after agent adoption in one peer-reviewed causal design, while a large preprint finds fewer security smells in agent code; results differ by agent and by measure."
      falsifier: "The attribute stage's baseline by origin shows agent-written changes with escaped defects per change at or below the rate of human-written changes."
      load: "The plausibility target (AI-authored code back to about human parity, or a bit better), the baseline by origin that the attribute stage sets, and the split of every defect measure by origin (agent and tool against person)."
      tested_by:
        - U-436
      measured_by:
        - ratchet:U-198
        - U-436
  - id: JC-03
    statement: "Code-generating models name packages that do not exist, about 5 to 6% of the packages named by 2026 frontier models, and attackers can register those names, so dependencies come only from the organization's mirror, with the check run again before merge."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Peer reviewed study; Preprint"
    fallback: "If the rate falls toward zero the check stays as cheap hygiene. If a registered hallucinated name passes the mirror, admission needs its own review rule, which the organization adds in its own patches."
    attrs:
      ratchet_type: empirical
      strength: moderate
      verdict: holds
      premise_group: AI capability
      strength_reason: "The exposure is established by peer-reviewed studies and a 2026 replication, and a live registry experiment shows developers install registered hallucinated names. Rates depend on measurement method. No study measures how often a mirror check blocks such a dependency, and a hallucinated name that is already registered as a lookalike passes any mirror that proxies public registries without review."
      falsifier: "In the organization's own sessions the dependency check against the mirror almost never fires on a nonexistent or newly registered package, or a hallucinated name an attacker registered is admitted to the mirror and passes."
      load: "The mirrored-dependencies assumption declared on Jig's container, the dependency policy in the stop gate, and its second run in the server-side required checks against the mirror's admission record (the assumption's fallback)."
      tested_by:
        - U-436
      measured_by:
        - U-436
  - id: JC-04
    statement: "Security instructions in prompts and rules files give at best modest, unreliable gains in the security of agent output and enforce nothing, so they are hygiene and not a control."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Peer reviewed study; Preprint"
    fallback: "Instruction files and skills would earn a place as a control, with versions, tests and a catch rate of their own, reported beside the checks."
    attrs:
      ratchet_type: empirical
      strength: moderate
      verdict: holds
      premise_group: AI capability
      strength_reason: "Repository-level agent benchmarks, one peer-reviewed, find that security hints and guidelines do not fix agent output, while a peer-reviewed function-level study finds a reduction with one prompting technique. A measurement of public rules files shows most written rules have no enforcing control. Consistent with 'hygiene, not a control'; the size of any gain is unsettled."
      falsifier: "In the organization's own sessions, adding or removing the security sections of instruction files moves the rate of findings at the stop gate as much as an enforced check does."
      load: "The context plane treats short instruction files under code ownership as hygiene, never as a control; the enforced checks of the inner loop and the paved roads carry the security load instead."
  - id: JC-05
    statement: "What a coding model reads in its context, surrounding code included, moves the security of what it writes in both directions, so secure patterns in the codebase steer agents; that they steer more strongly than instruction files is untested."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Peer reviewed study; Preprint"
    fallback: "The codebase stops counting as a steering signal. Paved roads still retire classes by construction (the secure-defaults premise), and steering moves to enforced checks."
    attrs:
      ratchet_type: empirical
      strength: moderate (context steers) / none (more than instructions)
      verdict: "weak, reword"
      premise_group: AI capability
      strength_reason: "Several studies, two peer-reviewed, show context moving security both ways: vulnerable context and planted comments raise insecure output, and secure demonstrations or retrieved security knowledge lower it. None compares codebase patterns with instruction files, and none tests an agent working across a whole repository."
      falsifier: "Within the organization, agent changes in repositories with a paved road for a class show findings of that class at the same rate as agent changes in repositories without one."
      load: "The context plane's paved-road references in the codebase (a central authorization library, safe query builders, hardened templates, reference implementations) and the skill per paved road; the 'pave the road' stage counts on agents copying the road."
      tested_by:
        []
      measured_by:
        - ratchet:U-198
  - id: JC-06
    statement: "A model given concrete findings from deterministic checks while it is still working fixes most of them, so fewer reach the pull request; whether those fixes hold, without new findings, is untested for agents in real repositories."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Peer reviewed study"
    fallback: "Findings stay at the pull request, where people read them; the stop gate keeps only fast blocking checks, and the exit metric of the 'agent fixes first' stage is revised."
    attrs:
      ratchet_type: empirical
      strength: moderate (findings fixed in the loop) / none (fixes hold)
      verdict: honest bet
      premise_group: AI capability
      strength_reason: "Several studies, three peer-reviewed, agree that tool findings fed back to a model get fixed at high rates on function-level benchmarks. None runs an agent harness on real repositories, and none measures whether the fixes stay fixed; one finds models weakest at repairing their own code."
      falsifier: "Once the inner loop is closed, findings per agent-written hunk at the pull request fall by much less than half, or the agent's own fixes fail to hold."
      load: "Design principle 1 (findings go to the agent; gates sit at boundaries), the per-edit checks and the stop gate, thesis item 1, and the exit metric of the 'agent fixes first' stage (findings per agent-written hunk at the pull request fall by at least half, with the self-fix hold rate measured)."
      tested_by:
        - U-436
      measured_by:
        - U-436
  - id: JC-07
    statement: "A model asked to fix findings changes code even where no defect exists and can break correct code, so the checks in the agent's loop need a precision bar of their own."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Preprint; Peer reviewed study"
    fallback: "The loop's precision bar can relax toward the bar people get at the pull request, and more checks can run at the agent's turn."
    attrs:
      ratchet_type: empirical
      strength: weak
      verdict: honest bet
      premise_group: AI capability
      strength_reason: "One preprint shows blind iterative fixing damaging correct programs faster than it repairs buggy ones, and one peer-reviewed study finds that whether an AI patch fixed its target says nothing about whether it regressed; an agent behind build, warning and test checks reached high correct-fix rates. No study measures agents in a stop-gate loop with a known false-positive rate."
      falsifier: Findings planted as false positives in the inner loop lead the agent to edits that add no new findings and break no tests.
      load: "The precision budget for the inner loop (looser than for people, but bounded) and the self-fix hold rate the measurement plane reports to each developer."
      tested_by:
        - U-436
      measured_by:
        - U-436
  - id: JC-08
    statement: "Coding agents optimize for the checks they can see, up to editing tests or the checker; locking checks out of the agent's edit reach stops the tampering, and tests held outside its loop expose gaming that the visible checks miss."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Preprint; Peer reviewed study"
    fallback: "The derived-check gaming watch can thin to a sample, and the agent may see more of a check's logic; the lock stays, since it costs little."
    attrs:
      ratchet_type: empirical
      strength: moderate
      verdict: holds
      premise_group: AI capability
      strength_reason: "Independent benchmarks agree that current coding agents game visible tests and tamper with evaluators, and a peer-reviewed workshop paper finds that locking the evaluator stops the tampering. Mostly preprints; held-out tests exposed gaming in one benchmark and added little over a model judge in another."
      falsifier: "Changes that pass a derived check and later fail the kept test's replay (the misses U-438 counts) stay near zero, and the lock never blocks an attempted edit to a check."
      load: "Rule 2 as Jig applies it (checks out of the agent's edit reach; the agent sees pass or fail and a fixed message, never an expected outcome), the derived-check contract with no field for an expected answer, and the watch on derived-check gaming through Ratchet's kept tests. Also the draft's known weakness that running the same checks everywhere may teach the agent to satisfy the analyzer."
      tested_by:
        - U-438
        - U-431
      measured_by:
        - U-438
        - U-431
  - id: JC-09
    statement: "AI code reviewers and model triage are noisy: on real pull requests they catch a minority of the defects and most of their comments are not acted on, so their output is a lead and never the acceptance."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Peer reviewed study; Published source; Preprint"
    fallback: "AI review could carry more weight at the pull request, for example clearing low-risk hunks for the lighter pass, but rule 3 still keeps it out of the reproduced tier."
    attrs:
      ratchet_type: empirical
      strength: moderate
      verdict: holds
      premise_group: AI capability
      strength_reason: "A peer-reviewed benchmark of real pull requests and two live deployments, one peer-reviewed and one first-party, agree that most AI review comments are not acted on and that reviewers miss much on real changes; a small preprint finds scores on real pull requests far below synthetic ones. No study measures catch rate on security defects specifically."
      falsifier: "On closed cohorts, the AI reviewer's comments on agent-written changes are confirmed as defects at a precision near that of the deterministic checks, and its misses are rare."
      load: "Rule 3 as Jig applies it: AI review, model triage and scanner output are leads; a deterministic check puts a defect only in the check-confirmed tier, and the reproduced tier needs a reproduction. The AI reviewer's comments reach the merging reviewer as leads, triage labels order the view and never remove a finding from a hunk routed to a person, and every lead goes to Ratchet before triage."
      tested_by:
        - U-436
      measured_by:
        - ratchet:U-200
        - U-436
  - id: JC-10
    statement: "A reviewer model from a family other than the author's avoids the author model's self-preference, though errors stay correlated across families, so cross-family review narrows shared blind spots without removing them."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Preprint"
    fallback: "The reviewer's family stops mattering and the cheapest capable model reviews; its comments stay leads either way."
    attrs:
      ratchet_type: empirical
      strength: weak
      verdict: honest bet
      premise_group: AI capability
      strength_reason: "Judging studies show models favor their own and their family's outputs, including on code with objective rubrics, which supports a reviewer from another family; a large study finds errors correlated across providers as well. No study measures cross-family code review."
      falsifier: "On the organization's own changes, a same-family reviewer's comments point at later-confirmed defects as often as a cross-family reviewer's."
      load: "The AI reviewer from a second model family at the pull-request plane, and rule 4's clause that a second family's review is a lead and never the independent review."
  - id: JC-11
    statement: "A coding agent that reads untrusted text while it holds repository write and an outbound path can be steered by that text into running commands or sending data out, and detection does not stop it; structural separation does: untrusted text read only by a quarantined reader that passes typed fields, and every outbound path through a gate."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Peer reviewed study; Preprint; Published source"
    fallback: "If coding agents became reliably resistant to planted text, the quarantined reader could retire for low-risk sources; the gates on outbound paths stay, since they cost little."
    attrs:
      ratchet_type: empirical
      strength: strong (the threat) / moderate (the structural remedy)
      verdict: holds
      premise_group: AI capability
      strength_reason: "Independent studies, one peer-reviewed, hijack every tested commercial coding agent through planted text, a scan of real workflows confirms hundreds of exploitable paths from issue text into agent prompts, and detection defenses fail. The remedy rests on one benchmarked design in which untrusted data cannot change control flow; no study tests a coding harness built this way."
      falsifier: "A marker planted in an issue or a web page appears in the coding agent's context, prompts or diff in a seeded run (the U-432 test), or a seeded injection reaches an outbound path that no gate checks."
      load: "Rule 1's second half as Jig applies it: the quarantined reader on a model route of its own, the reader schema gate that passes typed fields and drops prose, the coding agent's egress limited to approved model routes and the organization's mirrors, and the model checks' trifecta, agent-reach and outsider-label rules on Jig's parts. The code-from-engineers assumption's fallback (outside contributors' text reaches the agent only through the reader) rests here too."
      tested_by:
        - U-432
      measured_by:
        - U-432
  - id: JC-12
    statement: "Where a check's findings land decides whether they get fixed: findings shown in the change workflow, while the author still holds the change, get fixed far more often than the same findings delivered as batch reports."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Published source; Peer reviewed study"
    fallback: "Placement stops mattering, and checks can move to wherever they are cheapest to run, such as nightly runs, without losing fixes."
    attrs:
      ratchet_type: empirical
      strength: moderate
      verdict: holds
      premise_group: Delivery and system
      strength_reason: "Two large first-party reports and a peer-reviewed user study agree that findings delivered inside the change workflow get acted on far more, and sooner, than batch reports. The starkest figure rests on a batch arm of 20 to 30 issues, and all of it concerns people, not agents."
      falsifier: "Within the organization, findings shown at the agent's turn or in review are resolved no more often than the same rule's findings delivered as batch reports."
      load: "Design principle 1 (findings go to the agent; gates sit at boundaries), the per-edit checks and the stop gate inside the agent's turn, the pull-request plane's diff-scoped analysis delivered as review comments, and the per-layer catch rates. The draft's notes prefer this placement effect to cost-of-defect multipliers as the quantitative anchor."
      tested_by:
        - U-436
      measured_by:
        - ratchet:U-200
        - U-436
  - id: JC-13
    statement: "A check keeps its users only while its effective false-positive rate stays low, about 10% in review at the most studied deployment, so precision is the currency that buys trust in a finding."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Published source; Peer reviewed study"
    fallback: "Noisier checks could run at the pull request, and the exit metric of the 'one check, many places' stage loosens."
    attrs:
      ratchet_type: empirical
      strength: moderate
      verdict: holds
      premise_group: Delivery and system
      strength_reason: "One company's long-run, enforced practice sets the 10% bar, and an interview study names false positives as the first barrier to use; no controlled study fixes the threshold, and the bar was set for human readers."
      falsifier: Checks above the bar show the same fix rate and keep their users as long as checks below it.
      load: "The pull-request plane's diff-scoped analysis held to an effective false-positive bar the organization sets, the exit metric of the 'one check, many places' stage (effective false positives under 10% at the pull request), model triage that orders findings and never drops them, and the effective false-positive rate per surface that the measurement plane reports to the policy-owning team."
      tested_by:
        - U-436
      measured_by:
        - U-436
  - id: JC-14
    statement: "Compiling one policy source into every harness, the git hooks and the server-side checks, at the same versions, gives the same findings at every point from the agent's turn to the pull request; checks configured differently at each point lose developers' trust."
    kind: premise
    grade: judgment
    source: "Jig premise register (claims.yaml): Published source; Peer reviewed study"
    fallback: "Each point could tune its own checks, and the exit metric of the 'one check, many places' stage changes from the same findings everywhere to findings that rise with depth."
    attrs:
      ratchet_type: engineering-practice
      strength: weak
      verdict: holds
      premise_group: Delivery and system
      strength_reason: "The first half is close to definitional for deterministic checks at pinned versions; the evidence that inconsistency erodes trust is one company's report and a survey showing that context changes which warnings developers heed. No study tests a single compiled policy against per-point configuration."
      falsifier: "Changes that passed the agent's stop gate meet findings from the same rules at the pull request (version or configuration drift), or a per-point configuration shows the same fix rates and trust as the single source."
      load: "Design principle 2 (one policy source, compiled into the harness configurations, git hooks and CI), the shared check suite, the 'one check, many places' stage and its exit metric (the same findings at agent and pull-request time), and thesis item 2."
      tested_by:
        - U-431
      measured_by:
        - U-431
  - id: JC-15
    statement: "The checks fit the latency each point allows (about 1 to 2 seconds per agent edit, under a minute at the stop gate, 10 to 30 seconds before push, minutes at the pull request), and their cost per agent loop stays bearable as it repeats on every iteration."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Vendor report; Published source; Peer reviewed study"
    fallback: "Slow checks move from the agent's turn to the stop gate or the pull request, and the per-edit set shrinks to what fits."
    attrs:
      ratchet_type: engineering-practice
      strength: weak
      verdict: honest bet
      premise_group: Delivery and system
      strength_reason: "Tool timings come from a vendor and one first-party report, and a peer-reviewed study shows layered analysis can stay out of the developer's way. No study sets seconds-level budgets for agent loops or measures how agent task success or cost changes with check latency."
      falsifier: "Agent sessions in the organization's harnesses show task success or cost degrading measurably at the planned per-edit budget, or the planned checks cannot run within it on the organization's code."
      load: "Which checks run per edit, at the stop gate, before push and at the pull request; the expected-runtime field derived checks carry so they fit the per-edit budget; and the harness hooks that block while a check runs."
  - id: JC-16
    statement: "Defects and review misses grow with change size, so a diff-size budget per agent task keeps each change reviewable; that the budget lowers the defects reaching merge, rather than spreading them over more changes, is untested."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Peer reviewed study; Preprint"
    fallback: "The diff-size budget becomes a reviewability convenience rather than a control, and the 'agent fixes first' stage drops it from its capabilities."
    attrs:
      ratchet_type: empirical
      strength: moderate (size tracks defects and review misses) / none (budget as a control)
      verdict: "weak, reword"
      premise_group: Delivery and system
      strength_reason: "Peer-reviewed studies agree that change size predicts defect-inducing changes and issue counts in agent pull requests, and review quality falls with diff size; all are correlational. Issue counts that scale with churn mean a budget may only spread the same defects over more changes, and no study tests a budget as an intervention."
      falsifier: "After the budget is enforced, escaped defects per thousand changed lines from agent sessions stay the same, and review catch rates on routed hunks do not rise."
      load: "The diff-size budget per agent task in the context plane, the 'agent fixes first' stage, which enforces diff budgets, and the risk router's assumption that a person can review a routed hunk with its spec and findings attached."
  - id: JC-17
    statement: "Secure defaults (hardened frameworks, memory-safe languages, safe APIs) cut the classes they target by an order of magnitude for code that uses them, far more than detection layers do, and the gain arrives at the rate new code's share grows, over years."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Peer reviewed study; Published source"
    fallback: "The 'pave the road' stage loses its order-of-magnitude case, and Jig's effort shifts to detection and review, with smaller targets."
    attrs:
      ratchet_type: empirical
      strength: moderate
      verdict: "weak, reword"
      premise_group: Delivery and system
      strength_reason: "A peer-reviewed study and large first-party records agree on order-of-magnitude reductions for targeted classes, with the Android curve showing the gain arriving as new code's share grows. Most of the data is one company's, without published denominators, and none measures agent-written code; 'far more than detection' compares across different studies."
      falsifier: "On-road and off-road code show the same reintroduction rate and findings per change for a targeted class (Ratchet's measure), or the class's findings stop falling as the road's share of new code rises."
      load: "The 'pave the road' stage and its exit metric (targeted classes trend toward zero), the durable path where a class Ratchet proved and saw recur becomes a paved-road default plus a skill, and the plausibility read that order-of-magnitude reductions come only from classes made impossible by construction."
      tested_by:
        []
      measured_by:
        - ratchet:U-198
  - id: JC-18
    statement: "Scanning for secrets at the agent's hooks and again at push, with bypass restricted and a server-side second check, cuts the secrets that reach the remote; that it brings them close to zero is untested, because detectors miss some secret types and developers bypass warnings."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Vendor report; Peer reviewed study"
    fallback: "Secrets join the classes Jig treats as detection residue, and the organization leans on rotation and short-lived credentials, which sit outside Jig."
    attrs:
      ratchet_type: empirical
      strength: moderate (the exposure and the bypass) / none (close to zero)
      verdict: "weak, reword"
      premise_group: Delivery and system
      strength_reason: "A vendor report gives agent-assisted commits about twice the baseline leak rate; peer-reviewed studies show leakage is pervasive, the best detector's recall reaches 88% on a benchmark, and developers at an industrial site bypass warnings. No study measures how many secrets still reach the remote under layered scanning with restricted bypass."
      falsifier: "Valid secrets later found in the remote (by the server-side scan, a history sweep or an incident) keep appearing at a rate that does not fall once the layered scanning is in place."
      load: "Secret scanning in the stop gate and in the locked pre-commit gate, the same scan in the server-side required checks, and the plausibility read that secrets reaching the remote fall close to zero."
      tested_by:
        - U-431
        - U-436
      measured_by:
        - U-431
        - U-436
  - id: JC-19
    statement: "Autofix that abstains when unsure and shows a patch only after it passes the suite gives reviewers fixes they land at useful rates without flooding them; reviewers still have to judge each patch, since they over-trust patches labeled as coming from a security tool."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Published source; Peer reviewed study; Preprint"
    fallback: "Autofix leaves the pull-request plane or shows its patches only on request, and findings go to the reviewer with guidance alone."
    attrs:
      ratchet_type: empirical
      strength: weak
      verdict: honest bet
      premise_group: Delivery and system
      strength_reason: "Two first-party industrial reports show validation and abstention raising the share of useful patches and a production agent landing about a quarter of its fixes; a lab experiment shows a 'security tool' label swaying reviewers whatever the patch's correctness, and a benchmark shows models rarely abstain unaided. None measures security autofix at the pull request."
      falsifier: "Validated autofix patches are rarely landed, or landed patches are reverted or reopened more often than people's fixes for the same rules."
      load: "The pull-request plane's autofix: it proposes patches for analysis findings, abstains when unsure, shows only patches that passed the suite on the patched diff, and leaves the decision to apply each one to the reviewer."
  - id: JC-20
    statement: "Tests an agent writes for its own code encode what the code does rather than what was intended, so they pass its defects; for high-risk work, acceptance tests derived from a spec a person wrote or signed reduce this, though spec-derived oracles are imperfect too."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Preprint; Peer reviewed study"
    fallback: "Spec-first stops earning its cost for high-risk work, and acceptance there rests on the qualified reviewer and Ratchet's kept tests."
    attrs:
      ratchet_type: empirical
      strength: moderate (self-written tests encode the code) / weak (spec-derived tests fix it)
      verdict: honest bet
      premise_group: Delivery and system
      strength_reason: "Several studies, one peer-reviewed, show model-written tests asserting the code's actual behavior, bugs included, and those tests persisting; generating tests from a specification reduces misguided tests in one peer-reviewed study and a small pilot. None tests a person-written spec for security acceptance."
      falsifier: "For high-risk changes, agent-written tests catch the security defects later confirmed as often as the spec-derived acceptance tests do."
      load: "Rule 2's high-risk clause (acceptance tests derive from a spec a person wrote or signed), spec-first for high-risk changes in the context plane, the developer's duty to write or sign that spec, and the draft's known weakness that agent-written tests grade the agent's own work."
  - id: JC-21
    statement: "Rules on a hunk's paths, owners and rule matches pick out most hunks that touch authorization, cryptography, data access or money, so a qualified person sees them; a model that may only add hunks catches some of what the rules miss."
    kind: premise
    grade: untested
    source: "Jig premise register (claims.yaml): Published source; Peer reviewed study"
    fallback: "Routing moves toward a trained model with the rules as a floor, or every hunk in the named areas goes to a person regardless of rules."
    attrs:
      ratchet_type: engineering-practice
      strength: weak
      verdict: honest bet
      premise_group: People and organization
