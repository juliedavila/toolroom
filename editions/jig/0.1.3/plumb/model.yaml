      - JC-35
  - id: quarantined-reader
    name: Quarantined reader for outside text
    kind: service
    system: shared:EXT
    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: secure-creation
    description: "The only place in the loop where outside text is read by a model: issue and review text, web pages, public issue threads and dependency documentation. A tool-less model session with no repository access, no write path and no shared context with the coding agent. It answers the agent's typed question in the question's schema, and its answer reaches the agent only through the reader's schema gate."
    attrs:
      aliases:
        - Jig quarantined reader
      level: component
      role_class: producer
      trust_zone: shared:existing
      module: secure-creation
      owner_as_written: Policy-owning team
    rests_on:
      - JC-11
  - id: reader-schema-gate
    name: Reader schema gate
    kind: gateway
    system: shared:EXT
    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: secure-creation
    description: "Validates each reader answer against its question's schema with no model call, and passes only typed fields: package and version identifiers, API names and signatures, error codes and links. Prose does not pass; an agent that needs prose from outside asks the developer, who reads it."
    attrs:
      level: component
      role_class: existing
      trust_zone: shared:existing
      decision: deterministic
      module: secure-creation
      owner_as_written: Policy-owning team
    rests_on:
