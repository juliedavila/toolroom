    system: shared:EXT
    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: inner-loop
    description: "Holds the agent's turn open until the deterministic suite passes on its diff: tests, diff-scoped analysis, secret scanning, the dependency policy against the mirror, authorization-pattern rules and derived checks."
    attrs:
