    kind: service
    system: shared:EXT
    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: inner-loop
    description: "A worked example of a coding harness with blocking hooks, no stop gate and no telemetry export. The same suite runs at commit through the locked pre-commit gate in place of the stop gate, and its changes count as unlabeled in every provenance measure."
    attrs:
      aliases:
        - Harness example
        - no stop gate
      level: component
