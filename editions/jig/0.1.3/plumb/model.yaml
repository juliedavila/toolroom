    kind: service
    system: shared:EXT
    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: inner-loop
    description: "A worked example of a coding harness with locked requirements, hooks and a stop gate, partial session telemetry and no way to pin its own version, so the server-side run of the suite is the version of record for its changes."
    attrs:
      aliases:
        - Harness example
        - no version pinning
      level: component
      role_class: existing
      trust_zone: shared:existing
      agent_reachable: true
      harness:
        stop_gate: true
