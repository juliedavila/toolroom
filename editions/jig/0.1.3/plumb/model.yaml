      load: "Rule 1 as Jig applies it (a change merges only through the protected branch, with required checks run server-side that the agent cannot skip or reconfigure), the fallback of all four environment assumptions, the locked pre-commit gate treated as fast feedback rather than the control, and U-431's test that a commit which bypassed the hook fails the server-side checks."
