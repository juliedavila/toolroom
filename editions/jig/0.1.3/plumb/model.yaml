      - JC-12
  - id: coding-agent
    name: Coding agent session
    kind: service
    system: shared:EXT
    zone: shared:existing
    owner: Engineering owners (the developer whose session runs it)
    owner_as_written: Engineering owners (the developer whose session runs it)
    parent: inner-loop
    description: "Writes code in a developer's session. Reads repository code and mirrored dependencies, the context plane, the findings of the per-edit checks and the stop gate, fix briefs, and typed answers from the quarantined reader. It reads no outsider text itself: issue text, web pages and dependency documentation go to the reader. Its changes are proposals that merge only through the protected branch. Its egress goes only to approved model routes and the organization's mirrors."
    attrs:
      aliases:
        - Coding agent
      level: component
      role_class: producer
      trust_zone: shared:existing
      agent_reachable: true
      holds_nonpublic: true
      module: secure-creation
      owner_as_written: Engineering owners (the developer whose session runs it)
    rests_on:
      - JC-01
      - JC-05
      - JC-06
      - JC-11
      - JC-16
      - JC-20
      - JC-27
