contracts:
  - name: HunkRouteAdvice
    description: "A model's advice to put hunks on the human route. It can only add: it names hunks and a reason, and carries no way to lower a route."
    produced_by:
      - hunk-risk-advisor
    consumed_by:
      - hunk-router
    attrs:
      fields:
        - name: change_id
          type: id
          required: true
        - name: hunk_ids
          type: list
          of: id
          required: true
          description: Hunks to add to the human route
        - name: reason
          type: enum
          values:
            - authorization
            - cryptography
            - data-access
            - money
            - other
          required: true
        - name: advisor_version
          type: string
          required: true
      module: secure-creation
  - name: CreationOutcome
    description: "What a developer's sessions produced, as it turned out. Shown only to that developer; managers see pooled rates. A window with too few merged changes reads too few to call."
    produced_by:
      - measurement-plane
    consumed_by:
      - people.creation-developer
    attrs:
      measures: "Per author (the agent with the person whose session produced the change): escaped defects per merged change on the reproduced tier, with the check-confirmed tier beside it, and the share of the agent's own fixes that held, each with interval and sample size, on cohorts whose reproduction window has closed"
      module: secure-creation
  - name: ReviewerDrift
    description: "How a reviewer's decisions on agent-written changes are drifting. Reported by a team other than the reviewers' own; which changes were seeds is never shown to a reviewer. Only the measurement plane writes it; the seeded catches in it come from Ratchet's evaluation as a record of their own."
    produced_by:
      - measurement-plane
    consumed_by:
      - people.change-reviewer
      - people.high-risk-reviewer
    attrs:
      measures: "Per reviewer of agent-written changes: approval rate and comment rate over the window against that reviewer's own baseline, and seeded known-bad changes caught over those received where seeds run, each with interval and sample size"
      module: secure-creation
  - name: LayerCatchRate
    description: How well each layer and each rule catches what it is meant to catch. The layer that should have caught each defect is assigned outside the loop. Class tests travel separately as pass or fail per rule version; per-class totals never enter this plane.
    produced_by:
      - measurement-plane
    consumed_by:
      - people.creation-policy-owner
    attrs:
      measures: "Per layer and per rule: defects caught over defects assigned to that layer and effective false-positive rate per surface, with interval and sample size on closed cohorts; class-test member counts are excluded"
      module: secure-creation
