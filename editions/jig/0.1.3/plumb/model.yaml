  - id: measurement-plane
    name: Measurement plane and layer log
    kind: service
    system: shared:EXT
    zone: shared:existing
    owner: Secure-creation measurement owner (outside the reviewer teams)
    owner_as_written: Secure-creation measurement owner (outside the reviewer teams)
    parent: secure-creation
    description: "Logs where each layer caught what, sends findings to Ratchet as leads before triage with the dropped-check log, and reports outcomes to the people who decide: escaped defects per change by origin on the reproduced tier, reviewer approval drift, catch rate per layer and per rule, each on cohorts whose reproduction window has closed. The layer that should have caught each defect comes from Ratchet's evaluation group, never from this plane. It shows the policy-owning team each derived check's misses against its floor as Ratchet counted them, beside its own log of checks dropped or disabled; it never receives which changes missed or what a replay found. For class tests it receives and reports only rule id, rule version and pass or fail, never per-class counts; those go from the regression catalog directly to the policy-owning team: people, never an agent."
    attrs:
      level: component
      role_class: existing
      trust_zone: shared:existing
      decision: deterministic
      module: secure-creation
      owner_as_written: Secure-creation measurement owner (outside the reviewer teams)
    rests_on:
