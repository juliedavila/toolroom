    statement: "Signals outside the harness, such as co-author trailers, bot accounts and writing style, attribute agent-written changes poorly, so attribution must come from harness telemetry, and only sessions in harnesses that export it can be counted; whether at least 95% of commits can be attributed this way is untested."
