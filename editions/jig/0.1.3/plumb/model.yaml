elements:
  - id: secure-creation
    name: "Jig (secure creation at the developer's edit)"
    kind: external-system
    system: shared:EXT
    zone: shared:existing
    description: "The organization's secure-creation loop, where developers and coding agents write code, drawn as its planes: the context plane that steers what the agent copies, the inner loop of the agent's turn, the commit and push boundary, the pull-request plane and the measurement plane. Ratchet is its learning plane. A sibling design that runs alone or beside this loop. Coding agents run inside it, so it is agent-reachable: it receives proven failure classes, road entries with a current assurance record, derived checks that report pass or fail and fix briefs, and never a kept regression, a proof condition, an expected-outcome hash or text an outsider wrote. Its controlled-environment premise is declared as assumptions, each with the parts that rely on it and a fallback that does not."
    attrs:
      aliases:
        - Secure-creation loop
        - Secure-creation companion
      level: container
      role_class: existing
      trust_zone: shared:existing
      agent_reachable: true
      module: secure-creation
      assumptions:
        - id: managed-endpoints
          statement: "Developer endpoints are managed: device management, endpoint detection, data-loss prevention and governance of agents and editor extensions."
          relied_on_by:
            - harness-full-parity
            - harness-no-pinning
            - harness-no-stop-gate
            - edit-checks
            - stop-gate
            - precommit-gate
          fallback: "Rule 2 falls back to the server-side required checks: a local check that was skipped or reconfigured is caught at the protected branch, where rule 1 also holds."
          fallback_by:
            - protected-branch
        - id: mirrored-dependencies
          statement: "Developers and their build jobs install dependencies only through the organization's mirrors."
          relied_on_by:
            - p55-r8
            - stop-gate
          fallback: "The dependency policy runs again in the server-side required checks against the mirror's admission record, so a dependency from outside the mirror fails before merge."
          fallback_by:
            - protected-branch
        - id: code-from-engineers
          statement: "Code in the organization's repositories arrives only from its own engineers, through the protected branch."
          relied_on_by:
            - p55-r8
          fallback: "Text from an outside contributor is outsider text: it reaches the coding agent only through the quarantined reader, and the change still merges only through the protected branch with an independent reviewer."
          fallback_by:
            - quarantined-reader
            - reader-schema-gate
            - protected-branch
        - id: locked-policy
          statement: Policy files and hook configuration are delivered and locked centrally on every endpoint.
          relied_on_by:
            - harness-full-parity
            - harness-no-pinning
            - harness-no-stop-gate
            - edit-checks
            - stop-gate
            - precommit-gate
          fallback: The same suite at the same versions runs as server-side required checks that the agent cannot skip or reconfigure.
          fallback_by:
            - protected-branch
            - check-suite
    rests_on:
      - JC-03
      - JC-26
  - id: context-plane
    name: "Context plane: paved-road guidance and skills"
    kind: registry
    system: shared:EXT
    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: secure-creation
    description: "What the coding agent copies from: paved-road references in the codebase, a skill per paved road, short instruction files under code ownership, the security constraints written into the task's spec for high-risk work, and the diff-size budget per task. Steers toward proven classes and toward road entries whose assurance record is current. Holds proven classes until the policy-owning team turns each into a rule. Guidance only: instruction files are hygiene and enforce nothing. It keeps only the current version of each proven class, replacing any earlier spans and consequence tier when a class gains an open member. It exposes road assurance per entry version only as current or not current, with no class outcomes or failure or withdrawal reasons. The model provider is a reader through the coding agent's model route, and guidance sent on that route obeys the same projection limits."
    attrs:
      aliases:
        - Jig context plane
      level: component
      role_class: existing
      trust_zone: shared:existing
      agent_reachable: true
      unpartitioned: "Holds guidance (road references, skills, instruction files, spec constraints and proven classes as projected for this loop), never evidence content"
      module: secure-creation
      owner_as_written: Policy-owning team
    rests_on:
      - JC-04
      - JC-05
      - JC-16
      - JC-17
      - JC-20
      - JC-36
      - shared:SH-1
  - id: check-suite
    name: Shared check suite and policy source
    kind: registry
    system: shared:EXT
    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: secure-creation
    description: "The one policy source, compiled into every harness's locked configuration, the git hooks and the server-side required checks, so the same checks at the same versions run at every point from the agent's turn to the pull request. Holds the rules (type checks, linters, diff-scoped analysis, secret scanning, dependency policy, authorization-pattern rules), the derived checks Ratchet sends, and each rule the policy-owning team turned from a proven class with its class test. Logs every derived check it drops or disables. It gates on a rule turned from a proven class only once a class test at the rule's version has passed (the rule caught every member it ran against, and ran against at least one), and until then the rule steers and reports. It receives only rule id, rule version and pass or fail for each class test, and passes only that binary result to the measurement plane; no per-class counts reach it."
    attrs:
      aliases:
        - One policy source
        - Jig check suite
      level: component
      role_class: existing
      trust_zone: shared:existing
      agent_reachable: true
      unpartitioned: "Holds rules, check versions and binary class-test results, never per-class counts or evidence content"
      module: secure-creation
      owner_as_written: Policy-owning team
    rests_on:
      - JC-01
      - JC-03
      - JC-04
      - JC-07
      - JC-08
      - JC-13
      - JC-14
      - JC-15
      - JC-18
      - JC-27
      - JC-29
      - JC-35
      - JC-36
      - shared:SH-1
