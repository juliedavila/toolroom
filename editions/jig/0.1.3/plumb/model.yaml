    kind: external-system
    system: shared:EXT
    zone: shared:third-party
    parent: secure-creation
    description: "The model route the quarantined reader calls, kept apart from the routes the coding agent and the reviewers call: its own credentials and sessions, no tools, no knowledge base and no context shared with any other session. Its requests carry outside text, so every response it returns keeps the outsider label of the request it answers."
    attrs:
      level: component
      role_class: existing
      trust_zone: shared:third-party
