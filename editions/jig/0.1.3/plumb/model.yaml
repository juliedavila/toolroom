    parent: change-boundary
    description: "Attaches a signed provenance stamp to each change from the harness's session telemetry: tool and version, model and version, session and skill-bundle hash. A change from a harness that exports no telemetry carries no stamp and counts as unlabeled. The stamp feeds measurement and routing and grants no trust."
    attrs:
