  - id: JC-22
    statement: "Coding agents raise the volume of changes faster than review capacity grows, so review is the bottleneck, and each control must hold or lower the human review load it adds."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Preprint; Published source"
    fallback: "Review capacity stops being the constraint, and the design could route more hunks to people and require fuller review of agent-written changes."
