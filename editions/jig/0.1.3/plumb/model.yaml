    description: "The approved model endpoints the harnesses, the AI reviewer, triage, the hunk-risk advisor and autofix call, each call in its own session. No outside text reaches these sessions, so a response carries no outsider label. The quarantined reader calls a route of its own."
    attrs:
      level: component
      role_class: existing
      trust_zone: shared:third-party
      module: secure-creation
    rests_on:
      - JC-10
      - JC-11
  - id: reader-model-route
