  - id: protected-branch
    name: Protected branch and server-side required checks
    kind: service
    system: shared:EXT
    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: change-boundary
    description: "The only way a change merges: the same suite runs server-side as required checks that the agent cannot skip or reconfigure, and a person who is neither the agent nor its session's developer approves and merges. High-risk hunks also need the sign-off of a qualified person outside the authoring team. Its settings are a requirement, and a declared premise with a test and a fallback: each required check is tied to the app that reports it, the rule is enforced for repository administrators, and no agent identity holds administrator rights or any way to set a check's status. The backstop for a skipped local check and the fallback for every endpoint assumption."
    attrs:
      level: component
      role_class: existing
      trust_zone: shared:existing
      decision: deterministic
      module: secure-creation
      owner_as_written: Policy-owning team
    rests_on:
      - JC-03
      - JC-08
      - JC-14
      - JC-18
      - JC-25
      - JC-27
      - JC-29
