    grade: untested
    source: "Jig premise register (claims.yaml): Peer reviewed study; Preprint"
    fallback: "If analyzers come to catch authorization flaws reliably, fewer hunks go to people; if focused people do not catch them either, Jig leans on spec-derived tests and Ratchet's reproduction for these classes."
    attrs:
