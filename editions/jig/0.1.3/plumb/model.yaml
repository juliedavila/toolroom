      role_class: existing
      trust_zone: shared:existing
      agent_reachable: true
      decision: deterministic
      module: secure-creation
      not_harness: "Holds the coding agent's turn open until the deterministic suite passes on its diff, and sends the agent only the suite's result; it runs no agent session of its own, so it has no harness parity to declare."
      owner_as_written: Policy-owning team
    rests_on:
