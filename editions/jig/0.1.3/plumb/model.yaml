  - id: JC-27
    statement: "Local hooks and harness settings can be skipped, so required checks run server-side on a protected branch are the backstop for every local control and the fallback for every environment assumption; they hold only when nothing acting with the agent's credentials can bypass the branch rule or set a check's status."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Published source; Peer reviewed study"
    fallback: "Jig's rule 1 needs a stronger merge authority than branch protection, such as a merge service the agent's credentials cannot reach."
