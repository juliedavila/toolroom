      premise_group: People and organization
      strength_reason: "Peer-reviewed benchmarks find analyzers detect a small share of real vulnerabilities, a 2026 preprint finds two standard analyzers recall none of 30 recent authorization flaws, and an audit of deployed agent-built apps finds flaws concentrated in access control. For people, an online experiment finds an eightfold detection gain from a security focus and a lab study finds no reviewer catching all flaws; none measures qualified reviewers on routed hunks."
