    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: pr-plane
    description: "Labels each analysis finding for the reviewer's view. A label orders what the reviewer reads first; it never removes a finding from a hunk routed to a person, and it travels to Ratchet as a label on the lead."
