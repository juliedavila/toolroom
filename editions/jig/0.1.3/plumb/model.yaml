  - id: JC-25
    statement: "The author of a change is the agent together with the developer whose session produced it, so whoever merges must be neither; changes reviewed by someone other than their authors carry fewer post-release and security defects."
    kind: premise
    grade: evidence
    source: "Jig premise register (claims.yaml): Peer reviewed study"
