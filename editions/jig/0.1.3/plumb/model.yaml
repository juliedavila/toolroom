    zone: shared:existing
    owner: Policy-owning team
    owner_as_written: Policy-owning team
    parent: secure-creation
    description: "Where the coding agent works in a developer's session, inside a harness, with findings returned to the agent while it is still working and a gate before it may end its turn."
    attrs:
